[package]
name = "menagerie-template-service"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Menagerie's template service: Toha interviews, generation and upgrades over a private Unix socket."

[[bin]]
name = "menagerie-template-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
gix = { version = "0.87.1", default-features = false }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indexmap = "2.14.2"
jiff = "0.2.38"
ring = "0.17"
rustix = { version = "1.1.5", features = ["system", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tempfile = "3.27.0"
thiserror = "2.0.21"
toha = { git = "https://github.com/wyrd-company/toha", rev = "5da83c99a5bdb50a293d82969affa2cb67a4a2e5", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "signal", "fs"] }

[dev-dependencies]
rcgen = "0.14.10"
rustls = "0.23.46"

