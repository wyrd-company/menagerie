# relationships:
#   references: [taskfile]
name: Publish docs

# Publishes docs/ to wyrd.foo for a delivered release: when CD succeeds for
# a pushed release tag, or by dispatch for an existing release tag. The docs
# come from the tag, and only an Intentional release record publishes.
on:
  workflow_run:
    workflows: [CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose docs to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    name: Publish docs to wyrd.foo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # A tag push's CD run names the tag as its head branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          persist-credentials: false
          fetch-tags: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: task release:tag
      - if: steps.check.outputs.release == 'true'
        # ryl disable-line rule:line-length
        uses: wyrd-company/wyrd.foo/.github/actions/publish-docs@fdb54b12e88eaf51a2b22714db63c80aba2ed88a # v1
        with:
          app-id: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
