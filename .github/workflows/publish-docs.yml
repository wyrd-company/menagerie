# relationships:
#   references: [taskfile]
name: Publish docs

# Publishes docs/user/ to wyrd.foo through the wyrd.foo reusable workflow:
# when CD succeeds for a pushed release tag, on a push of a docs tag, and by
# dispatch for an existing tag or commit. The docs come from the ref, and
# only an Intentional release record publishes from a release tag. A plain
# push to main does not publish. The publisher reads the release tag's
# GitHub Release, which CD publishes as its last job: a docs tag on the commit
# of a code tag whose Release is not published leaves the publication to CD's
# success, and a dispatch for a release waits until that Release exists.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CD]
    types: [completed]
  push:
    tags:
      - 'menagerie-docs@*'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
        type: string
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        type: string
        default: ''
      feature-days:
        description: How long the feature lasts, in days
        type: string
        default: '14'
      feature-reason:
        description: For example "New MCP server"; default "New release"
        type: string
        default: ''

permissions: {}

jobs:
  tag:
    name: Check the release tag
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      # A tag push's CD run names the tag as its head branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false
          fetch-tags: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - id: check
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: task release:tag

  docs-tag:
    name: Check the docs tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-tags: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - id: check
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: task release:docs-tag

  publish:
    name: Publish to wyrd.foo
    needs: [tag, docs-tag]
    if: >-
      ${{ !cancelled() && needs.tag.result != 'failure' && needs.docs-tag.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.tag.outputs.release == 'true' ||
      needs.docs-tag.outputs.publish == 'true') }}
    permissions:
      contents: read
    # ryl disable-line rule:line-length
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@5475431d96384e67677e50141ff2c6d7df6bc4b3 # 2.3.0
    with:
      ref: ${{ inputs.ref || github.event.workflow_run.head_branch || github.ref_name }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    secrets:
      WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
      WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
