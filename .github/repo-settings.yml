# Declared repository metadata. Reconciled to GitHub by
# .github/workflows/reconcile-settings.yml on push to the default branch.
#
# This file is the source of truth. Changing settings in the GitHub UI is
# not a change; the next reconcile reverts it.
#
# There is deliberately no `visibility` field. Publishing a repository is an
# unrecoverable act and stays a manual decision.

description: Manages workspaces and fleets of development containers through a web UI.

# Three to eight, with at least one artifact-type and one ecosystem term from
# wyrd-company/.github:airlock/topics.yml.
topics:
  - container
  - docker
  - go
  - rust
  - typescript
  - devops
  - developer-tools

merge:
  squash: true
  rebase: true
  merge_commit: false
  delete_branch_on_merge: true

features:
  wiki: false
  projects: false
  discussions: false
