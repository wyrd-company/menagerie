$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - menagerie
    - configuration
format: json-schema
description: >-
  A template opts in to provisioning by rendering a block at
  `customizations.menagerie` in its `.devcontainer/devcontainer.json`, defined
  by `assets/provisioning-declaration/menagerie-customization.schema.json`. An
  absent block means no provisioning. Unknown keys are errors, so a block that
  this Menagerie cannot read fails the job before any step instead of losing a
  need in silence. Keys are camelCase, as the rest of a devcontainer definition
  is.


  An example, rendered for a workspace called `sample`:


  ```jsonc

  "runArgs": ["--name", "devcontainer-sample"],

  "customizations": {
    "menagerie": {
      "wyrwood": {
        "accessGroup": 1000
      }
    }
  }

  ```


  `wyrwood` is required. Its required `accessGroup` is a whole number from
  0 to 4294967294, the numeric group of the consumer directory and sockets;
  the container's user must have it. The policies are the workspace's stored
  selection in Menagerie, and every new value they read is the workspace's
  name. Its Xolotl key is `<provisioning.xolotl.key-policy>/<workspace name>`,
  recorded once. An imported workspace keeps its policies, values and key.
  Menagerie supplies the key address as `MENAGERIE_XOLOTL_KEY` in the container.


  The schema describes what templates render: only `wyrwood.accessGroup`.
  Menagerie's reader also accepts the legacy `wyrwood.policies`,
  `wyrwood.values` and `xolotl` members with any value, ignores them, and
  names each in the job console. Other unknown keys are errors.


  The container name is not in the block. It is the `--name` value of `runArgs`,
  in either the `--name value` or the `--name=value` form, and a definition with
  a block and no name is refused. The block has no variable substitution: the
  template renders its values. A block in a Compose definition is refused. A
  container name or a Xolotl key belongs to one workspace at a time: Menagerie's
  data records each name it binds and each key it issues as the workspace's, and
  a declaration of a name or a key that the data holds for another workspace,
  or of a name a container of another workspace holds, is refused. What a
  workspace was given is removed by its delete, and by a job that retires it,
  from Menagerie's data, whatever the definition declares by then.
validation-criteria: >-
  The parser tests read a block with and without the three legacy members,
  ignore them and report each, treat an absent block as no provisioning, and
  refuse invalid access groups, unknown keys, Compose, no container name and
  a name held by another workspace. The schema's rendered keys equal the
  keys the parser reads, and the ignored keys are exactly `wyrwood.policies`,
  `wyrwood.values` and `xolotl`.
