$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - menagerie
format: json-schema
description: >-
  The workspace service reads one strict YAML document, by default
  `/etc/menagerie/config.yml` or the path given with `-config`, defined by
  `assets/configuration/menagerie.schema.json`. Unknown keys, a second
  document and an empty document are errors.


  It names the workspace root, the Wyrwood
  consumer directory, the OIDC issuer and client, the HTTP listen address,
  the template service socket, the hook runner socket and the candidate
  folder. Templates and backup repositories are Menagerie's data,
  registered in the interface, never configuration. `workspace-root`
  and `wyrwood-directory` are absolute paths; the workspace root is used as
  written (cleaned, not symlink-resolved) because container labels carry
  the path the host daemon sees, and it is never `/`. Defaults: listen
  `:8080`, template service socket
  `/run/menagerie/template.sock`, hook runner socket
  `template-service.hook-runner-socket` `/run/menagerie/hook-runner.sock`,
  an absolute path other than the template service socket, on which the
  workspace service runs the template service's hooks, candidate folder
  `template-service.candidate-folder` `/var/lib/menagerie/candidates`, an
  absolute clean folder other than `/` that is neither inside
  `workspace-root` nor contains it: the template service's temporary
  folder, where Toha builds an upgrade's candidate, and the only folder in
  which the workspace service runs an upgrade's hooks.


  Optional `runner-image`, at the top level, is a Docker image reference
  such as `alpine:3.22`. Template hooks and `initializeCommand` run in
  throwaway containers of a runner image: a registered template's hooks in
  its own runner image, which is Menagerie's data, set when the template
  is registered and edited in the interface, else the top-level one;
  `initializeCommand` in the top-level one. Absent, both use Menagerie's
  own image, which the workspace service finds by inspecting its own
  container: the container its mounts name, else, only when they name
  none, the container its hostname names when that container carries the
  hostname. A missing image is pulled with `registry-credentials`. The
  template service ignores `runner-image`.


  `templates`, the list of approved templates of earlier releases, keeps
  its shape and its rules in the schema, where it is deprecated, and in the
  workspace service's parser, so a file that still has it parses: each
  entry has a unique `id` of lower-case letters and digits separated by
  single dashes, a display `name`, a Toha `address` and an optional
  `runner-image`, and the list can be empty. The workspace service reads
  it only for its first-start import, which takes it over once, at the
  first start whose Menagerie data has no templates import, and records
  that it did, so a later edit of the key imports nothing. The import asks
  the template service to read each entry's address, waiting up to one
  minute for it, each read bounded by what remains of that wait, and a
  start that does not reach it, or whose read it takes and does not answer
  within the wait, fails, so the next start imports. An entry whose address the template service refuses,
  answering `invalid-address`, a password in it included, is skipped, and
  the start log names its `id` and the refusal's kind, never its address.
  Any other error reply, a fault such as `internal-error` or `io-failed`
  included, fails the start, naming the entry's `id` and the reply's status
  and kind, and records nothing, so the next start imports it. The entries that have one
  source are one template: the newest entry whose ref is a version gives
  its current version, `id`, name and runner image, and its address is
  that entry's without the ref. A source with no entry whose ref is a
  version, such as one pinned to a branch, a commit or a tag like `v1`, is
  not imported, and the start log names its entries' `id`s; a manager
  registers that template in the interface once its repository has a
  version tag, which joins its workspaces. An entry's `runner-image` is
  read only by the import. Every start that finds the key logs one warning
  that names it and says that templates are registered in the interface.
  The template service reads nothing of `templates`.


  Optional `workspace-repository`, deprecated in the schema, is the one
  Git remote that every workspace backed up to in earlier releases. The
  workspace service reads it only for its first-start import, at the first
  start whose Menagerie data has no backup repository import: the URL is
  registered as a backup repository with no check, named by its path
  without a leading slash, its query and fragment and a `.git` suffix,
  unless a registration has that URL, and every workspace with no backup
  repository, each workspace folder included, then backs up to it. The import records that it ran, with or without the key, so a later
  edit imports nothing. Every start that finds the key logs one warning
  that says backup repositories are registered in the interface.


  `oidc` names the identity provider and Menagerie's public client, which
  has no secret. `issuer` is an http or https URL whose discovery document
  names the same issuer; `client-id` is the client's id; `redirect-url` is
  the redirect URI registered for the client, an http or https URL with a
  host, no user information, query or fragment, and exactly the path
  `/auth/callback`. Its origin is the one browsers use for Menagerie, and
  an `https` scheme makes every Menagerie cookie `Secure`. Optional
  `scopes` lists the requested scopes, which must include `openid`;
  absent, Menagerie requests `openid profile groups`. There is no
  client-secret key.


  Optional `registry-credentials` names the OpenBao secrets that hold
  container registry credentials. `kv-mount` is a KV version 2 mount path
  and `registries` lists `{registry, path}` entries: `registry` is a host or
  host:port, compared in lower case, where `docker.io`, `index.docker.io`,
  `registry-1.docker.io` and `https://index.docker.io/v1/` all name Docker
  Hub, and two entries may not name one registry; `path` is the secret's
  path in the mount, whose string fields `username` and `password` hold the
  credentials. Mount and paths are slash-separated segments without empty,
  `.` or `..` segments. Menagerie reads them through the OpenBao API at the
  Wyrwood vault socket, `unix://{wyrwood-directory}/vault.sock`, sending no
  token and no namespace: Wyrwood supplies the binding's token and renews
  it. A registry that no entry names is anonymous; without the section,
  every registry is. The template service ignores this section.


  Optional `local-env` lists the variables of the workspace service's own
  environment that a devcontainer definition may read through
  `${localEnv:NAME}` or `${env:NAME}`. Each entry matches
  `^[A-Za-z_][A-Za-z0-9_]*$` and appears once. Absent, a definition reads
  no variable. The listed variables also reach `initializeCommand`, except
  `PATH`, which is always the runner image's own. The template service
  ignores this list.


  Optional `job-limits` limits the running time of jobs. A limit times
  Menagerie's work, never the manager answering an interview: time in
  `waiting-for-answers` does not count, and no deadline applies while a job
  waits. Interviews keep no expiry. `default` limits every operation
  without its own limit; `operations` gives `start`, `stop`, `rebuild`,
  `create`, `upgrade`, `commit`, `apply-branch`, `apply-policies`, `delete` or `move-backup` its own limit, which
  replaces `default`; `phases`
  limits each stay in a phase, counted from each entry into the phase
  (an answered interview enters `interview` again), inside any operation.
  The phase names are `read-definition`, `issue-key`, `bind`, `initialize-command`, `build`,
  `unbind`, `remove-container`, `revoke-key`, `remove-folder`, `create-container`, `wait-for-sockets`, `up`, `verify`, `retire`, `stop`, `interview`, `initialize-repository`,
  `generate`, `host-prerequisites`, `fetch`, `plan`, `apply`, `commit`, `backup-local-changes`,
  `backup` and `switch`.
  Template hooks run inside `generate` and `apply`. A duration is positive
  whole hours, minutes and seconds in that order, such as `2h`, `45m` or
  `1h30m`. Unknown operation and phase keys are errors, and so is a key
  given without a value (`rebuild:` or `default: ""`), also through an
  alias or a merge key. Absent, no job has
  a limit. The workspace API describes what a job past a limit does.


  Optional `alerts` names a `webhook`, an http or https URL with a host,
  that receives one JSON POST for each job that ends `failed`, timed-out
  jobs included. With `long-running`, a duration, it also receives one
  alert when a job's running time passes it. The body is
  `{"event": "job-failed" | "job-long-running", "jobId", "workspace",
  "operation", "phase", "state", "error": {"kind", "message"} | null,
  "console"}`, where `console` is the browser address of the job's
  console: the origin of `oidc.redirect-url` followed by `/?job={id}` for
  start, stop, rebuild, commit, apply-branch, apply-policies and delete, `/create?job={id}` for create and
  `/workspaces/{name}/upgrade?job={id}` for upgrade. Alerts wait in one
  queue of 64 and one background sender posts them in the order they were
  raised, so a job's `job-long-running` alert is posted before its
  `job-failed` alert. Delivery never delays or fails a job: an alert
  raised while the queue is full is dropped with a log line. Each alert
  gets one attempt with a 10 second time limit; a redirect ends the
  attempt and is not followed. At shutdown the service waits at most
  10 seconds for the queue, and logs each alert it drops. A failed attempt
  writes one line to the service log that names only the failure:
  `timeout`, `transport error`, `redirect refused`, `status {code}` or
  `shutting down`. The URL can carry a credential, so it never appears in
  a log, an event, an error or an API response. No configuration error
  quotes the value of `webhook` or of a duration, a wrongly tagged one or
  one an anchor shares with another field included: an error names the
  field and what it expects, and a YAML decoding error names the line, the
  field when known and the expected type. Ended and succeeded jobs send nothing. `webhook` is required
  in the section.


  Optional `auto-commit` schedules commits: `every`, a duration and
  required in the section, is the time between two sweeps of the
  workspace root, the first one interval after start-up. Each sweep starts
  a commit job, with the message `chore(menagerie): automatic commit`, on
  every workspace that has no unfinished job and has a change to commit;
  a busy workspace waits for the next sweep. Absent, no commit is
  scheduled.


  Optional `template-versions` schedules the version checks of every
  registered template: `every`, a duration and required in the section, is
  the time between two checks, the first at start-up. Absent, `every` is
  `1h`. Each check lists the template's repository's versions, as the
  workspace API describes. No error of the field quotes its value.


  Optional `workspace-socket` gives each workspace's devcontainer a socket
  that commits and backs up its own workspace, as the workspace API
  describes. `folder`, required in the section, is an absolute clean
  folder other than `/`, without a comma, that is neither inside nor
  contains `workspace-root`, `wyrwood-directory` or
  `template-service.candidate-folder`. It has the same path on the host
  and in Menagerie's container, exists when the workspace service starts
  and is a folder of the services' user, not itself a symbolic link, with
  every folder above it, its links resolved, a folder of root or the
  services' user that no other user can write unless it is sticky; the
  service sets its mode to 0700 and refuses to start otherwise. Resolved,
  it is neither inside nor contains the resolved `workspace-root`. `min-interval` is
  the shortest time between two accepted commits of a workspace through
  its socket: a duration, or `0` for none; absent, `1m`. Neither field's
  value appears in a configuration error, and the start-up checks of the
  socket folder name the field and the rule, never the path or an
  operating system error's text. No decoding error names an anchor: an
  unknown alias or an anchor that holds its own alias is reported with a
  fixed text.


  Optional `provisioning` names what provisioning a workspace uses on this
  host. Its optional `readiness-wait`, a duration, absent `2m`, bounds each wait
  on a binding's status; it times the host, never a person. Its optional `wyrwood` locates the controller that holds workspaces'
  bindings and selects the operator key: `controller` is `ssh://host[:port]`,
  with port 22 when absent and nothing else in the value; `host-key` is the
  controller's SHA256 fingerprint, as `wyrwood controller host-key` prints it,
  and a controller presenting another is refused before any key is offered;
  `agent` is the name of this host's Wyrwood agent, a host name of letters,
  digits, hyphens and dots; `operator-key` selects one key on `ssh-agent.sock`
  in `wyrwood-directory` by its name, public key or SHA256 fingerprint, on one
  line with no white space at either end. Menagerie offers the controller only that
  key, and proposes `menagerie-<agent>` as its label, or `menagerie` when that
  is too long. Each operation opens its own connection, and the connection to
  the agent, the connection to the controller and each request have 30 seconds.
  A key with no approval, a call outside the grant, a host key that differs and
  a key the selection does not find each fail with the operation and the
  container name, and a key with no approval also with the key's fingerprint.
  Text from a refusal is kept to one line of 200 characters.


  Its optional `xolotl` locates the Xolotl that issues and revokes
  workspaces' client keys: `url` is an http or https URL with a host and no
  user information, query or fragment, and `key-secret` names, with `kv-mount`
  and `path`, the secret whose string field `api_key` holds Menagerie's scoped
  key. Its optional `key-policy` is the policy of this host's workspace
  client keys: 1 to 63 lowercase letters, digits, `_` or `-`, starting with
  a letter or digit. Without it a job that must name a new key fails as
  `provisioning-unavailable`, and start-up logs a warning naming the setting.
  Without `xolotl`, workspaces get no new key. Mount and path follow the rule of `registry-credentials`. Menagerie
  reads the secret through the Wyrwood vault socket for each operation on a
  key and keeps the scoped key in memory for that operation only. The scoped
  key goes only to `url`: a redirect ends the operation and is not followed.
  The scoped key, and text from an answer, appear in no log, event or error.
  Each read of the secret and each request has 30 seconds. Menagerie sends a
  request up to three times, one second apart, while Xolotl answers 409 or
  500. No connection, no answer in time, and a 502, 503 or 504 count as
  Xolotl being out of reach. The template service ignores this section.


  Optional `github-app` names a GitHub App whose installation tokens
  authenticate backups and template fetches to `https` repository URLs on
  its server: a URL whose path is exactly `/{owner}/{repo}` or
  `/{owner}/{repo}.git`, with no query or fragment. A backup URL must also
  have no user information; one with a user name gets no token. A template
  address may have a user name: the template service asks for the token by
  the address without it, so a user name does not opt out. Other URLs keep their own authentication, so SSH and the App can both be
  in use. `app-id`, a positive integer, and `transit-key`, the name of the
  RSA Transit key at the mount `transit` that holds the App's private key
  (letters, digits, `_`, `.` and `-`, starting with a letter or digit, at
  most 128 characters), are required in the section. Optional
  `installations` maps an account name to the App's installation id, a
  positive integer; names are GitHub account names, compared in lower
  case, and appear once. A repository whose owner is not listed has its
  installation looked up. Optional `server` is the GitHub server's origin,
  an `https` URL with a host and no user information, path, query or
  fragment; absent or empty, `https://github.com`. The API is
  `https://api.github.com` for `https://github.com` and `{server}/api/v3`
  otherwise. The workspace service signs the App's JWT through the Wyrwood
  vault socket, `unix://{wyrwood-directory}/vault.sock`, with
  `transit/sign/{transit-key}/sha2-256`, sending no token and no
  namespace. No error of the section names a value: an error names the
  field and the rule. The template service ignores this section.
validation-criteria: >-
  `go test ./backend/internal/config/` parses a valid document, applies the
  defaults, rejects each invalid field, tells a document with the
  `templates` key, even empty, from one without, and checks that the schema's keys
  equal the keys the parser accepts and that its default scopes equal the
  scopes the workspace service requests, that the schema's phase keys and
  the phase names above equal the phases the jobs package names, that its
  operation keys equal the API's operations and that its duration pattern
  is the parser's and refuses an empty value. `go test
  ./backend/internal/alerts/` checks the alert body, console links, that
  alerts arrive in the order sent, that a full queue drops with a log line,
  that shutdown waits one time limit and that no delivery failure, a
  redirect whose malformed Location holds the URL included, logs the URL.
  The config tests also check that no invalid `webhook` value appears in
  the error, also when an anchor shares it with each duration field or
  makes it a key, and that an empty duration given through an alias or a merge
  key is refused. They parse `auto-commit`, `workspace-socket` and the
  `commit` limit, and check that no error of those fields quotes the
  value given. They parse `template-versions`, apply its default when it
  is absent, and refuse an empty, missing, malformed or zero `every` and
  an unknown member without quoting the value given. They parse `github-app` with its default server and check
  that no error of the section quotes the value given.
  `go test ./backend/internal/registry/` imports the `templates` key once
  as one template per source at its newest version, skips and names by
  `id` alone each refused entry and each source with no version, joins the
  workspaces of an imported source, fails a start that cannot reach the
  template service, or that a fault or any error reply but
  `invalid-address` answers, naming the entry by `id` and not by the
  reply's message, and imports at the next one, fails within the wait a
  start whose template service takes a read and never answers, asks again
  a service that comes up during the wait, and marks a host with no key
  without asking the template service;
  `scripts/prove-template-registry-guards.py` breaks each of those import
  guards, and the guards of a registration's or upgrade's check alone, in
  turn and requires its test to fail. The `templateservice`
  tagged `TestAHiddenPasswordReachesNoChannel` registers and imports
  addresses whose password Git reads as part of a path, or a user name's
  escapes hide, against the real template service, and finds the password
  in no reply, data, log or Git request.
  `go test ./backend/cmd/menagerie/` checks that `local-env` reaches the
  devcontainer runtime, that `job-limits` and `alerts` reach the jobs
  manager, and that `github-app` gives backups on its server a write token
  and the hook runner socket's credential route read tokens.
