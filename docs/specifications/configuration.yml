$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - menagerie
format: json-schema
description: >-
  The workspace service reads one strict YAML document, by default
  `/etc/menagerie/config.yml` or the path given with `-config`, defined by
  `assets/configuration/menagerie.schema.json`. Unknown keys, a second
  document and an empty document are errors.


  It names the workspace root, the workspace repository, the Wyrwood
  consumer directory, the approved template list, the OIDC issuer and client,
  the HTTP listen address, the template service socket, the hook runner
  socket and the candidate folder. `workspace-root`
  and `wyrwood-directory` are absolute paths; the workspace root is used as
  written (cleaned, not symlink-resolved) because container labels carry
  the path the host daemon sees, and it is never `/`. Each template has a
  unique `id` of lower-case letters and digits separated by single dashes, a
  display `name`, a Toha `address` and an optional `runner-image`; the list
  can be empty. Defaults: listen `:8080`, template service socket
  `/run/menagerie/template.sock`, hook runner socket
  `template-service.hook-runner-socket` `/run/menagerie/hook-runner.sock`,
  an absolute path other than the template service socket, on which the
  workspace service runs the template service's hooks, candidate folder
  `template-service.candidate-folder` `/var/lib/menagerie/candidates`, an
  absolute clean folder other than `/` that is neither inside
  `workspace-root` nor contains it: the template service's temporary
  folder, where Toha builds an upgrade's candidate, and the only folder in
  which the workspace service runs an upgrade's hooks.


  Optional `runner-image`, at the top level and on a template, is a Docker
  image reference such as `alpine:3.22`. Template hooks and
  `initializeCommand` run in throwaway containers of a runner image: a
  template's hooks in its own `runner-image`, else the top-level one;
  `initializeCommand` in the top-level one. Absent, both use Menagerie's
  own image, which the workspace service finds by inspecting its own
  container: the container its mounts name, else, only when they name
  none, the container its hostname names when that container carries the
  hostname. A missing image is pulled with `registry-credentials`. The
  template service ignores `runner-image`.


  `oidc` names the identity provider and Menagerie's public client, which
  has no secret. `issuer` is an http or https URL whose discovery document
  names the same issuer; `client-id` is the client's id; `redirect-url` is
  the redirect URI registered for the client, an http or https URL with a
  host, no user information, query or fragment, and exactly the path
  `/auth/callback`. Its origin is the one browsers use for Menagerie, and
  an `https` scheme makes every Menagerie cookie `Secure`. Optional
  `scopes` lists the requested scopes, which must include `openid`;
  absent, Menagerie requests `openid profile groups`. There is no
  client-secret key.


  Optional `registry-credentials` names the OpenBao secrets that hold
  container registry credentials. `kv-mount` is a KV version 2 mount path
  and `registries` lists `{registry, path}` entries: `registry` is a host or
  host:port, compared in lower case, where `docker.io`, `index.docker.io`,
  `registry-1.docker.io` and `https://index.docker.io/v1/` all name Docker
  Hub, and two entries may not name one registry; `path` is the secret's
  path in the mount, whose string fields `username` and `password` hold the
  credentials. Mount and paths are slash-separated segments without empty,
  `.` or `..` segments. Menagerie reads them through the OpenBao API at the
  Wyrwood vault socket, `unix://{wyrwood-directory}/vault.sock`, sending no
  token and no namespace: Wyrwood supplies the binding's token and renews
  it. A registry that no entry names is anonymous; without the section,
  every registry is. The template service ignores this section.


  Optional `local-env` lists the variables of the workspace service's own
  environment that a devcontainer definition may read through
  `${localEnv:NAME}` or `${env:NAME}`. Each entry matches
  `^[A-Za-z_][A-Za-z0-9_]*$` and appears once. Absent, a definition reads
  no variable. The listed variables also reach `initializeCommand`, except
  `PATH`, which is always the runner image's own. The template service
  ignores this list.


  Optional `job-limits` limits the running time of jobs. A limit times
  Menagerie's work, never the manager answering an interview: time in
  `waiting-for-answers` does not count, and no deadline applies while a job
  waits. Interviews keep no expiry. `default` limits every operation
  without its own limit; `operations` gives `start`, `stop`, `rebuild`,
  `create`, `upgrade`, `commit` or `apply-branch` its own limit, which
  replaces `default`; `phases`
  limits each stay in a phase, counted from each entry into the phase
  (an answered interview enters `interview` again), inside any operation.
  The phase names are `read-definition`, `initialize-command`, `build`,
  `remove-container`, `up`, `stop`, `interview`, `initialize-repository`,
  `generate`, `fetch`, `apply`, `commit`, `backup-local-changes` and
  `backup`.
  Template hooks run inside `generate` and `apply`. A duration is positive
  whole hours, minutes and seconds in that order, such as `2h`, `45m` or
  `1h30m`. Unknown operation and phase keys are errors, and so is a key
  given without a value (`rebuild:` or `default: ""`), also through an
  alias or a merge key. Absent, no job has
  a limit. The workspace API describes what a job past a limit does.


  Optional `alerts` names a `webhook`, an http or https URL with a host,
  that receives one JSON POST for each job that ends `failed`, timed-out
  jobs included. With `long-running`, a duration, it also receives one
  alert when a job's running time passes it. The body is
  `{"event": "job-failed" | "job-long-running", "jobId", "workspace",
  "operation", "phase", "state", "error": {"kind", "message"} | null,
  "console"}`, where `console` is the browser address of the job's
  console: the origin of `oidc.redirect-url` followed by `/?job={id}` for
  start, stop, rebuild, commit and apply-branch, `/create?job={id}` for create and
  `/workspaces/{name}/upgrade?job={id}` for upgrade. Alerts wait in one
  queue of 64 and one background sender posts them in the order they were
  raised, so a job's `job-long-running` alert is posted before its
  `job-failed` alert. Delivery never delays or fails a job: an alert
  raised while the queue is full is dropped with a log line. Each alert
  gets one attempt with a 10 second time limit; a redirect ends the
  attempt and is not followed. At shutdown the service waits at most
  10 seconds for the queue, and logs each alert it drops. A failed attempt
  writes one line to the service log that names only the failure:
  `timeout`, `transport error`, `redirect refused`, `status {code}` or
  `shutting down`. The URL can carry a credential, so it never appears in
  a log, an event, an error or an API response. No configuration error
  quotes the value of `webhook` or of a duration, a wrongly tagged one or
  one an anchor shares with another field included: an error names the
  field and what it expects, and a YAML decoding error names the line, the
  field when known and the expected type. Ended and succeeded jobs send nothing. `webhook` is required
  in the section.


  Optional `auto-commit` schedules commits: `every`, a duration and
  required in the section, is the time between two sweeps of the
  workspace root, the first one interval after start-up. Each sweep starts
  a commit job, with the message `chore(menagerie): automatic commit`, on
  every workspace that has no unfinished job and has a change to commit;
  a busy workspace waits for the next sweep. Absent, no commit is
  scheduled.


  Optional `workspace-socket` gives each workspace's devcontainer a socket
  that commits and backs up its own workspace, as the workspace API
  describes. `folder`, required in the section, is an absolute clean
  folder other than `/`, without a comma, that is neither inside nor
  contains `workspace-root`, `wyrwood-directory` or
  `template-service.candidate-folder`. It has the same path on the host
  and in Menagerie's container, exists when the workspace service starts
  and is a folder of the services' user, not itself a symbolic link, with
  every folder above it, its links resolved, a folder of root or the
  services' user that no other user can write unless it is sticky; the
  service sets its mode to 0700 and refuses to start otherwise. Resolved,
  it is neither inside nor contains the resolved `workspace-root`. `min-interval` is
  the shortest time between two accepted commits of a workspace through
  its socket: a duration, or `0` for none; absent, `1m`. Neither field's
  value appears in a configuration error, and the start-up checks of the
  socket folder name the field and the rule, never the path or an
  operating system error's text. No decoding error names an anchor: an
  unknown alias or an anchor that holds its own alias is reported with a
  fixed text.
validation-criteria: >-
  `go test ./backend/internal/config/` parses a valid document, applies the
  defaults, rejects each invalid field, and checks that the schema's keys
  equal the keys the parser accepts and that its default scopes equal the
  scopes the workspace service requests, that the schema's phase keys and
  the phase names above equal the phases the jobs package names, that its
  operation keys equal the API's operations and that its duration pattern
  is the parser's and refuses an empty value. `go test
  ./backend/internal/alerts/` checks the alert body, console links, that
  alerts arrive in the order sent, that a full queue drops with a log line,
  that shutdown waits one time limit and that no delivery failure, a
  redirect whose malformed Location holds the URL included, logs the URL.
  The config tests also check that no invalid `webhook` value appears in
  the error, also when an anchor shares it with each duration field or
  makes it a key, and that an empty duration given through an alias or a merge
  key is refused. They parse `auto-commit`, `workspace-socket` and the
  `commit` limit, and check that no error of those fields quotes the
  value given.
  `go test ./backend/cmd/menagerie/` checks that `local-env` reaches the
  devcontainer runtime and that `job-limits` and `alerts` reach the jobs
  manager.
