  own branch leaves the workspace repository as it was; refusals and
  request checks; the forward-only check, which refuses an older, removed,
  unreadable, other-source and untagged record, a record of a workspace
  with no registered template, and one of an unknown applied version whose
  commit does not descend, each with nothing changed, and records the
  version of a record that moves forward; and
  every failure path, with a workspace repository address that carries a
  sentinel, has no event or error that names it. `go test -tags docker
  ./backend/internal/devcontainer/` also has a devcontainer commit a file
