  the test's SSH host and one whose hook moves the branch after the push,
  each keeping the workspace's repository;
  `scripts/prove-backup-repository-guards.py` breaks each of those guards,
  the write check's deletion of its ref and the data's foreign key in turn
  and requires its test to fail.
