  the same, a sweep commit a workspace left dirty, each onto the backup
  branch, an `initializeCommand` find no socket, and a start keep a
  single container and a Compose primary created without the socket, with
  the same container id, until a rebuild gives it the socket. `go test
  ./backend/internal/backuprepos/ ./backend/internal/api/` registers a
  backup repository over the test's SSH host with its key, refuses each
  URL form the routes refuse, a credential that does not fit the URL and a
  repository Menagerie cannot write to with the credential given though
  the agent's other key could, stores nothing for a check, changes a
  credential only after its checks pass, lists the credentials, and
  refuses removing one a workspace backs up to; `go test
  ./backend/internal/gitcreds/` lists the agent's keys without the
  operator key, refuses each credential that does not fit a URL, and sends
  only the named App's token; `go test ./backend/internal/backup/` offers
  the test's SSH host only the repository's key from an agent whose first
  key is another; `go test
  ./backend/internal/workflows/` has a create record its repository from
  its start and take the only registered one, and moves a workspace's
  backups to an empty repository, refuses one whose branch holds another
