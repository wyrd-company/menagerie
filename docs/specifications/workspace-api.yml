  templates in throwaway containers, and a hook that never ends under a
  short `generate` limit: the job ends timed-out with no hook container
  left and no write to the folder after it. `go test
  ./backend/internal/commits/ ./backend/internal/workspacesocket/
  ./backend/cmd/workspace-commit/` covers the commit job's phases and
