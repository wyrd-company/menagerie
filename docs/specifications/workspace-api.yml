  environment find none, while they still write into the workspace folder;
  that a script hook runs from its copied template; that an upgrade's
  hook changes only its candidate, which then holds exactly what it left;
  that a revoked hook
  leaves no container and stops writing; that the Engine's failure to start
  a hook named by a captured value, and a working directory linked out of
  the folder, reach no refusal or console line; and that start-up removes
  only its own root's leftovers. `go test -tags templateservice
  ./backend/internal/workflows/` also drives a captured value into an
  invalid, missing and linked later working directory and a failing hook's
  arguments, and finds it in no job error or event. `go test -tags
