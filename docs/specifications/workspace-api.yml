$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - menagerie
    - t3-code-pairing-token
    - configuration
    - job-without-timeout-blocks-workspace
    - authentication
    - template-service-api
    - backup-force-push-overwrites-branch
    - workspace-fills-its-backup-branch
    - choose-a-backup-repository-per-workspace
    - choose-a-credential-per-backup-repository
format: openapi
description: >-
  The workspace service serves a JSON API to the browser, defined by
  `assets/workspace-api/openapi.yaml`. Every error answers with the envelope
  `{"error":{"kind","message"}}`; `workspace-busy` adds `activeJobId`.


  Every route except `GET /healthz` requires a manager session, as the
  authentication specification defines. Without one an API request answers
  401 `unauthenticated` and the browser signs in at
  `/auth/login?return=<page>`; a page request is redirected there. A
  request that changes state from another origin answers 403
  `cross-origin-request`. Neither runs an operation or reads a job.


  `GET /api/workspaces` lists every folder directly under the workspace root
  whose name does not start with a dot, sorted by name. Each folder is joined to the newest container whose
  `devcontainer.local_folder` label equals the folder path; its state is
  `running`, `stopped` or `no-container`. The service asks Docker only about
  root folders, so a container labelled for any other path, or without the
  label, never appears. Each folder is also joined to its workspace in
  Menagerie's data, and gets one when it is first listed. A workspace in the
  data whose folder is gone and that still holds a container name or a Xolotl
  key is listed too, in name order with the folders, with `state` `no-folder`
  and `containerId` null, so that a `delete` can remove what it holds; one
  that holds neither and that no create is making leaves the data.
  `template` is the workspace's registered template, `{id, name}`, or null.
  A folder listed for the first time joins the registered template whose
  source its applied record `.toha.json` names for the workspace's root; a
  workspace whose record names a source no registered template has keeps
  working, with `template` null, and joins its template when a manager
  registers that source. `backupRepository` is the registered backup
  repository the workspace backs up to, `{id, name, url}`, or null for a
  workspace Menagerie found with no recorded repository. `appliedVersion` is the template version last
  applied to the workspace: the version its create generated, its last
  upgrade applied or its last Apply branch's record gives. Every path that
  takes `appliedVersion` from a workspace's applied record, a join
  (registration, a folder listed for the first time, the templates import),
  the first start's import of applied versions and Apply branch, follows
  one rule: the record's source must be the template's source and its
  commit a full Git object id, and the version is the template's found
  version whose tag is at that commit; when the record's ref is a version
  it must be that version, and when it is not and several tags share the
  commit, the version is the newest of them. A join and the import leave
  `appliedVersion` null when the record gives no version, keeping the
  record's commit only when its source is the template's and the commit is
  well formed, and the template's next version check completes it.
  `appliedCommit` is that version's commit, or the record's, or null when
  neither is known. `needsUpgrade` is true while the workspace
  has a template whose current version is newer than its `appliedVersion`,
  and false while `appliedVersion` is null.
  `activeJob` names the workspace's unfinished job. When Docker cannot
  answer, the request fails with `docker-unavailable` (503).


  `POST /api/workspaces/{name}/t3-code-pairing-tokens` mints a
  [T3 Code pairing token](../terms/t3-code-pairing-token.yml) in the
  workspace's running container and answers 201 with `{"token","expiresAt"}`
  and `Cache-Control: no-store`. The service reads the service user and home
  from `/usr/local/lib/t3code-server/config.env`, which the t3code-server
  Feature writes, through the Docker library. It then runs
  `/usr/local/bin/t3 auth pairing create --base-dir <home>/.t3 --label
  menagerie --json` as that user through Docker exec. The token has T3 Code's
  default scopes and lifetime. It is not a job and takes no job slot, so it
  also works while the workspace has a job. The service logs and keeps no
  token, and no error holds what the command printed. An invalid or absent
  workspace answers 400 `invalid-workspace-name` or 404
  `workspace-not-found`. A stopped or absent container answers 409
  `workspace-not-running`; a container without the Feature or the command
  409 `t3-code-not-installed`; a command that gives no token 502
  `pairing-token-failed`; and Docker's failure 503 `docker-unavailable`. The
  request has no time limit of its own: when its client leaves, the service
  stops waiting, and a command that hangs stays in the container.


  `GET /api/policies` reads Wyrwood afresh and answers 200 with `grant`,
  `policies` and `settings`. Without `provisioning.wyrwood`, `grant` is null;
  otherwise it has `agents`, `policies` and `actions`, lists of strings with
  `["*"]` standing for every name. Each policy has `name`, `valueNames` (the
  names of its per-binding values) and `inGrant`. The list includes policies
  Wyrwood lists inside the grant and policies referenced by the settings or
  any stored selection that are outside it or missing, with `inGrant` false.
  An unreadable grant or policy list answers 503 `wyrwood-unavailable`.


  `PUT /api/policies/settings` takes `required`, `groups` and `revision` and
  answers 200 with the saved settings and incremented revision. Each group
  has a unique one-line name of 1 to 100 characters, a `mode` of `single`
  (exactly one choice) or `multi` (at least one), and a nonempty `policies`
  list. A new group omits `id`; Menagerie assigns an integer ID it never
  reuses. A policy is required, in one group, or neither. Duplicate policies,
  a policy both required and in a group or in two groups, an empty group,
  duplicate group names, an unknown mode or ID, or an invalid group name
  answer 422 `invalid-settings`, naming the rule. Malformed requests answer
  400 `invalid-request`; an older revision 409 `settings-changed`; no
  `provisioning.wyrwood` 409 `provisioning-unavailable`; and an unreadable
  grant or policy list 503 `wyrwood-unavailable`. The grant is read again for
  each change. A policy newly added to required policies or to a group
  outside the grant or absent from Wyrwood answers 422 `policy-outside-grant`, naming every such policy,
  before any job runs. A referenced policy that leaves the grant remains
  visible and can be removed from settings.


  Adding required policies adds them to every stored workspace selection in
  the same transaction, incrementing each changed selection's revision once.
  Removing a requirement retains the policy in each selection. A discovered
  workspace begins with required policies. `Workspace.policies` is its stored
  selection, an empty list included; `needsChoice` lists group names without
  a valid choice. Required policies and groups are the only selection rules;
  a selection can be empty and no policy is treated specially.


  A create accepts `policies`, a unique list of policy names, empty when
  absent, with group choices and ordinary policies; Menagerie adds required
  policies. A missing or invalid group choice is 422 `policy-choice-required`,
  naming the group; a policy outside the grant is 422 `policy-outside-grant`;
  policies without `provisioning.wyrwood` are 409 `provisioning-unavailable`;
  an unreadable grant is 503 `wyrwood-unavailable`. With host provisioning a
  workspace name is 1 to 63 lowercase letters, digits, `_` or `-`, starting
  with a letter or digit, else 400 `invalid-workspace-name`. No policy is not
  a create refusal. A template upgrade preserves the stored selection.


  `PUT /api/workspaces/{name}/policies` takes `policies` and its `revision`.
  A pending selection is imported before checking the revision: an older
  read is 409 `selection-changed`, and an unreadable Wyrwood during import
  is 503 `wyrwood-unavailable` with nothing stored. Other errors are 400
  `invalid-request`, 404 `workspace-not-found`, 409 `provisioning-unavailable`
  without Wyrwood, 422 `policy-required` naming a required policy removed,
  422 `policy-choice-required` naming a previously valid group made invalid,
  and 422 `policy-outside-grant` naming newly added policies. Success is
  200 `{selectionRevision, jobId}`, with the apply job's ID or null while
  queued behind the workspace's running job. Each edit increments its
  revision, and can remove its last policy. Marking a policy required
  queues an apply on each selection it changes. Failed applies are retried
  by a manager, start-up, a selection change or a provisioning job.


  `Workspace` has `selectionRevision`, nullable `appliedRevision`, nullable
  `applyFailure` (`{kind,message}`), `selectionImported` and nullable
  `xolotlKey` (the stored policy/name address, never a secret). `needsChoice`
  is empty until import completes. A binding holds its selection when
  its applied revision equals the stored selection revision.


  The one-phase `apply-policies` job runs `bind`, reads the stored selection,
  values and revision and a fresh grant. A selected policy outside it fails
  as `policy-outside-grant` before a binding request. With no current
  container name it records the revision. Otherwise it resolves the binding
  by recorded ID and then the name, and keeps the binding's access group,
  even when the definition no longer parses or declares provisioning. A
  missing binding needs an accepted declaration naming the current name,
  for any selection, else `provisioning-invalid` with no request. It then
  sends `bind`. A stale ID after a successful change is resolved again
  within the once-only retry. A hidden binding fails as
  `binding-outside-grant`, without advancing the applied revision.


  Both provisioning `bind` and `apply-policies` converge on the whole
  selection, its values and the job's access group. Provisioning uses the
  accepted declaration's group. Matching applied bindings are not written;
  matching pending bindings get `binding-change` to finish them. Other
  bindings get `binding-change` at their read revision, preserving their
  other settings. `revision-differs` or `binding-differs` is decided again
  once, then fails as `binding-changed`. Pending assignments are retried
  three times one second apart within `provisioning.readiness-wait`, then
  fail as `binding-pending`; the next apply finishes a saved assignment.
  Menagerie sends an empty selection like any other; Wyrwood 0.7.1 refuses
  it as `binding-refused`, with its answer on one line in the console and
  `applyFailure`, leaving the binding unchanged and the selection stored
  but unapplied. Operator-key errors retain their specific messages.
  Menagerie records no removal from a read. `appliedRevision` advances only
  without a current name or after a read proves the binding holds the
  selection, values, group and `applied`. The console names each policy,
  value and access-group change. A Wyrwood-side edit is replaced by the
  next apply or provisioning job.


  Templates. Only registered templates can be used, and registering,
  upgrading, editing or removing one needs no configuration change and no
  restart. `GET /api/templates` lists them sorted by name, as letters
  without regard to case, then by name and `id`,
  each with `id`, `name`, `address`, the address without a ref,
  `currentVersion`, `runnerImage`, null for the default, `workspaces`,
  the names of the workspaces that use it, `versions`, the found versions,
  each `{version, tag, commit}`, in ascending order, `newestVersion`, the
  last of them or null when none is found, `currentMoved`, whether the last
  successful version check found the current version's tag at another
  commit than the recorded one, and `lastCheck`, null before the first
  check, else `{at, failure}`: when the last check ended, and null for a
  check that succeeded or the reason one failed, `template-not-found`,
  `template-resolve-failed`, `invalid-address` or
  `template-service-unavailable`. A version is a release tag of the
  template's repository, `MAJOR.MINOR.PATCH` with an optional leading `v`,
  as the template service lists them.


  Version checks. The workspace service checks every registered template
  for new versions when it starts, then every `template-versions.every`
  (see the configuration specification), and `POST
  /api/templates/{id}/version-checks`, with no body, checks one on
  request, with no restart. Two checks of one template at once share one
  run. A check lists the repository's versions through the template
  service, and they replace the template's found versions. A failed check
  keeps the found versions and records its time and reason: the template
  service's refusal kind, or `template-service-unavailable` when the
  service cannot be reached, answers a fault, answers a listing whose
  versions are not each a version, a tag and a full commit id, or does not
  answer within two minutes. The route answers 200 with the template, whose `lastCheck`
  records the outcome, whatever it is, so it has no 503; an id no template
  has is 404 `unknown-template`. A registration records the versions it
  listed as its first check. An imported template's current commit, which
  is unknown, and its current tag are the ones its first check lists for
  its current version: the listed tag of that version, which may be the
  plain tag where the imported ref was `v`-prefixed. A check gives each workspace of the template whose `appliedVersion`
  is null the newest found version whose tag is at its `appliedCommit`,
  and never replaces a known one. A check that finds the current version's
  tag at another commit makes `currentMoved` true: a `create` or an
  `upgrade` from the template is then refused 409
  `template-version-moved`, and a job that pinned it fails as
  `template-refused`, until a manager upgrades the template to that version
  again. A start logs each failed check by the template's `id` and the
  failure's kind, and each moved tag, never an address.


  `POST /api/templates` takes `{"name","address","runnerImage","check"}`,
  `runnerImage` and `check` optional, and no other member. `name` is one line of 1 to
  100 characters, `runnerImage` a Docker image reference, else 400
  `invalid-request`; a body that is not that one object is 400
  `invalid-request` too, and no refusal quotes a value. The address takes
  the forms and credentials the user documentation lists, `#folder`
  included, with no ref or a version's tag. Registration runs the minimum
  checks in this order and refuses the template at the first that fails as
  422 `template-check-failed`, with `check` naming it and a message that
  names what failed and never quotes the address: `address`, the template
  service reads and admits the address, so a folder, `file://`, a registry
  name, `git://`, `http://`, a password or user information that reads
  more than one way, as a password holding `/` does, and an `https://` or
  `ssh://` address with both a port and a ref, are refused before any
  fetch; such an address registers without its ref, at the newest version;
  `fetch`, the repository's versions can be listed; `version`, the list
  holds at least one version and an address's ref is a version's tag;
  `fetch` again, the current version can be fetched, at the commit the
  listing found, else the tag moved meanwhile and the registration is
  refused under `version`, asking to try again; `read`, Toha loads
  the template's manifest and its folder holds no link outside its
  checkout; `definition`, the template's content folder holds
  `.devcontainer/devcontainer.json`, which the message names. A template
  whose source is registered is refused 409 `template-exists`, naming that
  registration, before any fetch. An unreachable template service, or one
  that answers a fault, a 5xx reply, during a check, answers 503
  `template-service-unavailable`, as does a template's upgrade then. The current version is the address's
  tag, else the newest version, with the commit its check fetched.
  Menagerie stores the address without its ref, and an `https` address
  without user information. It answers 201 with the template and `Location:
  /api/templates/{id}`. The `id` is permanent: the lower-case letters and
  digits of the name, separated by single dashes, or `template` when the
  name has none, with `-2`, `-3` and on added while it is taken.
  Registering a template joins it to each workspace that has no template and
  whose applied record names its source.


  `check`, a boolean, false when absent, asks for the checks alone. With
  `check` true the route runs the same checks in the same order, the
  `template-exists` refusal included, and refuses with the same answers;
  it stores nothing, joins no workspace, logs no address, and answers 200
  with the template a registration would store, its `id` the one it would
  take now, and no `Location`. The same member on
  `POST /api/templates/{id}/upgrades` checks a version the same way: the
  same refusals, nothing stored, 200 with the template at that version. A
  request without `check` runs every check again and trusts no earlier one.
  A server that predates the member refuses it as 400 `invalid-request`.


  `POST /api/templates/{id}/upgrades` takes `{"version","check"}`, `check`
  optional (see below). The version must be one of the template's found
  versions newer than the current one, or the current version itself while
  `currentMoved` is true, else 409 `version-not-newer` before any check; it
  then passes the `fetch`, `read` and `definition` checks, else 422
  `template-check-failed`, and becomes the current version with the commit
  those checks fetched: 200 with the template. The fetch must resolve the
  version's tag to the commit the template's last check listed for it:
  when it does not, the tag moved since that check, and the upgrade, with
  or without `check`, is refused 422 `template-check-failed` under
  `version`, asking for a version check, with nothing stored. So a template's current
  version moves only forward, and upgrading it to its moved current version
  records the tag's new commit and ends `currentMoved`. `PATCH /api/templates/{id}` takes `name`,
  `runnerImage` or both, `runnerImage` null for the default, under the
  rules above, and answers 200 with the template; its address and source
  do not change. `DELETE /api/templates/{id}` answers 204, and 409
  `template-in-use` while a workspace uses the template, naming those
  workspaces. Each answers 404 `unknown-template` for an id no template
  has.


  Backup repositories. `GET /api/backup-repositories` lists the registered
  backup repositories sorted by name as letters without regard to case,
  then by name and id, each `{id, name, url, credential, workspaces}`,
  `workspaces` the names of the workspaces that back up to it. Every `url`
  a reply holds, here and on a workspace's row, has no password, query or
  fragment, and an `https` one no user name. `credential` is
  `{"githubApp"}`, an App's configured name, `{"sshKey","fingerprint"}`, a
  public key in authorized-keys form with no comment and its SHA256
  fingerprint, or null for a registration an earlier release made, whose
  URL chooses its credential.
  `POST /api/backup-repositories`
  takes `{"name","url","credential","check"}`, `check` optional and false
  by default, `credential` `{"githubApp"}` or `{"sshKey"}`, a public key
  with or without a comment, which is recorded without it. It runs the
  checks of the design's `backup-repositories` in order: `url`, then
  `credential`, then `write`, which pushes a ref under `refs/menagerie/`
  with that credential and deletes it. A name that is not one line of 1 to
  100 characters, and a credential that names neither or both of
  `githubApp` and `sshKey`, or names `fingerprint`, is 400
  `invalid-request`; a failed check is 422 `backup-repository-check-failed`
  with `check` naming it; a URL that is registered is 409
  `backup-repository-exists`, naming that registration. It answers 201 with
  the repository and `Location: /api/backup-repositories/{id}`, or, with
  `check`, 200 with the repository a registration would store, storing
  nothing. `PUT /api/backup-repositories/{id}/credential` takes
  `{"credential","check"}`, `credential` required, runs the `credential`
  and `write` checks with it, and answers 200 with the repository and its
  new credential, or, with `check`, the repository as the change would
  record it, storing nothing; it refuses as a registration does, 404
  `unknown-backup-repository` for an id none has. `GET /api/credentials`
  answers `{githubApps, sshKeys, sshAgent}`: each configured App as
  `{name, server}`, in configuration order; each key Wyrwood's SSH agent
  offers as `{name, fingerprint, publicKey}`, `name` the agent's comment,
  in the agent's order, without provisioning's operator key; and
  `sshAgent` null, or the fixed reason the agent listed no key. `DELETE /api/backup-repositories/{id}` answers 204, leaving the
  repository and its branches as they are and its id never given to another
  repository, 409 `backup-repository-in-use`
  while a workspace backs up to it, naming those workspaces, and 404
  `unknown-backup-repository` for an id none has.


  `POST /api/jobs` starts an operation on a workspace. The operations are
  `start`, `stop`, `rebuild`, `commit` and `apply-policies` on an existing workspace folder,
  `move-backup` on an existing workspace folder, which also names a
  `backupRepositoryId`,
  `apply-branch` on an existing workspace folder, which also names a
  `branch`, and the interview operations `create`, which also names a
  registered template's `templateId` and optionally a registered backup
  repository's `backupRepositoryId`, and `upgrade`, which takes no
  `templateId` and an optional boolean `reanswer`. Any other operation is refused as
  `unknown-operation`. The service acquires the workspace's job slot before
  any work begins. A workspace has at most one unfinished job; another
  request for it gets 409 `workspace-busy` with the holder's id, while other
  workspaces proceed. The job runs in the service, not the request, and
  answers 202 with the job and `Location: /api/jobs/{id}`.


  A job's state is `running`, `waiting-for-answers` (a nonterminal state for
  interview operations, which keeps the slot), or one of the terminal states
  `succeeded`, `failed` and `ended`. The slot is released when the job ends,
  and every client that sees the result event can start the next job.
  `phase` names the current step, for example `read-definition`, `issue-key`, `bind`,
  `initialize-command`, `build`, `unbind`, `remove-container`, `revoke-key`,
  `remove-folder`, `create-container`,
  `wait-for-sockets`, `up`, `verify`, `retire`, `stop`,
  `interview`, `initialize-repository`, `generate`, `host-prerequisites`,
  `fetch`, `plan`, `apply`, `commit`, `backup-local-changes`, `backup` or `switch`. A failed job carries `error.kind`:
  `timed-out`, `initialize-command-failed`, `registry-credentials-unavailable`,
  `runner-image-unavailable`, `provisioning-invalid`, `provisioning-unavailable`,
  `provisioning-not-ready`, `binding-outside-grant`, `policy-outside-grant`,
  `binding-changed`, `binding-pending`, `binding-refused`, `host-prerequisites-missing`,
  `delete-refused`, `delete-unfinished`, `operation-failed` or
  `internal-error`, and for interview operations
  `workspace-exists`, `template-refused`, `template-service-unavailable`,
  `generation-failed`, `upgrade-failed`, `not-applied`, `merge-conflicted`
  or `backup-failed`, for `start` of a workspace whose create it finishes
  `backup-failed`, for `commit` `commit-failed` or `backup-failed`, and
  for `apply-branch` `branch-not-found`, `fetch-failed`, `backup-failed`,
  `not-applicable`, `template-service-unavailable` or `apply-failed`, and
  for `move-backup` `backup-move-failed` or `backup-branch-conflict`. Its message says what was written and
  what recovery is needed.


  Move backup. `move-backup` names an existing workspace folder and a
  registered backup repository other than the one the workspace backs up
  to: without `backupRepositoryId` it is 400 `invalid-request`, with one no
  repository has 404 `unknown-backup-repository`, and with the workspace's
  own repository 409 `backup-repository-unchanged`, each before any job. A
  workspace with no backup repository can take its first this way. The job
  runs `verify`, `commit`, `backup` and `switch`. In `verify` it refuses a workspace
  whose create has not finished, runs the destination's write check, and
  reads the destination's branch of the workspace's name: a branch at a
  commit that is not the workspace branch's commit or one of its ancestors
  fails the job as `backup-branch-conflict`, naming the commit, with nothing
  committed or pushed; a branch at one of them, as an earlier move that
  failed after its push leaves, is taken over. `commit` commits every
  change, as the commit operation does. `backup` pushes the workspace
  branch to the destination without force, so a branch another writer made
  after `verify` is never overwritten, reads the destination's branch back,
  and requires it at the commit it pushed. Only then does `switch` record
  the destination in Menagerie's data, and only while its id is still
  registered at the URL the job checked. The record is the job's final
  step: a job past its time limit times out before it and records nothing,
  a record that a limit's cancellation interrupts, once the limit's timer
  runs, records nothing and the job times out, and a record that commits decides the outcome,
  so a recorded switch never ends `timed-out`. Every later backup, commit and Apply branch uses it. Any other failure is `backup-move-failed`. A failed move keeps
  the workspace's repository, and its message says so. A move never
  changes the earlier repository's branch, which keeps the workspace's
  earlier backups for recovery.


  Time limits are configured in `job-limits` and are optional; without
  them a job runs until it ends. A job's limit is its operation's limit,
  else the default; a phase limit counts from each entry into the phase,
  an answered interview's return to `interview` included. Limits count
  running time only. A limit times Menagerie's work, never the manager
  answering an interview: time in `waiting-for-answers` does not count, no
  deadline applies while a job waits, and interviews keep no expiry. When a
  limit passes, the service writes one log line and cancels the job's
  work; the job ends `failed` with `error.kind` `timed-out` and a message
  that names the phase and the limit, such as `the build phase passed its
  45m limit` or `the job passed its 2h limit in the build phase`, whatever
  the cancelled work returns. A limit that has passed takes effect at the
  job's next change even when its timer runs late: a phase change, the
  move to `waiting-for-answers` and the job's end each first settle the
  running time, so a job that ends past a limit ends timed-out, and a
  long-running threshold passed while the job ran is alerted once, before
  any `job-failed` alert, at the latest when the job ends. A job's final
  step, `move-backup`'s `switch` record, settles the running time before
  it begins, and the limits keep counting while it runs: when a limit's
  timer runs, which can be after the limit passed, it cancels the job's
  context, and a step that the cancellation interrupts, such as one
  waiting for the database connection, records nothing and the job times
  out. A step that records decides the outcome:
  the job succeeds even if a limit passed while the step ran, so the
  job's outcome agrees with what the step recorded. The slot is
  released when the work returns, never before, so work that ignores
  cancellation keeps its workspace busy.
  A cancelled generate or apply revokes its hook token and kills and
  removes its running hook containers before the job ends, so no hook
  writes to the folder afterwards. When a template service request ends,
  it fires Toha's stop signal: its template fetch, schema load, apply or
  update returns, the request worker returns, and it writes no further file.

  gix cannot interrupt a transfer that waits for a remote, so the transfer
  a stop abandons keeps running, without blocking the caller, until the
  remote acts. Over HTTP(S) it keeps its Toha thread, gix's curl thread and the
  connection until the remote answers or closes the connection, or Git's
  `http.lowSpeedLimit` and `http.lowSpeedTime` end the transfer. Over SSH
  and `file://` it keeps its Toha thread and the `ssh` or `git-upload-pack`
  process until that process answers or exits. The transfer then ends: it
  writes nothing more and removes its temporary folder
  ([Toha #78](https://github.com/wyrd-company/toha/issues/78)).

  A document schema fetch's stop aborts it and closes its connection within
  a fraction of a second (Toha checks the signal at least every 100 ms),
  also while the schema endpoint sends nothing. One part of it can't be
  interrupted: a name lookup still pending at the stop, either the schema
  host's or the target's that curl looks up itself behind a `socks4://` or
  `socks5://` proxy. The fetch still returns within 2 s, but the threads
  that wait on the lookup run on. Those are curl's resolver threads,
  detached instead of joined, and, behind such a proxy, one
  `toha-schema-release` thread that finishes releasing curl's handles and
  is waited for at most 250 ms. They hold no connection and end by
  themselves when the system resolver returns
  ([Toha #81](https://github.com/wyrd-company/toha/issues/81)). With a
  libcurl that supports neither curl's transfer nor its multi-handle
  quick-exit option, the stop waits for the lookup instead.

  Neither limit holds a job, request worker or workspace in Menagerie's
  image, which builds curl with quick-exit support.

  Stopping Menagerie also cancels jobs, which fail with their own error,
  not `timed-out`. A timed-out create keeps its folder, as every failed
  create does, for manual recovery. A timed-out build or up can leave a
  half-created container: a later start reuses or starts it and a rebuild
  removes it. A job's `deadline` is when the limit that ends first passes,
  null when no limit applies, while the job waits and once it has ended;
  `limit` is that limit, `{seconds, scope}` with scope `job` or `phase`,
  null when none applies and once the job has ended.


  Interview operations. A create names a workspace that is a legal Git
  branch name, whose folder does not exist and that Menagerie's data does not
  hold, one being created or listed as `no-folder` included; otherwise it is
  refused 409 `workspace-exists`; a `templateId` no template has is 404
  `unknown-template`, and a template whose `currentMoved` is true 409
  `template-version-moved`. A `backupRepositoryId` no repository has is 404
  `unknown-backup-repository`; without one, the create takes the only
  registered backup repository, and is 400 `invalid-request` when none or
  several are registered. `backupRepositoryId` on another operation is 400
  `invalid-request`. The create's workspace records its backup repository
  from the job's start, so it cannot be removed while the create runs, and
  every later backup, commit and Apply branch of the workspace uses it. Its job pins the template's current version and its
  commit when it starts, and writes the workspace's data with that
  template, so the template cannot be removed while the create runs; once
  generation has written the applied record, the pinned version and commit
  are the workspace's `appliedVersion` and `appliedCommit`. An
  upgrade names an existing workspace folder and applies the current
  version of the workspace's registered template, which its job pins when
  it starts; a `templateId` given is 400 `invalid-request`. It is refused,
  before any job exists, 409 `template-not-registered` when the workspace
  has no registered template, 409 `upgrade-not-needed` when its stored
  `appliedVersion` is that version or a newer one, so no upgrade applies an
  older version, and 409 `template-version-moved` while the template's
  `currentMoved` is true. A workspace whose `appliedVersion` is null is
  upgraded only when the template service answers that the current
  version's commit descends from its `appliedCommit`: the job asks before
  the interview, and fails as `template-refused`, naming both commits,
  when it does not, when the tag is at another commit than the recorded
  one, or when the applied commit is not known either; an unreachable
  template service fails it as `template-service-unavailable`. A written
  or conflicted merge, and Toha's `already-current`, record the pinned
  version and commit as the workspace's `appliedVersion` and
  `appliedCommit`. The template service is named the template's address with
  the pinned version's tag and commit, and refuses a tag that resolves to
  another commit as `template-stale-revision`. The job asks the template
  service, over its Unix socket, for each interview reply and appends it as
  an `interview` event whose data is the reply's exact text:
  `{"session","state","document","warnings"}`. While questions remain the
  job is `waiting-for-answers`, with no expiry. `POST
  /api/jobs/{id}/answers` takes `{"session","submission"}`, both JSON
  objects forwarded as received. The web UI's submission holds every
  question the batch shows, an untouched one with the default it showed;
  only an untouched document question is left out, so the template service
  reads its input file. Another client may leave a question out to take
  its default. The body carries the whole session, so
  it has no size bound, as the template service has none; the reply is
  read whole for the same reason. It answers 200 with the next reply's
  exact text and appends it as an event. Only a waiting job takes an
  answer, one at a time; any other answer is 409 `job-not-waiting`, a
  malformed body 400 `invalid-request`, an unknown job 404. A template
  service refusal answers with its status and kind, such as 409
  `session-mismatch`, and an unreachable template service 503
  `template-service-unavailable`; in both cases the job keeps waiting. A
  flow `stop` or `abort` ends the job as `ended` with nothing written. The
  result event of a job that reached generation or apply adds `apply`: the
  template service's `{"outcome","files","recordPath","messages","hooks",
  "conflicts"}`.


  Template hooks. Each generate or apply carries a new hook token, which
  the service grants until that request returns. The template service
  sends each hook to the service's hook runner socket with the token and
  Toha's target, and the service runs it in a throwaway container: for a
  create's generate, the workspace folder mounted read-write at its own
  path and nothing else; for an upgrade's apply, Toha's candidate copied
  in at its own path, no mount, and the candidate copied back when the
  hook exits, so Toha merges what the hook wrote and the hook itself never
  writes to the workspace folder. A create's token admits only the
  workspace folder and folders in it, an upgrade's only a folder inside
  `template-service.candidate-folder`. The hook's working directory is
  under its target, with an empty environment beside the runner image's
  own, the services' user, no new privileges and the default bridge
  network. A script hook's template folder is copied into the container.
  The job console shows one line naming the runner image, a line for an
  image pull, then the streams the hook does not capture, each line
  prefixed `hook: `; captured streams go back to Toha only. A hook that
  found no runner image, or whose container failed, adds a console line
  that names the runner image, the stage that failed and the Engine
  error's class. The runner image is the registered template's runner
  image, else the global `runner-image`, else Menagerie's own image. When none
  can be found or pulled, the job fails as `runner-image-unavailable`, or
  as `registry-credentials-unavailable` when the pull's credentials could
  not be read.


  Create. When the job starts it writes the workspace's data, marked as
  being created, so the list keeps it while the interview waits and a second
  create of the name is refused; the mark ends when the job creates the
  folder, and a create that ends before it created the folder removes the
  data. After the interview completes the service creates the workspace
  folder, refusing one that appeared meanwhile, and initializes in it a Git
  repository whose unborn HEAD names the branch called after the
  workspace. The template service then generates into it. Only `written`
  continues; `planned` and `needs-trust` fail as `not-applied`. A failed
  generation fails as `generation-failed`; the folder keeps the files
  written before the failure and has no applied record. A failed create
  never removes its folder, and a second create of that workspace is
  refused while the folder exists. A folder with an applied record whose
  first backup has not landed, or with no commit, is finished by the
  workspace's next `start`, which runs what remains of the create; any other failed create is ended by
  deleting the workspace, which removes the folder. On success the service commits
  the output as the branch's first commit, which has no parent, force-pushes
  it to the workspace repository, its backup repository, and starts the devcontainer. A branch of the
  workspace's name that the workspace repository already holds, from a
  deleted workspace, is first copied to `archive/<workspace>-<UTC stamp>`, and
  the console names it. With a provisioning declaration, the steps of the
  design's `provisioning-steps` run around that commit and backup, each its
  own phase. Menagerie's data records each container name before it is bound
  and each Xolotl key before it is issued, as the workspace's, and refuses in
  `read-definition`, as `provisioning-invalid`, a name or a key that it holds
  for another workspace. Any job that ends with the devcontainer started, with
  or without a declaration, ends with `retire`: it unbinds each name the data
  holds for the workspace that the definition no longer declares, and revokes
  each key it no longer declares, every name and key when the definition has
  no declaration, and removes each from the data once Wyrwood or Xolotl
  confirms it gone. An unbind names the binding by the agent and container
  name the data recorded, never by what a read shows, and a recorded agent
  stays until its binding is confirmed gone: when the data holds the declared
  name on another agent than `provisioning.wyrwood.agent`, `bind` first
  unbinds it there and then records and binds the name on the configured
  agent. Wyrwood confirms a
  binding gone when it answers that it removed it, a warning that the console
  shows included, or that no such binding exists; an answer that the binding
  is outside the operator key's grant keeps its name in the data and fails the
  job as `binding-outside-grant`, naming it, with the devcontainer running. A
  failure in `retire` leaves the rest for the next job. A template whose hooks
  already made Git history keeps it under `refs/menagerie/template-history`
  (commits on the workspace branch) or `refs/menagerie/template-head` (a
  detached HEAD); the workspace branch still starts from its own root.


  Delete. Operation `delete` removes a workspace from the host, in the
  design's `delete-flow`. In `read-definition` it reads what the workspace
  holds from Menagerie's data, never from its definition, so a definition
  that no longer parses or no longer declares them holds up nothing. It fails
  as `delete-refused` while a running container outside the workspace mounts
  the folder, a path inside it or a folder that contains it, and as
  `provisioning-unavailable` when the workspace holds a binding or a key and
  the configuration lacks the section that reaches it, with nothing changed.
  `stop` follows, and the mount check again. `commit` and `backup` save what a
  commit operation saves, and skip a folder with no applied record, which has
  no backup. A failure there fails as `backup-failed` and removes nothing.
  `unbind` removes each binding the data names, by its recorded agent and
  container name, and confirms each as `retire` does: a warning is shown and
  confirms the removal, and a binding Wyrwood answers is outside the operator
  key's grant keeps its name in the data and fails the delete as
  `binding-outside-grant`, naming it, before any container, key or folder is
  removed. `remove-container`, `revoke-key`, which revokes each key the data
  names, and `remove-folder` follow, each treating what is already gone as
  done and removing each name and key from the data once it is gone, so a
  failed delete is retried by a new `delete`. The folder goes last, followed
  by the workspace's data. Once `remove-folder` has taken the repository, a
  retry skips the backup, and a `start` or `rebuild` fails as
  `delete-unfinished`. A workspace listed as `no-folder` is deleted by the
  same phases without `stop`, `commit` and `backup`, and its `remove-folder`
  removes only its workspace socket's folder; any other request for it
  answers 404 `workspace-not-found`. `remove-folder` needs a runner image with `sh`, `mv` and
  `find`, and fails as `runner-image-unavailable` when there is no image. The
  backup branch, images, Compose volumes and networks, and bind sources outside
  the folder stay. Ignored files are lost.

  Upgrade. The service first commits changes to tracked files, including
  deletions, and force-pushes the branch, so the state before the upgrade
  is backed up; an unchanged workspace makes no commit and still pushes.
  Untracked files are not committed. It then runs the upgrade interview
  and applies it. The interview asks only what the recorded answers do not
  settle; with `reanswer` the service asks the template service to ask every
  question, with the recorded answers as the defaults, and the console says
  so. While a change or an untracked file outside the ignore
  rules exists, the template service refuses the upgrade with
  `dirty-target` and writes nothing: at the start the job fails as
  `template-refused`, an answer is refused and the job keeps waiting, and
  the apply fails as `upgrade-failed`. `already-current` succeeds without
  a commit or rebuild; `planned` and `needs-trust` fail as `not-applied`; a
  failed apply fails as `upgrade-failed`. `written` is committed on the
  branch, extending its history, pushed and rebuilt. `conflicted` is
  committed and pushed with its conflict markers and fails as
  `merge-conflicted` without a rebuild; its message says the upgrade is not
  complete and needs manual resolution, names the conflicted paths, the
  conflicted commit and the backup of the state before the upgrade.


  Backups. A commit after generation or an upgrade apply stages the paths
  the template service reported, the applied record, and every path the
  workspace status then shows as untracked, modified or deleted, which
  includes the files hooks wrote. Paths the workspace's ignore rules
  exclude and files inside a nested Git repository stay unstaged; the
  applied record is staged even when the ignore rules exclude it. The
  status does not tell who wrote a path: the template service generates
  only into a folder that holds nothing but the new repository and applies
  an upgrade only into a workspace with no change and no untracked file
  outside the ignore rules, so an operator file present when generation or
  the apply starts fails the job with nothing written, while a file written
  after that check and before the commit is committed with the output.
  Pushes use
  go-git, to an SSH remote with the SSH agent at `ssh-agent.sock` in the
  Wyrwood directory and the default known hosts files for host-key
  verification, and to an `https` repository on the configured GitHub
  App's server with a contents write installation token for that
  repository; they replace the remote branch named after the workspace,
  write no remote to the workspace's Git configuration and fetch nothing.
  A push or fetch with a token follows no redirect, to the same origin or
  another. A failed commit or push fails as `backup-failed` and the
  container is not started or rebuilt; a push to a remote that is not SSH
  or a local path, a URL go-git cannot read included, names a fixed
  reason, never the URL, a token or the server's answer.


  Apply branch. An `apply-branch` job brings a branch of the workspace
  repository into the workspace. `branch` is a branch's short name,
  slashes allowed, never a full ref name such as `refs/heads/<name>`; the
  workspace's own branch is allowed. A request without `branch` is refused
  as 400 `invalid-request`, and one whose `branch` is not a valid branch
  name as 400 `invalid-branch`, before any job exists. The workspace socket
  never starts it.

  In the `fetch` phase the service fetches only that branch and the
  history it needs, with go-git and the credentials of a push, through a
  remote it never writes to the workspace's Git configuration, into
  `refs/menagerie/apply`. It fetches no tags and changes no other ref, and
  deletes `refs/menagerie/apply` when the job ends, whatever the outcome.
  A branch the workspace repository does not have fails as
  `branch-not-found`, a shallow workspace repository, which lacks the
  history an apply walks, as `not-applicable` before it fetches, and any
  other fetch failure as `fetch-failed`, all with nothing changed. In `backup-local-changes` the service commits every
  change as a `commit` job does, with the message `Back up local changes
  before applying <branch>`, and in `backup` force-pushes the branch; a
  failure of either fails as `backup-failed` with nothing applied. When
  `branch` is the workspace's own branch there is no `backup` phase before
  the apply: the console says the branch is not pushed before the apply,
  so a refused apply leaves the workspace repository as it was.

  In `plan` the service works out the apply in memory, writing nothing to
  the folder, the index or a ref. H is the workspace branch's commit and
  T the fetched one.
  When T is H or an ancestor of H the job succeeds as already applied,
  with no commit and no rebuild; for the workspace's own branch it then
  force-pushes the branch in `backup`, which only moves the workspace
  repository's branch forward. When H is an ancestor of T the branch
  fast-forwards to T. Otherwise H and T merge file by file over their
  merge base B, which must be exactly one commit: a path whose mode and
  content are equal in H and T keeps them, one unchanged in H since B
  takes T's, one unchanged in T keeps H's, and any other path conflicts.
  The result is a merge commit with parents H and T, by Menagerie, with
  the message `Apply <branch> to workspace <workspace>`. No merge base,
  several merge bases, a conflict, or a file where the result also has a
  folder of that name fail as `not-applicable`. So do, before anything is
  written: fetched history that lacks a commit or tree the apply reads; a
  path the change writes or removes that is not valid in a Git tree,
  checked before any folder of the result is read: an empty component, so
  an absolute path, a `.` or `..` component, a backslash, a control
  character such as a tab or a newline, or `.git` in any spelling NTFS or
  HFS+ reads as `.git`, `git~1` included; a submodule entry in the
  change; an untracked or ignored file, folder or symbolic link, or a
  nested Git repository, where the change writes; and a file of H that no
  longer matches H. The console has one `not applicable: <path>` line per
  path and the message names the reason and the paths; nothing is
  applied.

  A plan that changes the applied record `.toha.json` is read in `plan`,
  before anything is written, so that no apply moves a workspace backward.
  It is refused as `not-applicable`, naming `.toha.json` and both versions
  or commits, with nothing changed, when the workspace has no registered
  template; when the plan removes the record, or leaves one that is not a
  file, that is larger than the bound the service reads (16 MiB) or that
  Toha cannot read, one with no application at the workspace's root
  included; when the record names another source than the workspace's
  template's, or a commit that is not a full Git object id; when the record
  gives no version by the rule above: no found tag is at its commit, or its
  ref is a version that the tag at its commit does not give, as for a
  branch, an untagged commit or a ref naming a version at another
  version's commit; when that version is the template's current version
  and `currentMoved` is true; when that version is older than the
  workspace's `appliedVersion`; and, while `appliedVersion` is null, when
  `appliedCommit` is not known, or the template service does not answer
  that the version's tag is at the record's commit and that commit
  descends from `appliedCommit`. Refusals quote the record's ref and commit
  as Go string literals (`strconv.Quote`), each cut to its first 100 bytes
  with `…` after the closing quote when it is longer. Only the planned
  record is read. An unreachable template service then fails the job as
  `template-service-unavailable`, with nothing applied. After an apply
  that changed the record, the record's version and commit are the
  workspace's `appliedVersion` and `appliedCommit`; a plan that leaves the
  record as it was changes neither.

  A plan refused in `plan` leaves the devcontainer as it was. Otherwise,
  so that nothing in the devcontainer writes to the folder while the
  apply does, the service records whether the devcontainer runs and stops
  it in `stop` as a `stop` job does: for Compose, every service of the
  workspace's Compose project, found by its project label, also when the
  primary service's container is gone. A failed state read or stop fails
  with the container operations' kinds and nothing applied. It then
  commits again in
  `backup-local-changes` what the devcontainer wrote before it stopped;
  when that changed the branch it pushes it in `backup`, with the same
  rule for the workspace's own branch, and plans again in `plan`. Right
  before it writes, `apply` lists the running containers through the
  Docker library and refuses as `not-applicable`, with the reason "a
  running container mounts the workspace folder", when any but
  Menagerie's own has a bind mount whose source is the workspace folder,
  is inside it, or contains it; the console names each such container by
  its short id. When the second commit or push fails, the second plan
  refuses, the mount check refuses, or the folder checks of `apply`
  refuse, nothing is applied and the devcontainer returns to its state
  before the job: one that ran is started again as a `start` job does,
  within the `start` operation's time limit, else 10 minutes, and even
  when the job was cancelled; one that did not run stays stopped. When
  that start fails, the console says so, the job fails with the start's
  failure, and the console keeps the refusal. Every exit after the stop
  that leaves the devcontainer stopped, a time limit included, writes
  the console line "the devcontainer is stopped; start or rebuild it". An
  already applied branch never stops the devcontainer.

  The service changes the folder through descriptors: each folder is
  opened beneath the workspace with no symbolic link in any component, and
  each file is renamed, created or removed relative to its folder, so a
  folder swapped for a link is refused, never followed. In `apply` it
  first checks that the workspace branch is still at H, then moves
  every file of H the change replaces or removes to a temporary name,
  `.menagerie-apply-<random>-<n>`, in its own folder, and checks that each
  still has H's mode and content, a link's target included. When one does
  not, or is gone, it moves them all back, never over a file created
  meanwhile, and refuses as `not-applicable`, so a change the devcontainer
  made is kept. It then writes only the paths that differ between H and
  the result, each to a name nothing holds, writing symbolic links as
  links and keeping the executable mode, removes the moved-aside files and
  the folders the change empties. The index records the result with the
  stat data taken from each file as it was written, from its descriptor
  before it closes or, for a link, right after it is made; an entry
  without such data keeps none, so its content is compared. The branch
  moves last, only from H. A failure while writing fails as
  `apply-failed` with the devcontainer stopped: the files written before
  it remain, the branch stays at H, which is backed up unless `branch` is
  the workspace's own, the moved-aside files go back to their names where
  nothing was written, and the message and console name each file still
  at a temporary name with its path; recovery is manual. A changed branch
  is then force-pushed in
  `backup`, where a failure fails as `backup-failed` without a rebuild,
  and the devcontainer is rebuilt as after an upgrade, a failure failing
  with the container operations' kinds. The applied record `.toha.json`
  is a file like any other. The job's messages name the branch, the
  workspace and commits, never the workspace repository's address or a
  transport error's text, which may carry it.


  Commit. A `commit` job stages every change of the workspace, as `git
  add --all` would: untracked, modified and deleted files, and what is
  already staged. A file that replaces a tracked folder, or a folder that
  replaces a tracked file, takes the old entries out of the index, in this
  commit and in the commits after generation and upgrades. Untracked paths
  the ignore rules exclude, files inside a nested Git repository, and
  paths go-git could not read back from the index, such as a name with a
  tab or a newline or a `git~1` folder, stay unstaged; the job console
  notes each of the last kind. The ignore rules are the workspace's `.gitignore` files, its
  `.git/info/exclude` and the file its repository's own
  `core.excludesFile` names; Menagerie's own Git configuration is never
  read. An exclude file that does not resolve, through symbolic links, to
  a regular file of at most 1 MiB inside the workspace folder is skipped,
  and the job console notes it without its path; the files it excludes
  can then be committed. In the `commit` phase it commits on
  the workspace branch, as Menagerie, when the staged index differs from
  the branch's commit; in the
  `backup` phase it force-pushes the branch, also when nothing changed. A
  commit that fails, for example on a workspace whose HEAD is not on its
  branch, fails as `commit-failed` with nothing pushed; a failed push fails
  as `backup-failed` and keeps the commit. A commit started through this
  API has the message `chore(menagerie): commit workspace changes`. With
  `auto-commit`, the service sweeps the workspace root every interval,
  first one interval after start-up, and starts a commit with the message
  `chore(menagerie): automatic commit` on each workspace that has no
  unfinished job and a change the job would commit; a busy workspace is
  skipped, never queued. The check stages in memory and writes nothing,
  so it finds a change exactly when the job would commit. The `commit` operation's time limit applies to
  every commit job.


  Workspace socket. With `workspace-socket`, each workspace's devcontainer
  has a Unix socket at `/run/menagerie/workspace.sock`, named by
  `MENAGERIE_WORKSPACE_SOCKET` unless the definition sets that name, and
  the client `/run/menagerie/bin/workspace-commit`. The folder
  `/run/menagerie` is the workspace's folder in the socket folder, mounted
  read-only on each rebuild of a single container or a Compose primary,
  and on each start that creates the container or reuses one that has the
  mount. A start that reuses a container created without the mount leaves
  out the mount and the variable, so the container is not recreated, and
  the job log notes that the socket attaches at the next rebuild. A start
  that recreates such a container for another reason, such as a changed
  `containerEnv`, creates it without the socket too, and the job log says
  that the socket attaches at the next rebuild. A Compose
  workspace whose socket folder path holds a comma or ends in a space gets
  no mount, and the job log says so. The socket serves the one workspace
  it was created for and speaks HTTP/1.1 JSON, defined by
  `assets/workspace-socket/openapi.yaml`. `POST /v1/commits` takes
  `{"message"}`: a commit message that is not blank, at most 4096 bytes of
  UTF-8, without NUL, in a body of at most 16 KiB with no other member. It
  starts a commit job on the workspace with that message, waits for the
  job to end and answers 200 `{"jobId","state","commit","changed",
  "pushed","error"}`: `commit` is the branch's commit after the commit
  phase, null when that phase failed, and `error` is null or `{"kind"}`. A
  client that disconnects does not cancel the job. When Menagerie shuts
  down while a request waits, it answers 503 `{"error":{"kind":
  "shutting-down","jobId"}}`, with `jobId` when the request had started a
  job, and a request that arrives, or finishes its body, during shutdown
  gets the same without `jobId` and starts no job. Each workspace's socket has at most 32 connections at once and
  the process 256; a connection over either is closed when accepted. The
  request header and the body each have 10 seconds, and an idle
  connection is closed after 60; the wait for the job has none, as the
  `commit` operation's time limit governs it. Refusals answer
  `{"error":{"kind"}}`: 400 `invalid-message` or `invalid-request`; 409
  `workspace-busy` with `activeJobId`; 429 `rate-limited` with
  `retryAfterSeconds` and `Retry-After` when the workspace's last accepted
  commit is within `workspace-socket.min-interval`; 404
  `workspace-not-found` when the workspace's folder is gone; 500
  `internal-error`. Any other path answers 404 `not-found` and any other
  method 405 `method-not-allowed`. A refused request does not count toward
  the interval. No reply carries a message: the job's console has the
  detail, so no error text, path or remote address reaches the container.
  `workspace-commit [-m] <message>` prints the job id, the commit and
  whether the backup pushed, and exits 0 when the job succeeded, 1 when it
  failed (with its kind), 2 on a usage error or an invalid message, 3 when
  the workspace is busy, rate limited (with when to retry) or Menagerie
  is shutting down, and 4 when the socket cannot be reached.


  `GET /api/jobs/{id}/events` streams the job's events as Server-Sent Events.
  Event ids are the job's sequence numbers from 1. `state` carries
  `{state, phase, deadline, limit}`, `log` carries one output line
  `{text}`, a line ending at a newline, a carriage return or both
  together, so each progress update is its own event, and `result`
  carries `{state, error}` and ends the stream. An operation can add event
  types with opaque JSON data, such as `interview`; the service compacts
  each payload to one line without changing its text, numbers included, and
  frames every payload line as its own data field. `Last-Event-ID`, or the
  `lastEventId` query parameter, replays the events after that id, so a
  reconnecting client misses nothing. The stream has no keepalive and no
  deadline. A push's or fetch's `log` lines carry the remote's own text,
  such as a hook's rejection; the workspace repository URL and the
  transfer's token, as given and as its basic-authentication pair in
  base64 or base64url, padded or not, are replaced by `[redacted]`, also
  when the remote splits them across packets. Where one of these values
  contains another, the longer is replaced whole.


  Jobs, events and logs are held only in the memory of the running process.
  A restart of Menagerie drops every job and its history: job ids from
  before the restart answer 404 `job-not-found`, and the browser refreshes
  the workspace list, which is rebuilt from the folders, Docker and
  Menagerie's data. Applied answers, workspace folders and Menagerie's data
  are unaffected, apart from the data of a create that had not made its
  folder, which the start removes.


  Throwaway containers carry the labels `menagerie.throwaway` (`hook` or
  `initialize-command`), `menagerie.workspace-root` and `menagerie.job`.
  Each is force-removed when its command ends or its job is cancelled, and
  the service removes those of its workspace root when it starts.


  Container operations use devcontainer-builder as a library. Every
  `${localEnv:NAME}` and `${env:NAME}` in a definition, and Compose
  interpolation, read only the variables of Menagerie's environment that
  `local-env` lists; any other resolves to its default value or empty, and
  the job log has the line `localEnv NAME is not in local-env; it resolves
  to its default value` once for each such name the definition reads. Before each
  start or rebuild the service reads `initializeCommand` from the same
  definition snapshot used for the build, substitutes `${localWorkspaceFolder}`,
  `${localEnv:...}`, `${containerWorkspaceFolder}` and `${devcontainerId}`
  with the workspace's discovery labels, and runs it in throwaway
  containers of the global `runner-image`, else Menagerie's own image, as
  template hooks run: the workspace folder mounted at its own path and as
  working directory, and an environment of only the `local-env` variables
  other than `PATH` beside the runner image's own, its `PATH` included. A
  string runs through `/bin/sh -c`, an array as given, and object members in parallel, each in
  a container of its own with its output prefixed by its name. A failing
  command fails the job before any container changes; a missing runner
  image fails it as `runner-image-unavailable`. `start` then builds the definition
  when it needs a build and brings the container up, reusing and starting an
  existing one. When the definition uses features, an existing
  `devcontainer-lock.json` (including an empty initialization marker) is
  rewritten with the resolved features only after the container is up; a
  failed operation leaves it unchanged. `rebuild` builds, removes the containers labelled for the
  workspace (in Compose the primary service; named volumes, networks and
  other services stay) and brings a new one up. `stop` selects a single
  container or the whole Compose project from the running container's
  labels, not the definition. A stop is devcontainer-builder's graceful
  stop, which waits 10 seconds before the engine kills the container; that
  interval belongs to the stop, not to the job. Definitions get every
  privilege and restart policy they ask for.


  Registry credentials come only from Menagerie's `registry-credentials`
  configuration. Every devcontainer-builder call receives one credential
  source per `start` or `rebuild`, covering Engine pulls, BuildKit builds,
  base image and feature reads and Compose service builds, so no call reads
  a Docker client configuration or runs a credential helper. A registry the
  configuration names is read from OpenBao through the Wyrwood vault socket
  the first time the operation uses it and kept for the rest of the
  operation; any other registry is anonymous. When a named registry's
  secret cannot be read (missing, denied, malformed, no Wyrwood token, or an
  unreachable socket) the job fails with `registry-credentials-unavailable`
  and a fixed reason; credential values and OpenBao response text never
  appear in a job's log, events or error.


  The service also serves the built web UI when one is supplied: `/assets/*`
  from the build, and `index.html` for `/`, `/create` and
  `/workspaces/{name}/upgrade`.
validation-criteria: >-
  `go test ./backend/internal/api/` checks that the routes the server
  registers equal the OpenAPI paths and methods, and exercises each response
  and error contract with a held runtime, the template routes with a held
  template service: registration, its refusals by check without quoting
  the address, the order of the list, editing, upgrading only to a newer
  version, removal and its refusal while a workspace uses the template, a
  check alone of a registration and of an upgrade, answering 200 with no
  `Location` and storing nothing, a folder listed for the first time
  joining its template with its applied version, a version check on
  request answering the template with its record, also 200 with
  `template-service-unavailable` recorded while the template service is
  down, and each workspace's applied version, commit and `needsUpgrade`.
  `go test ./backend/internal/registry/` runs each
  registration check, with and without `check`, which refuses alike,
  stores nothing and is checked again by a save, template ids,
  forward-only upgrades to found versions only and their checks alone, the
  version rules case for case with the template service's, the applied
  record's source and ref, version checks that find a new version, keep
  the found versions with each failure's kind, end within their wait and
  share one run, a moved tag taken again only by upgrading to it, an
  imported template's first check, an unknown applied version completed
  from its commit, the schedule's check at start and at each tick, and the
  `templates` import. `go test -tags templateservice
  ./backend/internal/workflows/` also finds a version tagged in a local
  Git repository served over HTTPS, on the schedule and on request, with
  no restart. `go test ./backend/internal/jobs/`
  drives time limits with a manual clock: job, operation and phase limits,
  the pause while waiting, the slot held until cancelled work returns,
  timers that run late against a phase change, a wait or the job's end,
  and shutdown that is not a timeout; `go test ./backend/cmd/menagerie/` runs a
  start whose `initializeCommand` hangs past a 100 ms phase limit through
  the composed server and receives its `job-failed` alert. `go test
  ./backend/internal/workflows/` runs create and upgrade through the API
  with a held template service and a real local workspace repository,
  covering waiting, single answers, flow ends, failures and slot release,
  the version a create and an upgrade pin and record as applied,
  `upgrade-not-needed` from the stored applied version,
  `template-not-registered`, and the descent exit: an unknown applied
  version upgraded only when the current version's commit descends from
  its applied commit, else `template-refused` naming both commits, or
  `template-service-unavailable`;
  `go test ./backend/internal/backup/` pushes through an isolated SSH server
  and agent, and pushes and fetches through an isolated HTTPS Git host
  with a token, whose every failure names neither the URL nor the token;
  `go test -tags templateservice ./backend/internal/workflows/`
  runs create and upgrade against the real template service, with an
  upgrade whose hook changes a tracked file's content that only Toha's
  merge brings into the workspace folder. `go test
  ./backend/internal/throwaway/` covers the hook runner: token refusal and
  revocation, folder, candidate and working directory checks, each token
  kind refusing the other kind's target, linked working directories, a
  candidate copied in and back and never mounted, a copy back that refuses
  unsafe entries and never writes through a link, captured streams that never reach the console, exit codes,
  cancellation that waits for the container's removal, runner image
  choice, and a captured value carried through every failure, the fake
  Engine's failure at each container stage included, that reaches no
  refusal and no console line. `go test -tags docker
  ./backend/internal/devcontainer/ ./backend/internal/throwaway/` runs
  start, stop, rebuild, failing `initializeCommand`, Compose resource
  preservation, the `local-env` allowlist and the workspace list against a
  real Docker Engine, and checks that a hook and an `initializeCommand`
  that look for the Docker socket, the SSH agent and Menagerie's
  environment find none, while they still write into the workspace folder;
  that a script hook runs from its copied template; that an upgrade's
  hook changes only its candidate, which then holds exactly what it left;
  that a revoked hook
  leaves no container and stops writing; that the Engine's failure to start
  a hook named by a captured value, and a working directory linked out of
  the folder, reach no refusal or console line; and that start-up removes
  only its own root's leftovers. `go test -tags templateservice
  ./backend/internal/workflows/` also drives a captured value into an
  invalid, missing and linked later working directory and a failing hook's
  arguments, and finds it in no job error or event. `go test -tags
  'templateservice docker' ./backend/internal/workflows/` runs those
  templates in throwaway containers, and a hook that never ends under a
  short `generate` limit: the job ends timed-out with no hook container
  left and no write to the folder after it. `go test
  ./backend/internal/commits/ ./backend/internal/workspacesocket/
  ./backend/cmd/workspace-commit/` covers the commit job's phases and
  kinds, the sweep's idle and change checks, the socket's binding to its
  workspace, message and request checks, the minimum interval, the busy
  refusal, a client that leaves, the connection bounds, the header, body
  and idle deadlines, a job wait longer than all of them, the
  shutting-down answer, stale and linked socket files, start-up errors
  without a path, and a reply for every refusal and failure that carries
  only kinds, ids, hashes, numbers and booleans. `go test
  ./backend/internal/backup/` covers a file and a folder that replace each
