openapi: 3.1.0
info:
  title: Menagerie workspace API
  version: 0.1.0
  description: >-
    Browser API of the Menagerie workspace service. Jobs and their events are
    held in this process's memory only: a restart of Menagerie drops every job
    and its history, an unknown job id answers 404, and the workspace list is
    rebuilt from the workspace folders, Docker and Menagerie's data, which a
    restart keeps. Every route except
    /healthz requires a manager session cookie from the OIDC sign-in routes
    under /auth/ (see the authentication specification); without one the
    API answers 401 `unauthenticated`, and a cross-origin request that
    changes state answers 403 `cross-origin-request`.
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: health
      summary: Liveness of the workspace service.
      security: []
      responses:
        "200":
          description: The service answers.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: >-
        Every folder directly under the workspace root whose name does not start with a dot, with its container
        state, and every workspace whose folder is gone that still holds a container name or a Xolotl key.
      responses:
        "200":
          description: Workspaces sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                additionalProperties: false
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/workspaces/{name}/t3-code-pairing-tokens:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mintT3CodePairingToken
      summary: Mint a T3 Code pairing token in a workspace's running container.
      responses:
        "201":
          description: The token. The service keeps no copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/T3CodePairingToken"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/policies:
    get:
      operationId: listPolicies
      summary: The current operator grant, policies and revisioned settings.
      responses:
        "200":
          description: Policies inside the grant and referenced policies outside it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policies"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/policies/settings:
    put:
      operationId: savePolicySettings
      summary: Save required policies and groups at the revision read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySettings"
      responses:
        "200":
          description: Saved settings with assigned group IDs and the new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySettings"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/workspaces/{name}/policies:
    parameters:
      - $ref: "#/components/parameters/WorkspaceName"
    put:
      operationId: saveWorkspacePolicies
      summary: Save and apply a workspace's policy selection.
      description: >-
        Imports a pending selection before checking the revision. Starts an
        apply-policies job at once, or queues it after the workspace's active job.
        Empty selections are stored and applied like any other selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policies, revision]
              additionalProperties: false
              properties:
                policies:
                  $ref: "#/components/schemas/PolicyNames"
                revision:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: The stored revision and the apply job, null when queued.
          content:
            application/json:
              schema:
                type: object
                required: [selectionRevision, jobId]
                additionalProperties: false
                properties:
                  selectionRevision:
                    type: integer
                    minimum: 0
                  jobId:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/templates:
    get:
      operationId: listTemplates
      summary: The registered templates.
      responses:
        "200":
          description: Registered templates, sorted by name without regard to case, then by name and id.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                additionalProperties: false
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: registerTemplate
      summary: Register a template from its address, once it passes the minimum checks; with check, run the checks alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRegistration"
      responses:
        "200":
          description: With check, the checks passed; nothing was stored. The template a registration would store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "201":
          description: The registered template.
          headers:
            Location:
              description: /api/templates/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: editTemplate
      summary: Rename a template or change its runner image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateEdit"
      responses:
        "200":
          description: The template as edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeTemplate
      summary: Remove a template no workspace uses.
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/templates/{id}/upgrades:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: upgradeTemplate
      summary: Make a newer found version its current version, or take the current one again while its tag has moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version:
                  type: string
                  description: >-
                    A found version newer than the current one, such as
                    1.1.0, or the current version while currentMoved is
                    true, which records its tag's new commit.
                check:
                  type: boolean
                  default: false
                  description: Run the checks alone and store nothing.
      responses:
        "200":
          description: The template at its new current version; with check, the template that version would give, nothing stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/templates/{id}/version-checks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: checkTemplateVersions
      summary: Check a template for new versions now.
      description: >-
        Lists the versions of the template's repository, which replace its
        found versions. A failed check, an unreachable template service
        included, keeps them and is recorded in lastCheck; the answer is
        200 either way.
      responses:
        "200":
          description: The template, with its check's record in lastCheck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/jobs:
    get:
      operationId: listJobs
      summary: Every job of this process, newest first.
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                additionalProperties: false
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      operationId: startJob
      summary: Start an operation on a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          description: The job holds the workspace and runs.
          headers:
            Location:
              description: /api/jobs/{jobId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      summary: One job.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
  /api/jobs/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: answerJob
      summary: Answer the current batch of an interview job.
      description: >-
        Accepted only while the job is waiting-for-answers, one answer at a
        time. The body carries the whole session and has no size bound. The reply is also appended to the job as an interview event.
        A template service refusal keeps its status and kind and the job
        keeps waiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: The next interview reply, as the template service produced it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewReply"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/jobs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: jobEvents
      summary: The job's events as Server-Sent Events.
      description: >-
        Each event has `id` (its sequence number in the job, from 1), `event`
        (state, log, result, or a type added by a later operation such as
        interview) and one line of JSON `data`. A `Last-Event-ID` header, or
        the `lastEventId` query parameter, replays only later events. The
        stream ends after the result event. There is no keepalive and no
        deadline; a client reconnects with Last-Event-ID.
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: lastEventId
          in: query
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: >-
            Event stream. Data payloads: state is StateEvent, log is
            LogEvent, interview is InterviewReply, result is ResultEvent.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-menagerie-session
      description: >-
        Manager session from sign-in at /auth/login. The cookie is named
        menagerie-session when the redirect URL uses http.
  parameters:
    WorkspaceName:
      name: name
      in: path
      required: true
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    PolicyNames:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
    PolicyGroup:
      type: object
      required: [name, mode, policies]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          description: Assigned by Menagerie, never reused. Omitted for a new group.
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[^\\r\\n]+$"
        mode:
          type: string
          enum: [single, multi]
        policies:
          $ref: "#/components/schemas/PolicyNames"
          minItems: 1
    PolicySettings:
      type: object
      required: [required, groups, revision]
      additionalProperties: false
      properties:
        required:
          $ref: "#/components/schemas/PolicyNames"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PolicyGroup"
        revision:
          type: integer
          minimum: 0
    Policies:
      type: object
      required: [grant, policies, settings]
      additionalProperties: false
      properties:
        grant:
          oneOf:
            - type: "null"
            - type: object
              required: [agents, policies, actions]
              additionalProperties: false
              properties:
                agents:
                  type: array
                  items:
                    type: string
                policies:
                  type: array
                  items:
                    type: string
                actions:
                  type: array
                  items:
                    type: string
        policies:
          type: array
          items:
            type: object
            required: [name, valueNames, inGrant]
            additionalProperties: false
            properties:
              name:
                type: string
              valueNames:
                type: array
                items:
                  type: string
              inGrant:
                type: boolean
        settings:
          $ref: "#/components/schemas/PolicySettings"
    Workspace:
      type: object
      required: [name, state, containerId, activeJob, policies, needsChoice, selectionRevision, appliedRevision, applyFailure, selectionImported, xolotlKey, template, appliedVersion, appliedCommit, needsUpgrade]
      additionalProperties: false
      properties:
        policies:
          $ref: "#/components/schemas/PolicyNames"
        selectionRevision:
          type: integer
          minimum: 0
        appliedRevision:
          type: [integer, "null"]
          minimum: 0
        applyFailure:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/JobError"
        selectionImported:
          type: boolean
        xolotlKey:
          type: [string, "null"]
          description: The stored policy/name address, never a key secret.
        needsChoice:
          type: array
          items:
            type: string
        template:
          description: >-
            The workspace's registered template, or null: a workspace whose
            applied record names a source no registered template has.
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id:
                  type: string
                name:
                  type: string
        appliedVersion:
          type: [string, "null"]
          description: >-
            The template version last applied, such as 1.2.0: from an
            applied record, the template's found version whose tag is at the
            record's commit. Null while it is unknown, until a version check
            finds a tag at the applied commit.
        appliedCommit:
          type: [string, "null"]
          description: The commit of the version last applied, or null when none is known.
        needsUpgrade:
          type: boolean
          description: >-
            True while the workspace's template's current version is newer
            than appliedVersion; false while appliedVersion is null.
        name:
          type: string
        state:
          type: string
          description: >-
            The container's state, or no-folder for a workspace whose folder is gone and that still holds a
            container name or a Xolotl key in Menagerie's data; only delete runs on it.
          enum: [running, stopped, no-container, no-folder]
        containerId:
          type: [string, "null"]
          description: The container's id; null with no container and with no folder.
        activeJob:
          oneOf:
            - type: "null"
            - type: object
              required: [jobId, operation, state]
              additionalProperties: false
              properties:
                jobId:
                  type: string
                operation:
                  type: string
                state:
                  $ref: "#/components/schemas/JobState"
    T3CodePairingToken:
      type: object
      required: [token, expiresAt]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
    Template:
      type: object
      required: [id, name, address, currentVersion, runnerImage, workspaces, newestVersion, versions, currentMoved, lastCheck]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Permanent, made from the name when the template is registered.
        name:
          type: string
        address:
          type: string
          description: >-
            The template's address without a ref; an https address has no
            user information.
        currentVersion:
          type: string
          description: The version a create generates and an upgrade applies, such as 1.2.0.
        runnerImage:
          type: [string, "null"]
          description: The image of the throwaway containers that run its hooks; null for the default.
        workspaces:
          type: array
          description: The names of the workspaces that use it.
          items:
            type: string
        newestVersion:
          type: [string, "null"]
          description: The newest found version, or null when none is found.
        versions:
          type: array
          description: The found versions, in ascending order.
          items:
            type: object
            required: [version, tag, commit]
            additionalProperties: false
            properties:
              version:
                type: string
                description: MAJOR.MINOR.PATCH.
              tag:
                type: string
                description: The tag that gives it, with or without a leading v.
              commit:
                type: string
                description: The tag's commit.
        currentMoved:
          type: boolean
          description: >-
            The last check found the current version's tag at another
            commit than the recorded one; creates and upgrades are refused
            until the template is upgraded to that version again.
        lastCheck:
          description: The last version check, or null before the first.
          oneOf:
            - type: "null"
            - type: object
              required: [at, failure]
              additionalProperties: false
              properties:
                at:
                  type: string
                  format: date-time
                  description: When it ended.
                failure:
                  description: Null when it succeeded, else why it failed.
                  oneOf:
                    - type: "null"
                    - type: string
                      enum: [template-not-found, template-resolve-failed, invalid-address, template-service-unavailable]
    TemplateRegistration:
      type: object
      required: [name, address]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: One line of 1 to 100 characters.
        address:
          type: string
          description: >-
            gh:owner/repository, git@host:path, ssh:// or https://, with an
            optional #folder, and no ref or a version's tag; never a
            password.
        runnerImage:
          type: string
          description: A Docker image reference.
        check:
          type: boolean
          default: false
          description: Run the checks alone, as a registration would, and store nothing.
    TemplateEdit:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        runnerImage:
          type: [string, "null"]
          description: A Docker image reference, or null for the default.
    JobRequest:
      type: object
      required: [operation, workspace]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [start, stop, rebuild, create, upgrade, commit, apply-branch, delete, apply-policies]
        workspace:
          type: string
        policies:
          $ref: "#/components/schemas/PolicyNames"
          description: Create only. Group choices and ordinary policies; absent is empty. Required policies are added by Menagerie.
        templateId:
          type: string
          description: >-
            Required by create, and refused on upgrade: a registered
            template's id, whose current version and commit the create's job
            pins. An upgrade applies the current version of the workspace's
            own template.
        branch:
          type: string
          description: >-
            Required by apply-branch: the short name of a branch of the
            workspace repository, slashes allowed, not a full ref name such
            as refs/heads/<name>. The workspace's own branch is allowed.
        reanswer:
          type: boolean
          default: false
          description: >-
            Upgrade only: ask every question again, with the workspace's
            recorded answers as the defaults, instead of only what they do
            not settle.
    JobState:
      type: string
      enum: [running, waiting-for-answers, succeeded, failed, ended]
    Job:
      type: object
      required: [jobId, workspace, operation, state, phase, createdAt, finishedAt, lastEventId, error, deadline, limit]
      additionalProperties: false
      properties:
        jobId:
          type: string
        workspace:
          type: string
        operation:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        phase:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        lastEventId:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/JobError"
        deadline:
          type: [string, "null"]
          format: date-time
          description: >-
            When the limit that ends first passes. Null when no limit
            applies, while the job waits for answers, and once it has
            ended.
        limit:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/JobLimit"
    JobLimit:
      type: object
      required: [seconds, scope]
      additionalProperties: false
      description: >-
        The time limit that ends first: the job's own (its operation's, else
        the default) or its current phase's. Limits count running time only.
      properties:
        seconds:
          type: number
          exclusiveMinimum: 0
        scope:
          type: string
          enum: [job, phase]
    JobError:
      type: object
      required: [kind, message]
      additionalProperties: false
      properties:
        kind:
          type: string
          examples:
            - timed-out
            - operation-failed
            - initialize-command-failed
            - registry-credentials-unavailable
            - runner-image-unavailable
            - host-prerequisites-missing
            - provisioning-invalid
            - provisioning-unavailable
            - provisioning-not-ready
            - binding-outside-grant
            - policy-outside-grant
            - binding-changed
            - binding-pending
            - binding-refused
            - internal-error
            - workspace-exists
            - template-refused
            - template-service-unavailable
            - generation-failed
            - upgrade-failed
            - not-applied
            - merge-conflicted
            - backup-failed
            - commit-failed
            - branch-not-found
            - fetch-failed
            - not-applicable
            - apply-failed
            - delete-refused
            - delete-unfinished
        message:
          type: string
    StateEvent:
      type: object
      required: [state, phase, deadline, limit]
      properties:
        state:
          $ref: "#/components/schemas/JobState"
        phase:
          type: string
        deadline:
          type: [string, "null"]
          format: date-time
        limit:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/JobLimit"
    LogEvent:
      type: object
      required: [text]
      properties:
        text:
          type: string
    ResultEvent:
      type: object
      required: [state, error]
      properties:
        state:
          $ref: "#/components/schemas/JobState"
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/JobError"
        apply:
          $ref: "#/components/schemas/ApplyResult"
    AnswerRequest:
      type: object
      required: [session, submission]
      additionalProperties: false
      properties:
        session:
          type: object
          description: The latest reply's session, returned byte for byte.
        submission:
          type: object
          description: Toha's answers envelope.
          required: [template, answers]
          properties:
            template:
              type: string
            answers:
              type: object
    InterviewReply:
      type: object
      required: [session, state, document, warnings]
      properties:
        session:
          type: object
          description: Toha's staged record, opaque.
        state:
          type: string
          enum: [questions, completed, ended]
        document:
          description: >-
            Toha's batch document while questions remain, its ended document
            after a flow stop or abort, null once the interview completed.
          oneOf:
            - type: "null"
            - type: object
        warnings:
          type: array
          items:
            type: string
    ApplyResult:
      type: object
      required: [outcome, files, recordPath, messages, hooks, conflicts]
      properties:
        outcome:
          type: string
          enum: [written, conflicted, already-current, needs-trust, planned]
        files:
          type: array
          items:
            type: object
            required: [path, action]
            properties:
              path:
                type: string
              action:
                type: string
        recordPath:
          type: [string, "null"]
        messages:
          type: array
          items:
            type: string
        hooks:
          type: array
          items:
            type: object
            required: [id, exitCode, success]
            properties:
              id:
                type: [string, "null"]
              exitCode:
                type: [integer, "null"]
              success:
                type: boolean
        conflicts:
          type: array
          items:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
              examples:
                - selection-changed
                - policy-required
                - policy-choice-required
                - settings-changed
                - policy-outside-grant
                - invalid-settings
                - wyrwood-unavailable
                - provisioning-unavailable
                - invalid-request
                - unknown-operation
                - invalid-workspace-name
                - invalid-branch
                - workspace-not-found
                - workspace-busy
                - workspace-exists
                - unknown-template
                - template-check-failed
                - template-exists
                - template-in-use
                - template-not-registered
                - version-not-newer
                - upgrade-not-needed
                - template-version-moved
                - job-not-found
                - job-not-waiting
                - template-service-unavailable
                - not-found
                - docker-unavailable
                - workspace-root-unreadable
                - internal-error
            message:
              type: string
            activeJobId:
              type: string
              description: Present with workspace-busy.
            check:
              type: string
              description: >-
                Present with template-check-failed: the first registration
                check that failed.
              enum: [address, fetch, version, read, definition]
