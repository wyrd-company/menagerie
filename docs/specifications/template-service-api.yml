$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - menagerie
    - configuration
    - browser-session-value-tampering
format: json
description: >-
  The template service embeds Toha and serves the workspace service, its only
  client, with JSON over HTTP/1.1 on the Unix socket named by
  `template-service.socket` in the Menagerie configuration. It reads that
  file (`-config`, default `/etc/menagerie/config.yml`) only for
  `workspace-root`, `templates`, `template-service.socket`,
  `template-service.hook-runner-socket` and
  `template-service.candidate-folder`, with the workspace service's rules
  for them, and ignores its other members. The service starts no process:
  the workspace service runs every template hook. The candidate folder,
  default `/var/lib/menagerie/candidates`, is the service's temporary
  folder: the service creates it when it is missing, private to its user,
  and every temporary folder Toha makes is inside it, an upgrade's
  candidate included. Toha's
  configuration, registry, cache and state live under the folder named by
  `-data`, default `/var/lib/menagerie/toha`, with the session key
  `session-key`: 32 random bytes, readable only by the service, written on
  the first start and read on every later one. A key file of another
  length, or one its group or others may read, stops the start. On start it replaces a socket file left by an ended
  process and refuses a live socket or another file. It keeps no state
  between requests.


  Routes. Every route is `POST` with a JSON body and answers JSON.
  `/v1/interviews` starts a create interview and `/v1/upgrades` starts an
  upgrade, both with `{"workspace","target","templateId"}`.
  `/v1/interviews/answers` and `/v1/upgrades/answers` add `"session"` and
  `"submission"`. `/v1/workspaces/generate` and `/v1/upgrades/apply` add
  `"session"` and an optional `"hookToken"`, the workspace service's grant
  for that request's hooks. Other members are refused. `workspace` is the folder name,
  `target` is that folder under the workspace root, and `templateId` is an
  approved template's `id`; for an upgrade it names the template version to
  upgrade to. Another path answers 404 `not-found`, another method 405
  `method-not-allowed`.


  Checks. Before Toha replays or writes anything, every route checks that
  `workspace` is a plain folder name, that `target` is lexically the
  workspace root joined with it, that the folder's real path, with symbolic
  links resolved, is a direct child of the root's real path, and that
  `templateId` is approved. A route that carries a session then verifies its
  signature for this flow (create or upgrade), `workspace` and `templateId`,
  and refuses an unsigned value, an altered record or signature, and a value
  issued for another flow, workspace or template as `session-tampered`. Only
  then does it read the record and check that the session's template and named flag are the approved address's formal
  identity, computed without fetching, that it was started for this target,
  and that it belongs to this flow: a create session has no update base, and
  an upgrade session's base is a recorded application. A submission is
  Toha's answers envelope `{"template","answers"}`, which Toha verifies
  against the session's template before any answer exists.


  Interview replies. Start and answer routes answer 200 with
  `{"session","state","document","warnings"}`. `session` is
  `{"record","signature"}`. `record` is Toha's whole staged record: the
  pinned template and revision, the invocation context, admitted documents
  and accepted submissions. `signature` is the unpadded base64url
  HMAC-SHA256, under the session key, of the flow, `workspace`,
  `templateId` and the record's JSON serialization, each prefixed by its
  length. The workspace service returns the session unchanged with the next
  request. `state` is `questions`, `completed` or
  `ended`. `document` is Toha's batch document while questions remain,
  Toha's ended document after a flow `stop` or `abort`, and `null` once the
  interview completed. A rejected submission answers 200 with the same
  batch, its `errors` and an unchanged session. An abort does not record its
  batch. Every request rebuilds the interview from the session, so it
  continues after a service restart.


  Revisions. A start admits the revision its approved address resolves to:
  a tag or commit address its fixed commit, a branch address, or one
  without a reference, the branch's current commit. Its session keeps that
  revision until it ends. The admission is Toha's source cache entry for
  the approved template, the folder Toha replays a resumed revision from:
  a start that resolves through Toha's cache records it there, and one that
  resolves through an installation materializes it there through Toha's
  resume. Before any replay, a session's commit must be a full Git object
  id whose cache entry for the approved template, inside the service's
  cache, is a checkout of exactly that commit whose origin is a repository
  Toha fetches the approved template from: the approved address as Toha
  parses it, or the repository Toha derives from the template's formal
  name, which drops a `.git` suffix and writes a known host as its
  shorthand. An installation that holds exactly that commit also admits
  it, as Toha's resume replays from it; when Toha cannot fetch an installed
  template from its formal name, only the installation admits the commit,
  until the installation moves. When the cache holds no admission at all
  for the approved template, the
  session is admitted only when the approved address resolves to exactly
  its commit now, without any refresh. Any other session is refused as
  `session-mismatch`. An admitted session replays from the cache
  without reaching its source. A start first refreshes an approved template
  installed in Toha's user registry the way Toha's catalog update does: an
  installed branch moves to its current commit, an installed tag or commit
  stays. A start whose commit already has another source's entry under the
  same cache key is refused as `template-cache-conflict`. The admission is
  only as narrow as what reaches Toha's cache: clearing the cache leaves a
  session only the resolution check, Toha also caches the base revision
  named by a workspace's applied record when an upgrade starts, and a cache
  entry's files are trusted as the service's own once its HEAD and origin
  match.


  Create. `/v1/interviews` refuses an existing folder. Its first batch asks
  every question of the template; a document question without an input
  file is asked as a JSON object. `/v1/workspaces/generate` applies a
  completed session into the folder the workspace service created and
  initialized: it must exist, hold only `.git`, and be a Git repository.
  Generation succeeds only when
  Toha wrote the applied record `.toha.json`; files written without it are
  the error `record-not-written`. A hook failure leaves the files written
  before it and no applied record, so the folder is no longer new and a
  second generation into it is refused.


  Upgrade. `/v1/upgrades` reads the workspace's applied record, replays its
  recorded answers against the newer version and asks only the questions
  they do not answer; a recorded answer the newer version rejects is asked
  again with its error. Document questions take the workspace's current
  input files when the upgrade starts, and keep those values for the whole
  session. The workspace must be clean and its applied record unchanged for
  the whole session. `/v1/upgrades/apply` merges a completed session.


  Hooks. Generate and apply hand each of the template's hooks to the
  workspace service's hook runner: JSON over HTTP/1.1, `POST /v1/hooks/run`
  on the Unix socket named by `template-service.hook-runner-socket`,
  default `/run/menagerie/hook-runner.sock`, which the workspace service
  listens on, open to the services' user only. The request is
  `{"token","target","program","cwd","templateRoot","capture"}`: `token`
  is the request's `hookToken`; `target` is Toha's target with its
  symbolic links resolved: for a generate, the workspace folder; for an
  upgrade's apply, Toha's candidate, a folder inside the candidate folder
  where Toha applies the new version before it merges the result into the
  workspace; `program` is
  `{"run": [argv]}` or `{"script": {"path","args"}}`, a file of the
  template; `cwd` is the hook's target-relative working directory or
  `null`; `templateRoot` is the template's folder in Toha's cache; and
  `capture` is `{"stdout","stderr"}`, the streams the hook declares. The
  workspace service resolves the working directory under the target with
  symbolic links followed and runs the hook in a throwaway container in
  the folder it resolves to, the program as given, with an empty
  environment; a script's template folder is copied into the container at
  its own path first. A generate's target is mounted. An upgrade's
  candidate is copied in, the workspace folder is not mounted, and when
  the hook exits the candidate is copied back so it holds exactly what the
  hook left. A run hook answers 200 with
  `{"exitCode","success","stdout","stderr"}`, where a captured stream holds
  its raw bytes in base64 and an uncaptured one is `null` and went to the
  job console. Any other answer is `{"error":{"kind","message"}}` with
  one of the hook runner's kinds: `malformed-request` and `invalid-hook`,
  status 400, for a request that is not a hook, a working directory that
  is missing, not a folder, or outside the target once its symbolic links
  are followed, or a script outside its template;
  `hook-token-refused`, status 403, for an unknown or revoked token or a
  `target` the token does not admit: a generate's token admits its job's
  workspace folder and the folders inside it, an apply's token only a
  folder inside the candidate folder, named without a symbolic link, never
  the workspace folder; `hook-cancelled`, status
  409, when the job was cancelled, its container then killed and removed;
  `runner-image-unavailable`, status 503, when no runner image could be
  found or pulled; `hook-container-failed`, status 500, when the Engine
  failed or the candidate could not be copied back. A refusal's message is
  a fixed sentence. The job console names the failure: the runner image,
  and a failed container's stage (inspect, pull, create, copy, attach,
  start, wait, copy-back, remove) and the Engine error's class, or
  `unsafe-entry` for a copy back that held an entry the copy refuses, never
  the Engine's message, which can name the program or its working
  directory. The
  workspace service revokes the token when the generate or apply request
  returns. A generate or apply without `hookToken`, or whose hook the
  runner refuses, fails that hook: the reply is `hook-io-failed`, and its
  message names the hook and a reason this service chose for the runner's
  kind, never the runner's message. A hook that runs and fails
  is `hook-failed`, named by its position, its `id` when it has one and its
  exit code, never by its program, arguments or working directory, which
  can hold an earlier hook's captured output; `hook-io-failed` names the
  hook the same way. No reply, error or log line carries a captured
  stream. Toha's `requires` check resolves programs on
  this service's own `PATH`, which agrees with a hook's only when it runs
  in Menagerie's own image.


  Credentials. The hook runner socket also serves `POST
  /v1/credentials/github`, the GitHub App credentials of a template fetch
  over `https`. The request is `{"url"}`, the repository's `https` URL
  without user information; an unknown member, a second value or a body
  over 8 KiB is refused. For a URL on the configured GitHub App's server
  whose path is exactly `/{owner}/{repo}` or `/{owner}/{repo}.git`, with no
  query or fragment, the answer is 200
  `{"username":"x-access-token","password"}`, where `password` is an
  installation token with contents read on that one repository. Every
  other answer is `{"reason"}`, a fixed sentence: 404 when no `github-app`
  is configured or the URL is any other, and this service then fetches as
  Toha does by default; 502 when the token could not be minted, the reason
  naming the cause without a token, URL or GitHub answer; 400 for a body
  that is not a credential request; 405 for a method other than POST. The
  answer carries `Cache-Control: no-store`. This service keeps the token
  in memory for the one fetch and never writes it to disk.


  Apply replies. Generate and apply answer 200 with `{"outcome","files",
  "recordPath","messages","hooks","conflicts"}`. `outcome` is `written`,
  `conflicted`, `already-current`, `needs-trust` or `planned`; only
  `written` and `conflicted` wrote files and the applied record at
  `recordPath`. `conflicted` is a written merge whose `conflicts` lists the
  paths written with conflict markers. `files` lists `{path, action}`;
  `hooks` lists `{id, exitCode, success}` for each hook that ran. Hook output
  is not returned: the workspace service's job console shows what a hook
  does not capture.


  Errors. A refusal answers `{"error":{"kind","message"}}`, adding `paths`
  for refused files, `locations` and `questions` for refused request values,
  and `warnings`. Generate and apply build every refusal Toha causes from a
  message this service chose for the error's variant: no message, path or
  warning carries a value Toha rendered, since a hook's captured output can
  reach any value rendered after that hook ran. Their `paths` stay only on
  `target-conflict` and `target-drift`, which are found from the plan
  before any hook runs. Request and session: `malformed-request` (400),
  `malformed-session` (400), `session-tampered` (400),
  `malformed-submission` (400),
  `submission-template-mismatch` (400), `number-not-representable` (400),
  `nesting-too-deep` (400),
  `invalid-workspace` (400), `target-mismatch` (400), `unknown-template`
  (404), `workspace-not-found` (404), `not-found` (404),
  `method-not-allowed` (405), `target-outside-root` (409),
  `session-mismatch` (409). Interview state: `interview-complete` (409),
  `interview-ended` (409), `interview-not-complete` (409). Workspace state:
  `workspace-exists` (409), `target-not-new` (409), `not-git` (409),
  `dirty-target` (409), `stale-application` (409), `target-conflict` (409),
  `target-drift` (409), `target-symlink` (409), `target-occupied` (409),
  `target-changed` (409). Toha refusals: `template-not-found` (422),
  `template-stale-revision` (422), `template-ambiguous` (422),
  `template-resolve-failed` (422), `template-refresh-failed` (422),
  `template-cache-conflict` (409),
  `template-invalid` (422),
  `missing-requirements` (422), `document-invalid` (422), `parts-invalid`
  (422), `context-invalid` (422), `environment-refused` (422),
  `evaluation-failed` (422), `plan-failed` (422), `record-invalid` (422),
  `project-invalid` (422), `merge-base-failed` (422), `update-refused`
  (422), `merge-failed` (422), `operation-refused` (422), `apply-failed`
  (422), `hook-failed` (422). Faults: `io-failed` (500), `hook-io-failed`
  (500), `record-failed` (500), `record-not-written` (500),
  `workspace-root-unavailable` (500), `internal-error` (500).


  Nesting. A request nested deeper than 127 levels, the most serde_json
  reads into a value, is refused as `nesting-too-deep` before it is parsed.


  Numbers. Toha holds JSON numbers as 64-bit integers or floating-point
  values. A request number whose value that changes is refused as
  `number-not-representable`, naming each by its JSON Pointer in
  `locations` and its answer's question id in `questions`. Every 64-bit
  signed and unsigned integer and every number whose shortest
  floating-point form has the same decimal value is accepted; its text can
  change (`1e2` returns as `100.0`, `1.50` as `1.5`). A session the service
  produced returns byte for byte. A document input file is read by Toha
  itself when an upgrade starts, so a number in it that Toha's
  representation changes is changed, not refused.
validation-criteria: >-
  `cargo test --locked` in `template-service/` runs the service against
  Toha's library on a Unix socket: `tests/create.rs` covers create, rejected
  answers, generation into an initialized repository, revision pinning and
  flow ends; `tests/hooks.rs` covers hook folders, hook and I/O failures,
  and hooks without a granted token, against a hook runner that runs each
  hook as a local process; the unit tests in `src/hooks.rs` cover the hook
  runner request, captured streams, exit codes, refusals and malformed
  replies, none of which puts a stream or a reply's text in an error; the
  unit tests in `src/error.rs` drive a captured value through every apply
  error that can carry one, alone and wrapped as generate and apply
  return it, and find it in no refusal;
  `tests/numbers.rs` covers number values through the session and the
  applied record; `tests/revisions.rs` covers admitted revisions for
  fixed and moving addresses, installed branches and tags;
  `tests/offline.rs` resumes every route offline after a restart; `tests/upgrade.rs` covers an
  upgrade between two template versions that asks only the new question and
  keeps local edits, rejected recorded answers, fresh and kept documents,
  stale and dirty workspaces, conflicts and the document-file number limit;
  `tests/requests.rs` covers every request check, and refuses a session
  with any record member altered, without its signature, signed with
  another key, or replayed into another workspace, template or flow, while
  the untouched session completes and generates; `tests/restart.rs` runs
  the binary across a restart; `tests/limits.rs` sends the binary a request
  nested far deeper than any value; `tests/contract.rs` checks that this
  specification names every route and error kind the service uses.
