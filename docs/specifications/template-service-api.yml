$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - menagerie
    - configuration
    - browser-session-value-tampering
format: json
description: >-
  The template service embeds Toha and serves the workspace service, its only
  client, with JSON over HTTP/1.1 on the Unix socket named by
  `template-service.socket` in the Menagerie configuration. It reads that
  file (`-config`, default `/etc/menagerie/config.yml`) only for
  `workspace-root`, `template-service.socket`,
  `template-service.hook-runner-socket` and
  `template-service.candidate-folder`, with the workspace service's rules
  for them, and ignores its other members, `templates` included: the
  workspace service names each template's address in its requests, and
  this service holds no list of templates. The service starts no process:
  the workspace service runs every template hook. The candidate folder,
  default `/var/lib/menagerie/candidates`, is the service's temporary
  folder: the service creates it when it is missing, private to its user,
  and every temporary folder Toha makes is inside its subfolder
  `.menagerie-work`, private to the same user, an upgrade's candidate
  included. A service holds a shared `flock` on that subfolder for its
  lifetime, and one that cannot take it does not start. At start-up, once the socket is bound and before the first
  request, a service that alone holds the subfolder removes leftovers
  directly inside it, each named on standard error: a folder or file named
  `.tmp` and six letters or digits, and a folder named `.menagerie-copy-`
  and a decimal number, belonging to the service's user. It follows no
  symbolic link and removes read-only folders; it leaves every other entry
  and everything outside the subfolder. An entry it cannot
  remove, or a pass that fails, is named on standard error and does not
  stop the start. Toha's
  configuration, registry, cache and state live under the folder named by
  `-data`, default `/var/lib/menagerie/toha`, with the session key
  `session-key`: 32 random bytes, readable only by the service, written on
  the first start and read on every later one. A key file of another
  length, or one its group or others may read, stops the start. On start it replaces a socket file left by an ended
  process and refuses a live socket or another file. It keeps no state
  between requests.


  Routes. Every route is `POST` with a JSON body and answers JSON.
  `/v1/templates/addresses` reads a template's address and
  `/v1/templates/versions` lists its versions, both with `{"address"}`, and
  `/v1/templates/checks` checks one version, with `{"address","ref"}` and
  an optional `"since"`.
  `/v1/interviews` starts a create interview and `/v1/upgrades` starts an
  upgrade, both with `{"workspace","target","address","ref","commit"}`,
  `commit` optional.
  `/v1/interviews/answers` and `/v1/upgrades/answers` add `"session"` and
  `"submission"`. `/v1/workspaces/generate` and `/v1/upgrades/apply` add
  `"session"` and an optional `"hookToken"`, the workspace service's grant
  for that request's hooks. `/v1/upgrades` also takes an optional boolean
  `"reanswer"`, false when absent. Every route but
  `/v1/templates/addresses` also takes an optional `"credential"`, the
  template's credential (below). Other members are refused, a `templateId`
  included, and a missing member, a missing `ref` included, is
  `malformed-request` (400). `workspace` is the folder name, `target` is
  that folder under the workspace root, `address` is the template's address
  without a ref, `ref` is the version's tag, and `commit`, when the
  workspace service recorded one for the version, is the commit the ref
  must resolve to; for an upgrade they name the template version to upgrade
  to. Another path answers 404 `not-found`, another method 405
  `method-not-allowed`.


  Addresses. The service holds no list of templates: the workspace service
  names each address, and every route that takes one admits it before any
  other work, reaching no network and no file. It accepts only a remote Git
  address of the forms the user documentation lists: `gh:` with an owner and
  a repository, which must still be `https` once Toha expands it with the
  hosts of the service's Toha configuration, `git@host:path`, `ssh://` and
  `https://`. It refuses as `invalid-address` (400) a local folder, a name
  from Toha's registry, every other transport, `file://`, `git://` and
  `http://` included, a host or user that starts with `-`, user information
  that holds a password, such as `https://user:token@host/repo`, empty
  `user:@` included, an address that does not read one way, and, on the
  versions route, an address with a ref. Git, gix and Toha end a URL's
  authority at its first `/`, so a password that holds one, as in
  `https://user:12/token@host` or `https://alice@host:12/token@gitserver`,
  reads as a host, a port, a path and a ref. So an address reads one way
  only when: in an `https://` or `ssh://` address, the text after `://`
  holds no `:` before an `@`, checked on the text before any parser reads
  it, which refuses a password and also a port followed by a ref; the user
  name and host gix reads of the repository, its path, and Toha's ref and
  `#` folder are each in a strict set, a user name and path of letters,
  digits and `.` `_` `~` `-` (a path also `/`), a ref of letters, digits
  and `.` `_` `-`, a folder of those and `/`, and a host of lower-case
  letters, digits, `.` and `-`; a strict writer, given those parts, writes
  the address back exactly, so nothing was decoded from a `%` escape,
  dropped or read across a separator; and a ref that follows
  `git@host:path`, or holds a `.` and so could be a host name, is a
  version's tag. User information with no `:` is a user name, not a
  password.
  No refusal quotes the address, so a password given by mistake is shown
  nowhere. `/v1/templates/addresses`
  answers 200 `{"source","reference","base","url"}`: `source` is Toha's formal name
  of the repository and folder without a ref, the source an applied record
  names; `reference` is the ref the address names, or null; and `base` is the
  address the strict writer writes without its ref, and for an `https`
  address also without its user name; and `url` is the Git URL a fetch of
  the address connects to, a `gh:` address expanded, which is the URL a
  template's credential has to fit.


  Versions. `/v1/templates/versions` lists the tags of the repository an
  address without a ref names, without fetching its history, through the
  transport and credentials a Toha fetch of that address uses: an HTTPS
  challenge asks the credential route below as a fetch's does, curl's
  verbose output stays off, and curl's bundled rustls trusts the platform's
  roots when Git names no certificate bundle. It answers 200
  `{"source","versions"}`, each version `{"version","tag","commit"}`, in
  ascending order. A version is a tag `MAJOR.MINOR.PATCH`, with an optional
  leading `v`, whose numbers have no leading zero; a tag with a pre-release
  or build part is not one. Versions order by their numbers; `version` is
  the numbers without `v`, and when `1.2.0` and `v1.2.0` both exist the tag
  without `v` is the version's. `commit` is the commit the tag names, an
  annotated tag peeled. A remote that answers that the repository does not
  exist, an HTTP 404 or a Git host's not-found answer over SSH, is
  `template-not-found` (422), and any other failure to list is
  `template-resolve-failed` (422), each with a fixed sentence. The listing
  runs on a thread of its own: when the caller goes away the request
  worker returns at once, and the listing keeps its connection until the
  remote acts, as an abandoned fetch does (below).


  Template checks. `/v1/templates/checks` names the version by `ref`, the
  version's tag, beside an address without a ref; an address with a ref, or
  a ref that is empty, starts with `-`, or holds a space, a control
  character, `@`, `#` or `:`, is `invalid-address`. It has Toha resolve and
  fetch the repository at that ref into its cache, as a create's start
  does, and answers 200 `{"source","commit","definition"}`: the address's
  `source`, the `commit` the ref resolved to, and `definition`, whether the
  template's content folder, from which Toha renders a workspace's files,
  holds `.devcontainer/devcontainer.json`. With `"since"`, a full Git object
  id in Toha's spelling, the reply also has `descends`: true when the
  `commit` is that commit or one of the commits it descends from in the
  history Toha fetched, which holds every ancestor of the commit, and false
  otherwise, also for a commit the repository does not have; a `since` that
  is not such an id is `malformed-request` (400). Without `since` the reply
  has no `descends`. It runs no hook and no other
  command of the template. A fetch Toha refuses is that refusal, such as
  `template-resolve-failed` (422) for a ref the repository does not have.
  Before Toha reads the template's files, the template folder, the checkout
  joined with the address's `#path` and resolved, must be in the checkout:
  one the repository does not hold is `template-invalid` (422), and one
  outside the checkout, or one that holds a symbolic link, followed or not,
  that resolves outside it, is `unsafe-template-link` (422); the checkout's
  own `.git` is not walked. Then Toha loads the template's manifest, and a
  manifest it refuses is `template-invalid`. Generate and apply make the
  same folder and link check, before Toha reads any of the session's
  template, on the folder Toha's resume reads: its cache entry for the
  session's commit with the formal name's `#path`, or the installation that
  holds that commit; the create and upgrade starts make it once they have
  fetched the version, before Toha loads it. So no request makes the service
  read its own files, such as its session key, as a template, or hand one
  to a hook.


  Checks. Before Toha replays or writes anything, every route checks that
  `workspace` is a plain folder name, that `target` is lexically the
  workspace root joined with it, that the folder's real path, with symbolic
  links resolved, is a direct child of the root's real path, that `commit`,
  when given, is a full Git object id, else `malformed-request`, and that
  `address` at `ref` is admitted (see Addresses): the address without a
  ref of its own is admitted; `ref` is letters, digits, `.`, `_` and `-`,
  not starting with `-`; and Toha's reading of the address at `ref` names
  the admitted repository and folder at exactly that ref, else
  `invalid-address`. So a route takes a version beside an address with a
  port, which the address alone could not name. A route
  that carries a session then verifies its signature for this flow (create
  or upgrade), `workspace`, `address` and `ref`, and refuses an unsigned
  value, an altered record or signature, and a value issued for another
  flow, workspace, address or ref as `session-tampered`. Only then does it
  read the record and check that the session's template and named flag are
  the formal identity of the request's address at its ref, computed without
  fetching, that it was started for this target, and that it belongs to
  this flow: a create session has no update base, and an upgrade session's
  base is a recorded application. With `commit`, a session's commit, and at
  a start the commit the ref resolves to once fetched, before Toha reads the
  version's files, must be that commit, else `template-stale-revision`
  (422); an upgrade start fetches the version again through Toha's upgrade
  preparation and refuses a commit that changed in between the same way.
  So a moved tag never brings in content no check saw. A submission is
  Toha's answers envelope `{"template","answers"}`, which Toha verifies
  against the session's template before any answer exists. A question the
  latest reply showed and the submission leaves out is answered as Toha's
  terminal answers a blank: with its default, else with `null`, the empty
  answer, when it is optional. A required question without a default and
  a document question stay out, so Toha refuses the one and reads the
  other's input file. Toha's update resume skips a recorded batch with no
  answers at all (wyrd-company/toha#67), so without this a batch accepted
  as shown, `{}`, would be asked again.


  Interview replies. Start and answer routes answer 200 with
  `{"session","state","document","warnings"}`. `session` is
  `{"record","signature"}`. `record` is Toha's whole staged record: the
  pinned template and revision, the invocation context, admitted documents
  and accepted submissions. `signature` is the unpadded base64url
  HMAC-SHA256, under the session key, of a domain tag, the flow,
  `workspace`, `address`, `ref` and the record's JSON serialization, each
  prefixed by its length. The workspace service returns the session unchanged with the next
  request. `state` is `questions`, `completed` or
  `ended`. `document` is Toha's batch document while questions remain,
  Toha's ended document after a flow `stop` or `abort`, and `null` once the
  interview completed. A rejected submission answers 200 with the same
  batch, its `errors` and an unchanged session. An abort does not record its
  batch. Every request rebuilds the interview from the session, so it
  continues after a service restart.


  Revisions. A start admits the revision the request's address at its ref
  resolves to: a tag or commit ref its fixed commit, a branch ref the
  branch's current commit. Its session keeps that revision until it ends.
  The admission is Toha's source cache entry for the requested template,
  the folder Toha replays a resumed revision from:
  a start that resolves through Toha's cache records it there, and one that
  resolves through an installation materializes it there through Toha's
  resume. Before any replay, a session's commit must be a full Git object
  id whose cache entry for the requested template, inside the service's
  cache, is a checkout of exactly that commit whose origin is a repository
  Toha fetches the requested template from: the request's address at its
  ref as Toha parses it, or the repository Toha derives from the template's formal
  name, which drops a `.git` suffix and writes a known host as its
  shorthand. An installation that holds exactly that commit also admits
  it, as Toha's resume replays from it; when Toha cannot fetch an installed
  template from its formal name, only the installation admits the commit,
  until the installation moves. When the cache holds no admission at all
  for the requested template, the session is admitted only when the
  request's address at its ref resolves to exactly its commit now, without
  any refresh. Any other session is refused as
  `session-mismatch`. An admitted session replays from the cache
  without reaching its source. A start first refreshes a requested template
  installed in Toha's user registry the way Toha's catalog update does: an
  installed branch moves to its current commit, an installed tag or commit
  stays. A start whose commit already has another source's entry under the
  same cache key is refused as `template-cache-conflict`. The admission is
  only as narrow as what reaches Toha's cache: clearing the cache leaves a
  session only the resolution check, Toha also caches the base revision
  named by a workspace's applied record when an upgrade starts, and a cache
  entry's files are trusted as the service's own once its HEAD and origin
  match.


  Create. `/v1/interviews` refuses an existing folder. Its first batch asks
  every question of the template; a document question without an input
  file is asked as a JSON object. `/v1/workspaces/generate` applies a
  completed session into the folder the workspace service created and
  initialized: it must exist, hold only `.git`, and be a Git repository.
  Generation succeeds only when
  Toha wrote the applied record `.toha.json`; files written without it are
  the error `record-not-written`. A hook failure leaves the files written
  before it and no applied record, so the folder is no longer new and a
  second generation into it is refused.


  Upgrade. `/v1/upgrades` reads the workspace's applied record, replays its
  recorded answers against the newer version and asks only the questions
  they do not answer; a recorded answer the newer version rejects is asked
  again with its error. Document questions take the workspace's current
  input files when the upgrade starts, and keep those values for the whole
  session. The workspace must be clean and its applied record unchanged for
  the whole session. `/v1/upgrades/apply` merges a completed session.
  A start with `reanswer` asks every question through Toha's re-answer,
  which gives each question its recorded answer as the default, and the
  session's signed record keeps it for every later request. A document
  question still takes its input file.


  Hooks. Generate and apply hand each of the template's hooks to the
  workspace service's hook runner: JSON over HTTP/1.1, `POST /v1/hooks/run`
  on the Unix socket named by `template-service.hook-runner-socket`,
  default `/run/menagerie/hook-runner.sock`, which the workspace service
  listens on, open to the services' user only. The request is
  `{"token","target","program","cwd","templateRoot","capture"}`: `token`
  is the request's `hookToken`; `target` is Toha's target with its
  symbolic links resolved: for a generate, the workspace folder; for an
  upgrade's apply, Toha's candidate, a folder inside the candidate folder
  where Toha applies the new version before it merges the result into the
  workspace; `program` is
  `{"run": [argv]}` or `{"script": {"path","args"}}`, a file of the
  template; `cwd` is the hook's target-relative working directory or
  `null`; `templateRoot` is the template's folder in Toha's cache; and
  `capture` is `{"stdout","stderr"}`, the streams the hook declares. The
  workspace service resolves the working directory under the target with
  symbolic links followed and runs the hook in a throwaway container in
  the folder it resolves to, the program as given, with an empty
  environment; a script's template folder is copied into the container at
  its own path first. A generate's target is mounted. An upgrade's
  candidate is copied in, the workspace folder is not mounted, and when
  the hook exits the candidate is copied back so it holds exactly what the
  hook left. A run hook answers 200 with
  `{"exitCode","success","stdout","stderr"}`, where a captured stream holds
  its raw bytes in base64 and an uncaptured one is `null` and went to the
  job console. Any other answer is `{"error":{"kind","message"}}` with
  one of the hook runner's kinds: `malformed-request` and `invalid-hook`,
  status 400, for a request that is not a hook, a working directory that
  is missing, not a folder, or outside the target once its symbolic links
  are followed, or a script outside its template;
  `hook-token-refused`, status 403, for an unknown or revoked token or a
  `target` the token does not admit: a generate's token admits its job's
  workspace folder and the folders inside it, an apply's token only a
  folder inside the candidate folder, named without a symbolic link, never
  the workspace folder; `hook-cancelled`, status
  409, when the job was cancelled, its container then killed and removed;
  `runner-image-unavailable`, status 503, when no runner image could be
  found or pulled; `hook-container-failed`, status 500, when the Engine
  failed or the candidate could not be copied back. A refusal's message is
  a fixed sentence. The job console names the failure: the runner image,
  and a failed container's stage (inspect, pull, create, copy, attach,
  start, wait, copy-back, remove) and the Engine error's class, or
  `unsafe-entry` for a copy back that held an entry the copy refuses, never
  the Engine's message, which can name the program or its working
  directory. The
  workspace service revokes the token when the generate or apply request
  returns. A generate or apply without `hookToken`, or whose hook the
  runner refuses, fails that hook: the reply is `hook-io-failed`, and its
  message names the hook and a reason this service chose for the runner's
  kind, never the runner's message. A hook that runs and fails
  is `hook-failed`, named by its position, its `id` when it has one and its
  exit code, never by its program, arguments or working directory, which
  can hold an earlier hook's captured output; `hook-io-failed` names the
  hook the same way. No reply, error or log line carries a captured
  stream. Toha's `requires` check resolves programs on
  this service's own `PATH`, which agrees with a hook's only when it runs
  in Menagerie's own image.


  Template credentials. A request's `credential` is the one credential its
  Git connections use, as the template's registration records it:
  `{"githubApp"}`, a GitHub App by its configured name, or `{"sshKey"}`, a
  public key in authorized-keys form, a comment allowed. A credential that
  names neither or both, an empty App name, a key Toha's `SshKey::parse`
  refuses or another member is `invalid-credential` (400), before any
  network is reached. With an App, every credential request of the
  operation names it (below). With a key, the credential route is never
  asked, and the operation runs inside Toha's `with_ssh_key` scope, so each
  SSH connection of its Toha fetches offers only that key from the agent at
  `SSH_AUTH_SOCK`, once that agent has listed it; a key the agent does not
  list fails the fetch with a message naming the key's type and
  fingerprint, and no other key is tried. The version listing does not go
  through Toha, so it pins the key itself: it fails with
  `template-resolve-failed`, naming the key's fingerprint, unless the agent
  lists the key, and runs the configured `ssh` command with
  `-o IdentitiesOnly=yes`, `IdentityFile` naming a file that holds the
  public key, and `IdentityAgent` naming the agent. Unlike Toha it does not
  run `ssh -G` first to check that no SSH configuration adds another
  identity; Menagerie's image sets none
  ([Toha #94](https://github.com/wyrd-company/toha/issues/94) would list
  tags through Toha). A request without a credential keeps the rule chosen
  by URL: the route picks the App, and SSH offers every key the agent
  holds.


  Credentials. The hook runner socket also serves `POST
  /v1/credentials/github`, the GitHub App credentials of a template fetch
  over `https`. The request is `{"url"}`, the repository's `https` URL
  without user information, and, when the template's credential is an
  App, `"githubApp"`, its name; an unknown member, a second value or a body
  over 8 KiB is refused. Without `githubApp`, for a URL on a configured
  GitHub App's server whose path is exactly `/{owner}/{repo}` or
  `/{owner}/{repo}.git`, with no query or fragment, the first such App
  answers 200 `{"username":"x-access-token","password"}`, where
  `password` is an installation token with contents read on that one
  repository. With `githubApp`, only the App of that name, matched in any
  case, answers, and for that same form of URL on its own server. Every
  other answer is `{"reason"}`, a fixed sentence: 404 when, without
  `githubApp`, no `github-app` is configured or the URL is any other, and
  this service then fetches as Toha does by default; 502 when the named App
  is not configured or does not serve the URL, the reason naming the App,
  or when the token could not be minted, the reason naming the cause
  without a token, URL or GitHub answer; 400 for a body
  that is not a credential request; 405 for a method other than POST. The
  answer carries `Cache-Control: no-store`. This service keeps the token
  in memory for the one fetch and never writes it to disk.


  Every request runs its Toha work on one worker thread inside one Toha
  credential resolver scope and stop signal scope, so every fetch of that
  request, and only that request, can ask the route. This service asks only when an `https`
  remote asks for credentials, once for each challenge, with the URL
  `https://host[:port]/path`. The default port 443 is left out, and the path
  is percent-encoded outside the unreserved characters and `/`. The URL
  never carries user information, so a template address with a user name
  is asked for as the same repository without it: a user name does not opt
  out of the App, and the fetch sends the route's credential instead of
  it. Toha refuses a Git URL that holds a password before contacting the
  host or asking the credential route. The route's own rule, which refuses
  a URL with user information,
  applies to its direct callers. A 200 is the
  fetch's credential. A 404 leaves the challenge to Toha's default
  behaviour. A 502 fails the fetch with the prefix
  `GitHub App credentials are unavailable: ` and the route's reason, when
  that reason is one line of at most 200 bytes, and with
  `the token could not be minted` otherwise. Any other
  status, a malformed answer or an unreachable socket fails the fetch with
  a fixed reason of this service, after the same prefix. A failed fetch is
  a template refusal such as `template-resolve-failed`, whose message is
  that reason where the flow reports Toha's message.


  The request's resolver keeps every credential it handed out. When a
  request fails after the resolver handed out at least one credential, its
  refusal carries no text from Toha, gix or the remote, which can hold the
  credential in forms no redaction can list: the `message` is a fixed
  sentence for the `kind`, and `warnings` are dropped. `paths`,
  `locations` and `questions` stay. The sentences:
  `template-resolve-failed`, "the template could not be fetched; the Git
  host refused or failed the request"; `template-not-found`, "the template
  was not found on the Git host"; `template-stale-revision`, "the
  template's approved revision is stale"; `template-ambiguous`, "the
  template's name is ambiguous"; `template-refresh-failed`, "the
  template's catalog entry could not be updated from the Git host";
  `template-cache-conflict`, "Toha's cache entry for the template does not
  hold the recorded commit from its source"; `update-refused`, "the upgrade
  could not read the template from the Git host"; `merge-base-failed`, "the
  workspace's recorded template revision could not be fetched from the Git
  host"; `merge-failed`, "the upgrade could not be merged"; `apply-failed`,
  "the template could not be applied; the workspace repository or its
  remote could not be read"; any other kind, "the template operation failed
  after GitHub App credentials were supplied". A request that handed out no
  credential keeps its full message, the route's reason or this service's
  own credential reason included. As a second defence, every reply of a
  route, successes included, passes one boundary that replaces each
  written form of the handed-out credentials with `<redacted>`: the
  password; the `username:password` pair and the password in base64 and
  base64url, padded and unpadded; and each of those Rust-escaped,
  JSON-escaped and as a decimal byte list. Matches may overlap; every byte
  a match covers is removed, and each run of covered bytes becomes one
  `<redacted>`. The service writes no log line for a request.


  When the workspace service's request ends before its reply, because the
  job was cancelled or reached its time limit, the request fires Toha's
  stop signal synchronously. Every route's whole operation runs inside
  `toha::stop::with_stop_signal`, including `Template::load` in create
  start, session resume and upgrade preparation. Its template fetch,
  schema load, apply or update returns, the request worker returns, and it
  writes no further file. Credential requests end with it: one in flight
  loses its connection and no later one is sent. A stopped operation is
  `request-ended`, including a template load with `LoadError.stopped` set.

  gix cannot interrupt a transfer that waits for a remote, so the transfer
  a stop abandons keeps running, without blocking the caller, until the
  remote acts. Over HTTP(S) it keeps its Toha thread, gix's curl thread and the
  connection until the remote answers or closes the connection, or Git's
  `http.lowSpeedLimit` and `http.lowSpeedTime` end the transfer. Over SSH
  and `file://` it keeps its Toha thread and the `ssh` or `git-upload-pack`
  process until that process answers or exits. The transfer then ends: it
  writes nothing more and removes its temporary folder
  ([Toha #78](https://github.com/wyrd-company/toha/issues/78)).

  A document schema fetch's stop aborts it and closes its connection within
  a fraction of a second (Toha checks the signal at least every 100 ms),
  also while the schema endpoint sends nothing. One part of it can't be
  interrupted: a name lookup still pending at the stop, either the schema
  host's or the target's that curl looks up itself behind a `socks4://` or
  `socks5://` proxy. The fetch still returns within 2 s, but the threads
  that wait on the lookup run on. Those are curl's resolver threads,
  detached instead of joined, and, behind such a proxy, one
  `toha-schema-release` thread that finishes releasing curl's handles and
  is waited for at most 250 ms. They hold no connection and end by
  themselves when the system resolver returns
  ([Toha #81](https://github.com/wyrd-company/toha/issues/81)). With a
  libcurl that supports neither curl's transfer nor its multi-handle
  quick-exit option, the stop waits for the lookup instead.

  Neither limit holds a job, request worker or workspace in Menagerie's
  image, which builds curl with quick-exit support.

  Apply replies. Generate and apply answer 200 with `{"outcome","files",
  "recordPath","messages","hooks","conflicts"}`. `outcome` is `written`,
  `conflicted`, `already-current`, `needs-trust` or `planned`; only
  `written` and `conflicted` wrote files and the applied record at
  `recordPath`. `conflicted` is a written merge whose `conflicts` lists the
  paths written with conflict markers. `files` lists `{path, action}`;
  `hooks` lists `{id, exitCode, success}` for each hook that ran. Hook output
  is not returned: the workspace service's job console shows what a hook
  does not capture.


  Errors. A refusal answers `{"error":{"kind","message"}}`, adding `paths`
  for refused files, `locations` and `questions` for refused request values,
  and `warnings`. Generate and apply build every refusal Toha causes from a
  message this service chose for the error's variant: no message, path or
  warning carries a value Toha rendered, since a hook's captured output can
  reach any value rendered after that hook ran. Their `paths` stay only on
  `target-conflict` and `target-drift`, which are found from the plan
  before any hook runs. Request and session: `malformed-request` (400),
  `malformed-session` (400), `session-tampered` (400),
  `malformed-submission` (400),
  `submission-template-mismatch` (400), `number-not-representable` (400),
  `nesting-too-deep` (400),
  `invalid-address` (400), `invalid-credential` (400), `invalid-workspace` (400), `target-mismatch`
  (400), `workspace-not-found` (404), `not-found` (404),
  `method-not-allowed` (405), `target-outside-root` (409),
  `session-mismatch` (409). Interview state: `interview-complete` (409),
  `interview-ended` (409), `interview-not-complete` (409). Workspace state:
  `workspace-exists` (409), `target-not-new` (409), `not-git` (409),
  `dirty-target` (409), `stale-application` (409), `target-conflict` (409),
  `target-drift` (409), `target-symlink` (409), `target-occupied` (409),
  `target-changed` (409), `request-ended` (409), which has no reader
  because its caller went away. Toha refusals: `template-not-found` (422),
  `template-stale-revision` (422), `template-ambiguous` (422),
  `template-resolve-failed` (422), `template-refresh-failed` (422),
  `template-cache-conflict` (409),
  `template-invalid` (422), `unsafe-template-link` (422),
  `missing-requirements` (422), `document-invalid` (422), `parts-invalid`
  (422), `context-invalid` (422), `environment-refused` (422),
  `evaluation-failed` (422), `plan-failed` (422), `record-invalid` (422),
  `project-invalid` (422), `merge-base-failed` (422), `update-refused`
  (422), `merge-failed` (422), `operation-refused` (422), `apply-failed`
  (422), `hook-failed` (422). Faults: `io-failed` (500), `hook-io-failed`
  (500), `record-failed` (500), `record-not-written` (500),
  `workspace-root-unavailable` (500), `internal-error` (500).


  Nesting. A request nested deeper than 127 levels, the most serde_json
  reads into a value, is refused as `nesting-too-deep` before it is parsed.


  Numbers. Toha holds JSON numbers as 64-bit integers or floating-point
  values. A request number whose value that changes is refused as
  `number-not-representable`, naming each by its JSON Pointer in
  `locations` and its answer's question id in `questions`. Every 64-bit
  signed and unsigned integer and every number whose shortest
  floating-point form has the same decimal value is accepted; its text can
  change (`1e2` returns as `100.0`, `1.50` as `1.5`). A session the service
  produced returns byte for byte. A document input file is read by Toha
  itself when an upgrade starts, so a number in it that Toha's
  representation changes is changed, not refused.
validation-criteria: >-
  `cargo test --locked` in `template-service/` runs the service against
  Toha's library on a Unix socket: `tests/create.rs` covers create, rejected
  answers, generation into an initialized repository, revision pinning and
  flow ends; `tests/hooks.rs` covers hook folders, hook and I/O failures,
  and hooks without a granted token, against a hook runner that runs each
  hook as a local process; the unit tests in `src/hooks.rs` cover the hook
  runner request, captured streams, exit codes, refusals and malformed
  replies, none of which puts a stream or a reply's text in an error; the
  unit tests in `src/error.rs` drive a captured value through every apply
  error that can carry one, alone and wrapped as generate and apply
  return it, and find it in no refusal; the unit tests in
  `src/credentials.rs` cover the credential request's URL and every answer
  of the route, and find a granted token in no refusal or `Debug` output;
  `tests/credentials.rs` fetches a private template over TLS with the
  route's token through create and generate, also from an address with a
  user name, leaves the challenge to Toha on a 404, fails with the route's
  reason on a 502, runs two creates at once that each fetch with their own
  repository's token, replies with only the fixed sentence when a remote
  echoes the credential, also as overlapping copies, keeps Toha's message
  when no credential was handed out, and ends the credential request and its worker of
  each caller that goes away, without leaving a thread, and writes nothing
  to the folder when a generate's or an apply's fetch returns after its
  caller went away. With a single blocking worker, it also proves that
  stalled interview, generate and apply fetches return the request worker
  within 2 s while the Git host still holds the connection, and that all
  six routes return that worker and close a stalled HTTPS schema
  connection within 2 s. The request-worker test in `src/server.rs`
  cancels between Toha's first and second file writes and observes no
  second file; `go test -tags
  templateservice ./backend/internal/workflows/` ends the credential
  request of a create whose job reaches its time limit and times out two
  creates of the same workspace during a stalled HTTPS schema load,
  observing that each job ends and its schema connection closes;
  `tests/numbers.rs` covers number values through the session and the
  applied record; `tests/revisions.rs` covers admitted revisions for
  fixed and moving refs, installed branches and tags, and refuses a folder
  address even when it is installed;
  `tests/offline.rs` resumes every route offline after a restart; `tests/upgrade.rs` covers an
  upgrade between two template versions that asks only the new question and
  keeps local edits, a re-answered upgrade that asks every question with
  the recorded answers as defaults, a create and a re-answered upgrade of
  two batches whose second is accepted as shown, `{}`, rejected recorded answers, fresh and kept documents,
  stale and dirty workspaces, conflicts and the document-file number limit;
  `tests/requests.rs` covers every request check, refuses a template id, a
  missing ref and a short commit, refuses each form admission refuses on
  every route that names a template without quoting it, refuses a session
  with any record member altered, without its signature, signed with
  another key, or replayed into another workspace, address, ref or flow,
  while the untouched session completes and generates, and refuses as stale
  a ref that resolves to another commit than the request names at a create
  start, an answer, a generate, an upgrade start whose tag moved, and an
  upgrade's answer and apply; `tests/templates.rs`
  reads addresses without reaching the network, refuses each form admission
  refuses on the address and versions routes without quoting it, lists a
  served repository's release, pre-release, `v`-prefixed and annotated tags
  in order, and tells a repository with no tag from a missing one; the unit
  tests in `src/address.rs` and `src/versions.rs` cover each address form
  and refusal and the version rules, and those in `src/links.rs` each
  link and folder that leaves a checkout and those that stay in it;
  `tests/templates.rs` also checks a version with and without the
  definition, running no hook, answers `descends` true for the version's
  commit and its ancestors and false for a commit off the tag's history, a
  later commit and a missing one, refuses a malformed `since`, refuses a manifest Toha cannot load, a
  missing folder, an address with a ref, and a folder, a link in the
  content folder and a link beside it that leave the checkout, and refuses
  a generate and an upgrade apply whose template holds such a link, with
  nothing written; `tests/credentials.rs` also lists a
  private repository's versions with the route's token, refuses the listing
  without one, and returns the worker of a stalled listing whose caller
  leaves; `tests/restart.rs` runs
  the binary across a restart; `tests/limits.rs` sends the binary a request
  nested far deeper than any value; `tests/contract.rs` checks that this
  specification names every route and error kind the service uses.
