$schema: https://refinery.systems/ontology/decision-record
relationships:
  contextualizes:
    - menagerie
    - template-service-api
  related-to:
    - browser-session-value-tampering
    - menagerie-has-host-root
description: >-
  The template service fetches only templates a manager approved. In
  earlier releases approval was a list in the configuration file, which the
  template service read itself, refusing any template id it did not hold.
  Approval is registration in Menagerie's data, which only the workspace
  service opens (keep-menagerie-data-in-sqlite), and registering a template
  means fetching it before it is approved, to check it. Both services run as one
  user, the template service's socket is in a folder only that user opens,
  and that user also holds the Docker socket. A browser holds interview
  sessions, so a browser value must never choose what is fetched. Any
  manager, not only the host's administrator, names template addresses, and
  a version a manager approved is a tag, which its repository can move.
considered-options:
  "1": >-
    The workspace service admits each address before it names it: a
    registered template's address with a found version's tag, held by the
    job or check, or the address a manager submitted to register or upgrade
    a template, for that request alone. The template service holds no list;
    on every route it refuses any address that is not a remote Git address
    of the documented forms, refuses a template folder with a link that
    leaves its checkout, and refuses a tag that resolves to another commit
    than the checked one; a session's signature covers the address and the
    tag.
  "2": >-
    The template service opens Menagerie's database read-only and checks
    each address against the registered templates, as it checked the
    configuration list.
  "3": >-
    The workspace service writes an admission file of registered addresses
    that the template service reads for each request, with pending entries
    for a registration's checks.
  "4": >-
    The workspace service signs each admitted address with a key the two
    services share, and the template service verifies the signature.
decision-outcome:
  chosen-option: 1
  justification: >-
    Options 2, 3 and 4 each put the template service's check behind
    something the services' user can write or read: the database, the file
    or the key. A caller that can reach the template service's socket is
    that user, so it passes each of them. The checks that hold are where the
    callers differ. Only an authenticated, same-origin manager request names
    a new address. Browser values never reach an interview's address, which
    the job holds. The template service refuses addresses that would read
    Menagerie's own files, such as its session key, as a template; a
    registration through the interface would otherwise reach them, which
    the configuration list never offered a manager. Option 2 also ties the
    Rust service to the Go service's schema, and option 3 adds a second
    store that must agree with the first.
expected-outcomes:
  positive:
    - No browser value and no unauthenticated request chooses a template the template service fetches.
    - No address, from any caller, makes the template service read a local folder, a Toha registry entry or a `file://` repository as a template.
    - The template service keeps no copy of the registry to drift from Menagerie's data.
  negative:
    - The template service refuses no address by a list of its own; a process running as the services' user can make it fetch any remote Git address, as that user can already reach the Docker socket.
    - Every manager can register a template whose hooks run in throwaway containers, as every manager can already create a workspace with privileged containers (see menagerie-has-host-root).
    - A registration's check fetches an address before it is approved, so a manager's request can make Menagerie fetch from any host its network reaches.
    - Any manager can register, and so generate into a workspace, any repository the GitHub App's installations or the Git key can read, private ones included.
