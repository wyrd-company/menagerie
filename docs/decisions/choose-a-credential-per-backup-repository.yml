$schema: https://refinery.systems/ontology/decision-record
status: accepted
relationships:
  contextualizes:
    - menagerie
    - workspace-api
    - configuration
  related-to:
    - choose-a-backup-repository-per-workspace
    - keep-menagerie-data-in-sqlite
description: >-
  Each workspace backs up to a registered backup repository
  (choose-a-backup-repository-per-workspace), but every repository is
  reached with the one credential its URL selects: the configuration's one
  GitHub App for an https URL on its server, and every key Wyrwood's SSH
  agent offers for an SSH URL. Repositories in several GitHub organizations,
  each with an App of its own, cannot all be reached, because only one App
  can be configured (wyrd-company/menagerie#142). An SSH client offers every
  key the agent holds, and a Git host signs it in with the first key it
  knows, whether or not that key reaches the repository, so a second key in
  the agent never selects a second repository. Wyrwood names each key in the
  agent by its Transit key name, in the key's comment, and its
  `operator.SelectAgentKey` already selects one key by fingerprint, public
  key or name for provisioning.
considered-options:
  "1": >-
    Each registration records its credential in Menagerie's data: a GitHub
    App, by the name the configuration gives it, or an SSH key, by its
    public key. The configuration names any number of Apps. The keys are
    the ones Wyrwood's agent offers, listed from the agent, so the Wyrwood
    policy stays the one place that grants a key. A transfer offers only the
    registration's credential. A registration from an earlier release, which
    has none, keeps the earlier rule chosen by URL until a manager chooses
    one.
  "2": >-
    Named credentials in the configuration file, Apps and SSH keys alike,
    each SSH key by its public key, and a registration naming one.
  "3": >-
    A credential chosen by URL pattern in the configuration, such as an App
    for each GitHub owner and a key for each host.
decision-outcome:
  chosen-option: 1
  justification: >-
    An App needs its id and Transit key, which only the configuration can
    give, so Apps are named there. A key's public half is already in the
    agent, which can list it with its name, so naming keys in the
    configuration (option 2) would repeat the Wyrwood policy and drift from
    it. Recording the public key, not the name, is what `IdentitiesOnly`
    with an `IdentityFile` does in `ssh_config`: a key replaced under the
    same name fails as a key that is gone, which is right, since the Git
    host holds the old public key. Option 3 cannot give two repositories of
    one owner two credentials, and makes a rule edit change where a
    registered repository's backups authenticate without a check. Keeping
    the earlier rule for a registration that has no credential means an
    upgrade needs no step by hand.
expected-outcomes:
  positive:
    - Repositories in organizations with Apps of their own back up from one Menagerie.
    - A repository reached over SSH is offered only its own key, so a second key in the agent selects a second repository, and no Git host counts the others as failed attempts.
    - The public key to give the Git host is shown where the key is chosen.
    - Repositories registered by an earlier release keep backing up with no edit.
  negative:
    - An App renamed in the configuration, or a key the agent stops offering, fails every transfer of the registrations that name it until a manager changes their credential.
    - A registration from an earlier release keeps offering every key until a manager chooses one.
    - Template fetches keep the credential their URL selects; a template's own credential needs its own change, and over SSH a change in Toha.
