$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: menagerie-has-host-root
title: Menagerie has root on the host
description: >-
  Menagerie mounts the rootful Docker socket, so whoever controls Menagerie
  controls the host. This includes a manager and an attacker who gets past
  sign-in. This is the same access a manager has when running
  devcontainer-builder on the host. Mitigation: only members of the
  `menagerie_managers` group reach the UI; the UI is not exposed to the
  public internet; only templates on the approved template list are used;
  Menagerie stores no keys or tokens, and holds GitHub App installation
  tokens, each for one repository, only in memory until shortly before they
  expire; template hooks and `initializeCommand`
  run in throwaway containers that mount only their workspace folder, so
  they reach neither the Docker socket nor the Wyrwood sockets nor
  Menagerie's environment. They still reach the network, and a hook can
  still change its workspace's definition, which its devcontainer then
  gets as asked. The copy back of an upgrade hook's candidate checks the
  candidate by its path, so a process running as the services' user can
  redirect the swap by replacing a folder above the candidate in between;
  that user already holds the Docker socket, as it holds the hook runner
  socket, whose credential route hands out read tokens. A body-inspecting
  Docker proxy reduces this exposure further.
categories:
  - security
likelihood: 2
impact: 5
response-strategy: accept
status: accepted
