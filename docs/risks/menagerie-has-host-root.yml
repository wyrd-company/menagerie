slug: menagerie-has-host-root
title: Menagerie has root on the host
description: >-
  Menagerie drives the rootful Docker daemon, so whoever controls Menagerie,
  a manager or an attacker who gets past sign-in, holds what the daemon
  admits for it. Menagerie reaches the daemon only through the Sockguard
  Docker proxy, and never mounts the daemon's socket. The proxy's
  Menagerie profile denies privileged containers, the host network, PID
  and IPC namespaces, added capabilities and devices, restart policies,
  image push, save and load, and bind mounts outside the workspace root,
  the workspace socket folder and the Compose staging folder; a
  devcontainer binds only its own workspace's folders. Each request names
  its workspace in a header that Menagerie sets from its root and the
  workspace's name, and Menagerie refuses a definition that sets an
  identity label, so a definition cannot pass itself off as another
  workspace. What remains: the operator's exceptions file grants a named
  workspace more, and that grant then reaches anyone who can change that
  workspace's definition; build steps pass the proxy uninspected
  (buildkit-traffic-not-inspectable); Menagerie may exec as root in the
  containers it created, and the profile's proxy-wide
  `insecure_allow_read_exfiltration` admits attach and archive reads of
  them, which throwaway containers need for their output and an upgrade
  candidate's copy back, so Menagerie can read their output and files;
  ownership keeps both to the containers the proxy marks as Menagerie's,
  and Menagerie is the proxy's only client; the profile's
  `container_archive.allow_escaping_links` admits symbolic links that point
  out of their folder in what Menagerie copies into a throwaway container,
  so a later entry of the copy can write through such a link into that
  container's own file system and its workspace bind, which the hook can
  already write; and the proxy
  ignores unknown configuration keys (proxy-ignores-unknown-config-keys).
  Mitigation besides the proxy: only members of the `menagerie_managers`
  group reach the UI; the UI is not exposed to the public internet; only
  templates on the approved template list are used; Menagerie stores no
  keys or tokens, and holds GitHub App installation tokens, each for one
  repository, only in memory until shortly before they expire; template
  hooks and `initializeCommand` run in throwaway containers that mount
  only their workspace folder, so they reach neither the proxy's socket
  nor the Wyrwood sockets nor Menagerie's environment, and the template
  service, which runs as the same user, lacks the proxy socket's group.
  Hooks still reach the network, and a hook can still change its
  workspace's definition, which its devcontainer then gets as far as the
  profile and its exceptions admit. The copy back of an upgrade hook's
  candidate checks the candidate by its path, so a process running as the
  services' user can redirect the swap by replacing a folder above the
  candidate in between; that user already reaches the proxy, as it holds
  the hook runner socket, whose credential route hands out read tokens.
categories:
  - security
likelihood: 2
impact: 4
response-strategy: mitigate
status: mitigated
