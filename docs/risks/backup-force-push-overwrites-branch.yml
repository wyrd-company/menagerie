$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: backup-force-push-overwrites-branch
title: A backup push overwrites commits pushed from elsewhere
description: >-
  The local workspace is the source of truth and Menagerie force-pushes its
  branch. Commits pushed to a workspace branch from anywhere else survive
  only when Apply branch brings them into the workspace before its next
  backup; otherwise that backup replaces them. Each apply-branch job
  backs the workspace up before it applies, so commits pushed to the
  workspace's own branch are kept only when that apply succeeds. A change
  to a workspace therefore arrives on another branch: a pull request whose
  base is the workspace branch, never merged on the forge. The manager
  applies the pull request's head branch; the backup after the apply
  pushes its commits to the workspace branch, and the forge marks the pull
  request merged.
categories:
  - operational
likelihood: 1
impact: 2
response-strategy: accept
status: accepted
