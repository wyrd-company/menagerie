$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: menagerie-approves-its-own-exceptions
title: A compromised Menagerie can grant itself host root
description: >-
  The workspace service writes the exception policy file that the Docker
  proxy reads. Whoever controls the workspace service can add an exception
  for any workspace and then create a privileged container with the
  rootful daemon, which is root on the host. Mitigation: only members of the
  `menagerie_managers` group reach the UI; the template service and command
  containers have no access to the policy file; exceptions are keyed by
  workspace path, so a create request outside the workspace root still has
  no exception. Moving approval behind the proxy's own authenticated
  endpoint removes the risk without changing the policy file format.
categories:
  - security
likelihood: 2
impact: 5
response-strategy: accept
status: accepted
