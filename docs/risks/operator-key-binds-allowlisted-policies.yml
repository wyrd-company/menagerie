$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: operator-key-binds-allowlisted-policies
title: Menagerie's operator key can bind allowlisted policies to any container
description: >-
  Whoever controls Menagerie can sign with its operator key, and through it
  can bind an allowlisted policy, with any per-binding value, to any container
  name on the agent the grant names. This includes reading another of this
  host's workspaces' Xolotl keys by binding the shared policy with that
  workspace's value. The scoped Xolotl key can issue and revoke keys in its key
  policy, so it can also stop gateway access for any of this host's workspaces.
  A declaration in a definition that
  a devcontainer can edit asks for the same things at the next rebuild.
  Mitigation: the grant allows only the agent of Menagerie's own host, an
  allowlist of policies, and bind, unbind and read, with no policy write; the
  Xolotl key policy is used only on this host, fixed in the shared policy's path
  and the only one the scoped key lists; so the two keys reach nothing beyond
  what root on this host already reaches through its consumer directories. This
  holds only while a host's preparation keeps that key policy to itself. A
  binding that holds a policy outside the allowlist
  is outside the grant; the private key stays in OpenBao; an operator revokes
  the grant in the Wyrwood web interface; each action is audited under the key's
  label. The grant has no default expiry, so that provisioning does not stop in
  silence, and a stolen signature path works until someone revokes it.
categories:
  - security
likelihood: 2
impact: 4
response-strategy: accept
status: accepted
