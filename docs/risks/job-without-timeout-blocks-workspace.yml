$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: job-without-timeout-blocks-workspace
title: A hung job blocks its workspace until Menagerie restarts
description: >-
  A workspace runs one job at a time. A build, template fetch, hook or
  `initializeCommand` that never finishes keeps the workspace busy, and
  nobody is told. Mitigation: configured time limits cancel a job past its
  limit and fail it as timed-out, and an alert webhook hears of every failed
  job and of jobs that run past a threshold. Limits and alerts are opt-in:
  without `job-limits` a job has no limit. A cancelled job keeps its slot
  until its work returns, so work that ignores cancellation still holds the
  workspace until Menagerie restarts, which drops in-memory jobs. A
  cancelled generate or apply kills and removes its running hook containers
  before the job ends, so no hook writes to the folder afterwards. The
  template service itself does not stop a template fetch, or the files
  Toha writes before its next hook, when Menagerie cancels its request.
categories:
  - operational
likelihood: 2
impact: 2
response-strategy: mitigate
status: mitigated
