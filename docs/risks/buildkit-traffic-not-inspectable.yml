$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: buildkit-traffic-not-inspectable
title: Image builds bypass body inspection
description: >-
  devcontainer-builder builds images through BuildKit over upgraded `/grpc`
  and `/session` connections. The proxy sees only the initial request and the
  gRPC methods, not every build option. A build that requests insecure
  entitlements or host networking can run build steps with host privileges.
  Mitigation: the daemon keeps BuildKit entitlements such as
  `security.insecure` and `network.host` disabled; the proxy denies unknown
  gRPC methods.
categories:
  - security
likelihood: 2
impact: 5
response-strategy: mitigate
status: open
