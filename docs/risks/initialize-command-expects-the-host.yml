$schema: https://refinery.systems/ontology/risk
relationships:
  mitigated-by:
    - menagerie
slug: initialize-command-expects-the-host
title: An initializeCommand written for the host fails in a command container
description: >-
  The devcontainer specification runs `initializeCommand` on the host.
  Menagerie runs it in a command container, so a command that writes host
  files outside the workspace, reads host credentials or calls the Docker CLI
  fails or has no effect. Templates are approved and owned by the fleet's
  managers, who write `initializeCommand` for the command container.
categories:
  - technical
likelihood: 3
impact: 2
response-strategy: accept
status: open
