name: menagerie
tagline: Manage workspaces and fleets of development containers through a web UI.
blurb: >-
  One container that creates workspaces from Toha templates through their
  interviews, shows every workspace with its devcontainer, starts, stops,
  rebuilds and upgrades them, and backs each one up to its own Git branch.
  Managers sign in through OpenID Connect; Wyrwood supplies its SSH key and
  registry credentials.
category: Developer Tools
language: Go
status: preview
repo: https://github.com/wyrd-company/menagerie
order: 10
install:
  - label: Container image
    command: docker pull ghcr.io/wyrd-company/menagerie:0.1.0
assets:
  - assets/demo.gif
  - assets/list.png
  - assets/create-interview.png
  - assets/upgrade-interview.png
