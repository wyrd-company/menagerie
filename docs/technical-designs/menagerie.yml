$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - keep-menagerie-data-in-sqlite
    - list-template-versions-in-the-template-service
    - admit-templates-through-the-workspace-service
    - apply-workspace-policies-from-a-stored-selection
    - name-workspace-provisioning-after-the-workspace
    - let-menagerie-decide-each-binding
    - issue-a-key-to-every-provisioned-workspace
    - choose-a-backup-repository-per-workspace
    - choose-a-credential-per-backup-repository
  mitigates:
    - menagerie-data-loss
objective: >-
  Let a small group of trusted managers create, list, start, stop, rebuild,
  upgrade and delete the workspaces of one shared fleet from a web UI, with
  the credentials each workspace needs on its first start, register the
  templates workspaces come from, roll workspaces forward to new template
  versions, and choose each workspace's Wyrwood policies, so that no one
  manages workspaces by hand on the host.
background:
  problems:
    - Creating a workspace means running a Toha interview and a devcontainer
      build by hand on the host.
    - Template upgrades and rebuilds are manual and easy to skip.
    - There is no single view of which workspaces exist and which are running.
    - A workspace that uses Wyrwood and Xolotl needs a client key, a binding
      and a consumer directory before its first start, and these take manual
      steps on several systems.
    - A template that has a problem is fixed by rolling forward to a new
      version, so taking a version and applying it to workspaces has to need
      no configuration change and no restart.
    - The template a workspace has and the Wyrwood policies it is granted are
      separate concerns, and one workspace needs policies that others of its
      template do not.
design-challenges:
  two-languages: >-
    Toha is a Rust crate and devcontainer-builder is a Go package. Both must be
    used as libraries, without spawning a CLI.
  host-paths: >-
    Menagerie runs in a container but tells the host Docker daemon what to
    bind-mount. The daemon resolves bind sources on the host.
  docker-is-root: >-
    The daemon is rootful, so access to it is root on the host. Menagerie has
    the same access a manager running devcontainer-builder on the host has,
    and it is reachable through a web UI.
  interview-across-requests: >-
    A Toha interview spans many HTTP requests. Toha's pending interview borrows
    its template and cannot be held between requests.
  template-hooks: >-
    Toha template hooks and a workspace's `initializeCommand` run commands the
    template author wrote. devcontainer-builder runs no commands on the host.
    A command run inside the Menagerie container would reach the Docker
    socket, the Wyrwood sockets and Menagerie's environment, and
    `initializeCommand` comes from a definition the workspace's own
    devcontainer may be able to edit.
  git-credentials: >-
    Menagerie backs up each workspace to a Git repository, on GitHub or
    another host, and a host's workspaces can belong to several
    organizations, each with a repository of its own. No credential may be
    stored in the Menagerie container.
  workspace-commits: >-
    Changes made inside a devcontainer, such as scripts an agent adds to a
    writable folder of the workspace, must be committed and backed up
    between upgrades. The devcontainer must be able to ask for that without
    a credential and without a way to name another workspace or to reach
    Menagerie's API.
  first-start-credentials: >-
    A devcontainer's image can run services as soon as it starts, before any
    lifecycle command, and these services need their sockets. A bind mount's
    source must exist even for `docker create`, and Wyrwood delivers sockets
    only for a container it has observed. So the binding comes before the
    container and the container exists before its first start. SQLite,
    OpenBao, Xolotl, Git and Docker share no transaction, so a job that stops
    between two steps leaves earlier steps done.
  operator-authority: >-
    Provisioning needs authority over Wyrwood bindings and Xolotl client keys,
    and Menagerie is reachable through a web UI. Policy write together with
    bind can give any secret to a container Menagerie controls, which reaches
    further than root on one host. No key or token may be stored in the
    Menagerie container.
  long-running-operations: >-
    Builds and rebuilds take minutes. The UI must show progress and must not
    start two operations on one workspace.
  backup-repositories: >-
    Each workspace backs up to one registered backup repository, which its
    data records; the decision choose-a-backup-repository-per-workspace
    explains why. A manager registers a repository with a display name, one
    line of 1 to 100 characters, and a Git URL: `ssh://`, scp-like
    `git@host:path` or `https://`, with no password and no surrounding
    space. A local path, a `file://` URL and plain `http` are refused, so a
    registration never writes into Menagerie's own filesystem. Each
    registration names its credential, which every transfer of the
    repository uses alone (see repository-credentials). Registration runs
    three checks in this order and refuses the repository at the first that
    fails, naming it: `url`, the URL has one of those forms; `credential`,
    the credential fits the URL; `write`, Menagerie pushes a ref
    `refs/menagerie/write-check-<random>` holding one empty commit made in
    memory, with that credential, and deletes it, within one minute.
    The ref is not a branch, an empty repository stays empty, and no
    workspace is read. A failed deletion fails the check and names the ref.
    The check proves the credentials may write to the repository, not that
    its branch rules let them create and force-update a workspace's branch;
    a rule that refuses either fails the backup it meets as
    `backup-failed`, a workspace's first or a later one.
    A URL that is registered already is refused, naming that registration.
    The `id` is permanent: the lower-case letters and digits of the name,
    separated by single dashes, or `backups` when the name has none, with
    `-2`, `-3` and on added while it is taken. A removed repository keeps
    its row, marked removed, so its id never names another repository and a
    request that still names it is refused, a create's in the transaction
    that would record it. A URL in a reply or on a page has no password,
    query or fragment, and an `https` URL no user name, where a token can
    stand too: a registration refuses a password,
    and the import keeps the configured URL whole for its backups. A registration can be asked
    to check without storing, as a template's can, and a save runs every
    check again. A create names a registered repository, or, when it names
    none and exactly one is registered, takes that one; with none or several
    registered it is refused. The create's workspace records the repository
    from the create's start, so it cannot be removed while the create's
    interview waits. Every backup, commit and Apply branch fetch of a
    workspace resolves its repository from the data when it runs. A
    workspace with none, such as a folder copied into the workspace root
    after the first start, fails each backup as `backup-failed` and fails
    an Apply branch as `fetch-failed`, and the job's console says that it
    has no backup repository. A backup repository that a workspace backs
    up to cannot be removed, and the refusal names those workspaces;
    removing one forgets it and leaves the repository and its branches as
    they are. A `move-backup` job moves a workspace's backups to another
    registered repository, or gives a workspace with none its first. Its
    `verify` phase refuses a workspace whose create has not finished, runs
    the destination's write check and reads the destination's branch of the
    workspace's name; a branch whose commit is neither the workspace
    branch's commit nor one of its ancestors fails the job as
    `backup-branch-conflict`, before anything is committed or pushed, and
    one that is, which an earlier move that failed after its push leaves,
    is taken over. `commit` commits every change, as the commit operation
    does, and `backup` pushes the branch to the destination without force,
    so the destination takes it only while its branch is still absent or in
    the workspace's history, and a branch another writer made after the
    check is never overwritten; it then reads the destination's branch
    back. Only when it is at the commit pushed does `switch` record the
    destination, in one transaction that requires the repository's id to be
    registered still at the URL the job checked. The record is the job's
    final step (`Run.Final` in the jobs package): it settles the job's time
    limits first, so a move past its limit times out and records nothing.
    The limits keep counting while the record runs: when a limit's timer
    runs, which can be after the limit passed, it cancels the job's
    context, and a record that the cancellation interrupts, for example
    while it waits for the database connection, records nothing and the
    move times out. A record that commits decides the outcome, even past a
    limit whose timer has not run, so a recorded switch is never reported
    as a timeout. Every other failure is `backup-move-failed`, the workspace keeps its repository, and the
    message says so. The move never writes to the earlier repository, whose
    branch keeps the workspace's earlier backups for recovery. The job
    holds the workspace's job slot, so no commit or backup of the workspace
    runs between its push and the switch.
  template-versions: >-
    A template's versions are the tags of a remote repository, reached over
    SSH through the Wyrwood agent, over `https` with a GitHub App token, or
    anonymously. Toha owns the address grammar and the fetch, and its library
    lists no tags and orders no versions.
  policy-authority: >-
    Menagerie decides each workspace's policies, and Wyrwood holds the
    binding. Wyrwood's web interface can edit the same binding, the operator
    key's grant can change between two requests, and a binding that holds a
    policy outside the grant is invisible to the key.
  owned-data: >-
    What Menagerie made for a workspace must outlive the workspace's
    definition, which a person or the workspace's own devcontainer can edit.
    Jobs, the API and schedules read and change the same templates,
    selections and records at once.
  existing-hosts: >-
    A host that runs an earlier release keeps its templates in configuration,
    each workspace's policies, values and Xolotl key in its rendered
    definition, and its retirement records in files. Its first start takes
    them over with no step by hand and without changing the access of a
    running workspace.
proposed-design:
  high-level-overview: >-
    One container image runs two services under a process supervisor. The
    workspace service is written in Go. It serves the web UI, authenticates
    users through OIDC, discovers workspaces, drives Docker through
    devcontainer-builder, and owns git. The template service is written in
    Rust. It embeds Toha and serves template interviews, generation and
    upgrades to the workspace service over an internal API. Template hooks
    and `initializeCommand` run in throwaway containers that the workspace
    service starts. The container mounts the host Docker socket. Git access
    goes through Wyrwood: its SSH-agent socket, or GitHub App installation
    tokens signed through its vault socket. The workspace root is mounted at
    the same path on the host and in the container. A workspace whose
    definition has a provisioning declaration also gets a Xolotl client key
    and a Wyrwood binding with the policies Menagerie selects for it, through
    Wyrwood's public Go package and Xolotl's HTTP API, and its container
    exists before its first start. The workspace service keeps its own data
    in a SQLite database in Menagerie's data volume: the registered templates
    and their versions, each workspace's template, applied version and policy
    selection, the policy settings, and every binding and Xolotl key it
    provisioned.
  terms: >-
    A workspace is a folder under the workspace root, generated from a Toha
    template, together with the devcontainer it defines. Every folder directly
    under the workspace root is a workspace, unless its name starts with a dot:
    such a folder belongs to the host. Its git repository tracks only
    the files the template generated; repositories cloned inside the workspace
    are ignored by the template's `.gitignore`.
  screens: >-
    The UI has six screens. The workspace list shows every workspace with
    its status (running, stopped, no container, no folder, or the operation
    in progress), its template and the version last applied to it, the
    backup repository it backs up to, whether
    it needs an upgrade, which policy groups need a choice, and whether its
    binding has its selection, and offers start, stop, rebuild, apply branch,
    upgrade, policies, move backups and delete. Move backups takes another
    registered backup repository in the row. Apply branch takes a branch name in the
    row. Delete asks the manager to type the workspace's name and says that
    ignored files are not backed up. Policies opens a panel in the row with
    the workspace's required policies, its choice in each policy group and
    its other policies, where a manager adds and removes them. The create screen selects a
    registered template and a registered backup repository, the only one
    preselected, names the workspace, takes a choice in each policy
    group and any other policies, and runs the interview. The upgrade screen
    runs the interview for the current version of the workspace's template,
    asking only what the recorded answers do not cover, or, when the manager
    asks, every question with the recorded answers as defaults. The templates
    screen lists the registered templates with their current and newest
    versions and the time and outcome of the last version check, registers a
    template from its address, checks a template for new versions, upgrades
    a template to a newer version and removes a template that no workspace
    uses. Registering a template and upgrading one each validate, then
    save: Validate runs the checks without storing, Save stays disabled
    until a Validate of the form's current values passes, which the form
    shows as `Checks passed` with the version, and any edit disables Save
    again and clears that result and any refusal; Save checks again. The
    backup repositories screen lists the registered backup repositories
    with the workspaces that back up to each, registers one the same way,
    validate then save, with `Checks passed` naming its id, and removes one
    that no workspace backs up to. The policies screen lists the policies inside the operator key's
    grant and those the settings name outside it, marks policies required,
    and creates, edits and removes policy groups.
  workspace-discovery: >-
    The list is built from the workspace folders under the workspace root.
    Each folder is joined to the container whose `devcontainer.local_folder` label equals
    the folder path. Containers without such a label, or whose label points
    outside the workspace root, are never shown. Each folder is also joined
    to its workspace in Menagerie's data. A folder that has none gets one
    when it is first listed: joined to the registered template whose source
    its applied record names, with the applied version template-versions
    gives it, no container name, no key, and a selection of the required
    policies. A workspace in the data whose folder is gone and that still
    holds a container name or a Xolotl key is listed as `no-folder`, so a
    delete can remove what it holds. A workspace whose folder is gone, that
    holds neither and that no create is making is removed from the data; a
    create's own workspace is kept (see create-flow).
  menagerie-data: >-
    The workspace service keeps its own data in one SQLite database,
    `/var/lib/menagerie/state/menagerie.db`, through a Go library that needs
    no cgo. The `state` folder is private to the services' user, and only
    the workspace service opens the database: the template service,
    devcontainers and throwaway containers never reach it. Every change is
    one transaction and foreign keys are enforced, so a constraint, not a
    scan of files, keeps these rules: a template has one registration per
    source, a template that a workspace uses cannot be removed, a backup
    repository has one registration per URL, a backup repository that a
    workspace backs up to cannot be removed, and a
    container name or a Xolotl key belongs to one workspace at a time. The
    schema's version is the database's `user_version`; a start upgrades an
    older schema in one transaction before it serves, and refuses a newer
    one. The data holds the registered templates (see template-registry and
    template-versions); the registered backup repositories (see
    backup-repositories); the workspaces, keyed by folder name, each with
    whether a create is making it, its template, its backup repository, the
    version and commit last
    applied, its Xolotl key, its per-binding values, its policy selection
    and that selection's revision, the revision last applied to its binding
    and the reason the last apply failed, whether its selection is still to
    be imported, and the folder a delete began to remove; the container
    names Menagerie bound, each with its workspace, the agent it was bound
    on, whether it is the workspace's current one and the ID Wyrwood gave
    its binding; the Xolotl
    keys it issued, each with its workspace; and the policy settings with
    their revision (see workspace-policies). A delete removes the
    workspace's data with its folder. See the decision
    keep-menagerie-data-in-sqlite.
  internal-api: >-
    The template service listens on a Unix socket shared only with the
    workspace service and speaks JSON over HTTP. It exposes: read a template
    address, list a template's versions, check a template version, start an
    interview for a template, answer an interview, generate a workspace from
    a completed interview, start an upgrade for a workspace, answer an
    upgrade, and apply an upgrade. The workspace service names the template
    of each request by its address with a version's tag, so the template
    service holds no list of templates. The template service is stateless
    between requests.
  template-service-routes: >-
    Every template route names a template by `address`, a Toha address
    without a ref, and, where it reads a version, by `ref`, the version's
    tag, and `commit`, the commit Menagerie recorded for it; the template
    service builds the address of the ref with Toha's address type. Reading
    an address, `POST /v1/templates/addresses` with `{"address"}`, parses it
    with Toha's grammar and reaches no network: it answers the `source`, the
    formal name Toha gives the repository and folder without a ref, the
    `reference` the address names, or null, and the `base`, the address as
    given with its ref removed. Listing versions, `POST
    /v1/templates/versions` with `{"address"}`, answers the `source` and the
    `versions`, each `{"version","tag","commit"}`, in ascending order.
    Checking a version, `POST /v1/templates/checks` with
    `{"address","ref"}`, has Toha resolve and fetch that ref into its cache
    and load the template's manifest, and answers the `source`, the `commit`
    and `definition`, whether the template's content folder, from which
    Toha renders a workspace's files, holds
    `.devcontainer/devcontainer.json`. With `"since"`, a commit, it also
    answers `descends`, whether the fetched commit descends from that one in
    the repository's history. A check runs no hook and no other command of
    the template. Their refusals are Toha's, such as
    `template-not-found`, `template-resolve-failed` and `template-invalid`,
    under the rules every route's refusals follow, and the template
    service's own `invalid-address` and `unsafe-template-link`. Each runs
    inside the request's credential resolver scope (see github-app). The
    interview, generate and upgrade routes take `"address"`, `"ref"` and,
    when Menagerie recorded one, `"commit"` in place of a template id; a ref
    that resolves to another commit than the one named is refused as
    `template-stale-revision`, so a moved tag never brings in content no
    check saw. A session's signature covers the
    address and the ref in place of the id, so a session cannot be replayed
    into another template or version.
  template-admission: >-
    The template service fetches only templates a manager approved, and the
    approval is the registration in Menagerie's data. The template service
    holds no list: the workspace service admits each address before it names
    it, and the template service refuses every address it must never read.
    The workspace service names, on the interview, generate and upgrade
    routes, to a version check and to a template's upgrade, only a
    registered template's address with the tag and commit of one of its
    found versions, which the job or the request holds server-side; and, on
    the address, versions and check routes, the address a manager submitted
    to register or check a template, for that request alone; and, on the address
    route alone, each address of the `templates` configuration that
    first-start-import reads, which the operator wrote. Registration is a
    manager's request through the API, behind a session and the same-origin
    check, so no other caller names an address, and no browser value
    reaches an interview route's address. The template service accepts on
    every route only a remote Git address of the forms the user
    documentation lists: `gh:` with an owner and a repository,
    `git@host:path`, `ssh://` and `https://`. It refuses as
    `invalid-address` a local folder, a name from Toha's registry, every
    other transport, `file://`, `git://` and `http://` included, a host or
    user that starts with `-`, user information that holds a password, such
    as `https://user:token@host/repo`, an address that does not read one way,
    and, on the versions route, an address with a ref. A password that holds
    a `/` reads as a host, a port, a path and a ref, so an address reads one
    way only when: in an `https://` or `ssh://` address, the text after
    `://` holds no `:` before an `@`, checked on the text before any parser
    reads it, which refuses a password and also a port followed by a ref;
    the parts gix and Toha read, each in a strict character set, write back
    to the address exactly; and a ref that holds a `.` or follows
    `git@host:path` is a version's tag. User information with no `:` is a
    user name, not a password. A route that names the version beside the
    address admits the address without its ref, checks that ref by itself,
    and requires Toha's reading of the address at that ref to name the same
    repository and folder at exactly that ref, so a port and a version
    beside it are taken. An SSH address keeps its user name, which is no
    secret. The `base` of an `https` address has no user information at all,
    since the GitHub App, its one credential, ignores it, so a token written
    as a user name is stored nowhere either. No refusal, log line or answer of either service quotes an
    address the template service refuses, so a password given by mistake is
    stored, shown and logged nowhere. Before a check, a generate or an upgrade reads the template's
    files, the template service refuses as `unsafe-template-link` a template
    whose folder, the checkout joined with the address's `#path` and
    resolved, is outside the checkout, or holds a symbolic link that
    resolves outside it.
    So no request makes it read Menagerie's own files, such as its session
    key, as a template. Both services run as one user, and only that user
    opens the template service's socket. See the decision
    admit-templates-through-the-workspace-service.
  interviews: >-
    A question batch is Toha's JSON Schema batch document; the UI renders a
    form from it. Toha's interview session value carries the pinned template
    identity, context, admitted documents and accepted submissions. The
    browser holds the session value and sends it with each request. The
    template service checks the pinned template against the address the
    workspace service names for the job, rebuilds the interview from the
    session value and returns the next batch or a completed interview. The
    job, not the browser, holds the template and version it was started for.
  template-registry: >-
    Only registered templates can be used. A manager registers a template
    with a display name, its Toha address and an optional runner image. The
    name is one line of 1 to 100 characters, and the runner image a Docker
    image reference, as the configuration's `runner-image` is. The address
    takes the forms and credentials the user documentation lists under
    "Templates" (see git-and-credentials and github-app), names the
    template's repository and folder, and has either no ref or a version's
    tag, which then is the current version; the `version` check refuses an
    address whose ref is anything else, but for one the `address` check
    refuses first as not reading one way (see template-admission): a ref
    that holds a character outside letters, digits, `.`, `_` and `-`, such
    as `/` or `:`, more than one `@` after the host, a ref that holds a `.`
    or follows `git@host:path` but is no version's tag, and any ref of an
    `https://` or `ssh://` address with a port. Such an address registers
    without its ref and takes the newest version.
    Menagerie stores the address without its ref, as the address route's
    `base`. Registration runs the minimum checks in this order and refuses
    the template at the first that fails, naming the check: `address`, the
    template service reads and admits the address; `fetch`, the
    repository's versions can be listed; `version`, the list holds at least
    one version and, when the address has a ref, that ref is a version's tag
    (see template-versions); `fetch` again, the current version can be
    fetched; `read`, Toha loads the template's manifest, and its
    folder holds no link outside the checkout; `definition`, the content
    folder holds `.devcontainer/devcontainer.json`, and the refusal names
    that file. The current version is the address's tag, else the newest
    version, and its commit is the one the `fetch` check fetched. A
    template whose source is registered already is refused, naming that
    registration. The `id` is permanent: the lower-case letters and digits
    of the name, separated by single dashes, or `template` when the name has
    none, with `-2`, `-3` and on added while the id is taken. Registering a
    template joins it to each workspace that has no template and whose
    applied record's source is the template's. A manager can rename a
    template and change its runner image; its address and source do not
    change. A template that a workspace uses cannot be removed, and the
    refusal names those workspaces. Registering a template, taking a new
    version and removing a template need no configuration change and no
    restart. A registration and a template's upgrade can each be asked to
    check without storing: the same checks run in the same order, the
    `template-exists` refusal included, refuse the same way and log no
    address, nothing is stored, and the answer is the template a save would
    store. A save never trusts an earlier check: it runs every check again.
  template-versions: >-
    A version of a template is a tag of its repository named
    `MAJOR.MINOR.PATCH`, with an optional leading `v`, whose numbers have no
    leading zero. A tag with a pre-release or build part is not a version.
    Versions order by their numbers, and when `1.2.0` and `v1.2.0` both
    exist the tag without `v` is the version's. The template service lists
    a repository's tags without fetching its history, through the transport
    and credentials a fetch of that address uses, and peels an annotated tag
    to its commit (see list-template-versions-in-the-template-service). The
    workspace service checks every registered template's versions when it
    starts and then every `template-versions.every`, and a manager checks
    one template on request; two checks of one template at once share one
    run. A check replaces the template's found versions with what it found.
    A failed check keeps the earlier versions and records the time and its
    reason: the template service's refusal kind, or
    `template-service-unavailable`, which a listing whose versions are not
    each a version, a tag and a full commit id also gives. A check on
    request answers the template with that record, whatever the outcome,
    and the templates screen shows it. A
    template has a newer version while its newest found version is newer
    than its current version. A manager upgrades a template to a found
    version newer than its current one: the version passes the `fetch`,
    `read` and `definition` checks of a registration, then becomes the
    current version with the commit those checks fetched. A template takes
    a version only at the commit its listing found: when the fetch resolves
    the version's tag to another commit than the listing, of the last
    check for an upgrade or of the registration's own `fetch` for a
    registration, the tag moved since, and the registration or the upgrade
    is refused under the `version` check, asking for a version check, with
    nothing stored. The current version moves only forward. A check that finds the current version's tag
    at another commit than the recorded one shows the template's current
    version as moved, and jobs refuse it until a manager upgrades the
    template to that version again, which runs its checks and records the
    new commit. A workspace's applied version is the version its create
    generated or its last upgrade applied. It needs an upgrade while its
    template's current version is newer than its applied version. Every
    path that takes an applied version from a workspace's applied record,
    the joins (registration, discovery, the templates import),
    first-start-import 4 and Apply branch, follows one rule: the record's
    source must be the template's source and its commit a full Git object
    id, and the version is the found version whose tag is at that commit;
    when the record's ref is a version it must be that version, and when it
    is not and several tags share the commit, the version is the newest of
    them. A record that gives no version leaves a join's and import 4's
    applied version unknown, keeping the record's commit only when its
    source is the template's and the commit is well formed, so the next
    version check completes it; Apply branch refuses it (see
    apply-branch-flow). A workspace whose applied version is unknown,
    because no found tag is at its applied commit, shows so, with that
    commit, and is upgraded only when the template service answers that the
    current version's commit descends from it, so the upgrade still moves
    forward; when no commit is recorded for the current version, the job
    pins the commit that answer approved. A version check gives it the
    version whose tag is at that commit. A workspace
    whose applied record names a source that no registered template has
    keeps working and joins its template when a manager registers that
    source, once its repository has a version tag.
  create-flow: >-
    A create names a registered template and takes the workspace's policy
    choices, checked as workspace-policies says before any job exists. On a
    host with a `provisioning` section the workspace name is also refused
    before any job unless it can name a Xolotl key and be a Wyrwood value:
    lower-case letters, digits, `_` and `-`, starting with a letter or digit,
    at most 63 characters. A create is refused while Menagerie's data holds
    a workspace of that name, one listed as `no-folder` or being created
    included, and while the template's current version has moved. The job
    pins the template's current version and its commit for its whole run
    and writes the workspace's data, with its template and selection and
    marked as being created, when it starts, so discovery keeps it while
    the interview waits and the template it uses cannot be removed. The mark
    ends when the job creates the folder. A create that ends before it
    created the folder removes the workspace's data, and since a restart
    ends every job, a start removes each workspace marked as being created
    whose folder does not exist. After the interview completes, the workspace
    service creates a new folder
    under the workspace root and initializes its git repository. The template
    service builds Toha's plan and applies it into that folder, recording the
    answers in the applied record `.toha.json`. Generation completes when Toha
    reports that the applied record was written, and the workspace's applied
    version is then the pinned version. Without a provisioning
    declaration, the workspace service commits, backs the commit up to an
    orphan branch named after the workspace in the workspace repository, and
    starts the devcontainer through devcontainer-builder. The workspace
    repository is the create's backup repository (see backup-repositories).
    A branch of that name
    from a deleted workspace is the only copy left of it, so the backup first
    copies it to `archive/<name>-<UTC stamp>` and the console names the copy. With one, it runs
    the provisioning steps, which include that commit and backup. A create
    is marked unfinished in its repository's Git folder until its first backup
    lands. A folder with an applied record and that mark, or with no commit, is
    committed and backed up by the next start, so a start retries a create that
    failed after generation, and any job's first push copies the earlier
    branch. A
    create stays refused while the folder exists; delete removes a folder
    whose generation failed.
  upgrade-flow: >-
    An upgrade applies the current version of the workspace's template, which
    the job pins with its commit when it starts. It is refused before any
    job when the workspace has no registered template, when its applied
    version is that version or a newer one, and when the current version's
    tag has moved (see template-versions). A workspace whose applied version
    is unknown is upgraded only when the template service answers that the
    current version's commit descends from its applied record's commit; the
    job asks before the interview and otherwise fails as `template-refused`,
    naming both commits. So no path applies a version older than the one a
    workspace has.
    The workspace service commits any local changes to tracked files so the
    pre-upgrade state is backed up. Toha fetches the newer template version.
    The template service reads `.toha.json`, replays the recorded answers
    against the newer template, asks the questions they do not answer, and
    applies the merge. A written or conflicted merge, and Toha's
    `already-current`, record the pinned version as the workspace's applied
    version, as Toha's applied record does. The workspace service commits,
    backs up and rebuilds the container. The rebuild reads the merged
    definition, so a template that declares new needs gets them in that
    rebuild. An upgrade changes neither the workspace's selection, nor its
    values, nor its Xolotl key.
  apply-branch-flow: >-
    Apply branch brings a branch of the workspace repository, such as a
    reviewed pull request's head, into a workspace through Git. The manager
    names the branch. The workspace service fetches only that branch into
    the private ref `refs/menagerie/apply`, deleted when the job ends; a
    missing branch changes nothing. It then commits every local change, as
    the commit operation does, and backs the branch up, except when the
    named branch is the workspace's own: that push would replace the
    commits about to be applied, so it waits for the push after the apply,
    and a refused apply leaves the workspace repository as it was. A
    shallow workspace repository, or fetched history that lacks a commit or
    tree, refuses the apply. A branch already in the workspace branch's
    history changes nothing more, except that the workspace's own branch is
    then backed up. A branch that
    extends the workspace branch fast-forwards it. Otherwise the two merge
    file by file over their single merge base: a path changed on one side
    only takes that side, and a path both sides changed differently, no
    merge base, several, or a file where the result has a folder refuse the
    apply with nothing changed. go-git has no merge, and this merge never
    writes conflict markers. Before writing, the apply refuses a change
    that has a path Menagerie does not write (the one check staging uses,
    go-git's own included) or a submodule, or that would write over an
    untracked or ignored file, folder or link, or inside a nested
    repository. The merge is planned in memory first, and a plan that
    cannot apply leaves the devcontainer running. Otherwise the
    devcontainer stops, with every service of its Compose project, so
    that nothing writes to the folder while the apply does; what it wrote
    before it stopped is committed and the merge planned again. Right
    before writing, the apply refuses while another running container
    mounts the workspace folder, a path inside it, or a folder that
    contains it. A refusal from the stop on returns the devcontainer to
    its state before the job, and a job that leaves it stopped says so in
    its console. As a
    second defence the apply changes the folder through descriptors that
    never follow a symbolic link in any component, moves the files it
    replaces or removes to temporary names in their folders, and checks
    them there; a file changed since the local backup moves everything
    back and refuses the apply with the change kept. It then writes only
    the changed paths, each to a free name, removes the moved files,
    records the index with the stat data of what it wrote, moves the
    branch last, backs it up and rebuilds the devcontainer.
    A planned merge that changes the applied record `.toha.json` is read
    before any write, the planned record alone, bounded in size: the record
    it would write must give a version by the rule of template-versions,
    the found version whose tag is at the record's commit and, when the
    record's ref is a version, that version; that version must not be the
    template's current version while the current version's tag has moved;
    and the version must be no older than the workspace's applied
    version. A workspace with no registered template takes no change to
    its record, and one
    whose applied version is unknown takes a record whose version is known
    and whose commit descends from its applied commit, as an upgrade
    checks. A merge that removes the applied record, or leaves one Toha
    cannot read, a record larger than the bound, and anything else refuses
    the apply as `not-applicable`, naming both versions or commits, quoted
    and shortened, with nothing changed. After an apply that
    changed the record, the workspace's applied version and commit are the
    record's. Only the API and the UI start Apply branch, never the
    workspace socket.
  container-operations: >-
    Start, stop and rebuild call devcontainer-builder for the workspace
    folder. Rebuild recreates the container from the current definition.
    Devcontainers get whatever their definition asks for, including
    privileged mode, as they do when devcontainer-builder runs on the host.
    A workspace that must start after a host restart sets a Docker restart
    policy in its definition. A host restart empties `/run`, and Docker tries
    to start containers before the Wyrwood agent runs, so the start of a
    bound container fails on its missing consumer directory. The agent starts
    that container when its sockets are ready, when its last start failed on
    that directory and its restart policy says it runs. An unbound container
    needs no agent: the daemon restarts it.
  host-prerequisites: >-
    Before each create, start, rebuild and upgrade, with or without a
    declaration, the workspace service creates any missing bind source folder
    inside the workspace folder, owned by the workspace root's owner, because
    a clone of a backup has no folder that holds no tracked file. Before any
    other step of a create, after the definition is rendered, it checks bind
    sources outside the workspace folder and the networks `runArgs` names, and
    reports all that are missing in one job console message, as
    `host-prerequisites-missing`. It creates nothing outside the workspace
    folder. A declaration's consumer directory is excluded, because the agent
    creates it: it is the bind source whose final folder is the container name.
    The bind sources are those the definition file names, in `workspaceMount`,
    `mounts`, where the last mount of a target wins, and, for Compose, its services' volumes; what features and image
    metadata add is not known before the build. A source with a `..` component
    counts as outside the folder, because only Docker can tell where it leads,
    and a source inside the folder that a symbolic link takes out of it is left
    to Docker. The daemon answers for sources outside the folder, because
    Menagerie's filesystem does not show host paths: for each source, a
    throwaway container with that source mounted is created and removed,
    never started, and the Engine refuses to create one whose source is
    missing. The services run as the workspace root's owner, so a new folder is
    theirs.
  provisioning-declaration: >-
    A provisioning declaration is the `customizations.menagerie` block of a
    rendered definition, as the provisioning-declaration specification
    defines. A template opts in by rendering the block, and the block
    declares the numeric access group of the consumer directory and its
    sockets, which the container's user must have. Everything else the
    binding and the key hold comes from Menagerie's data: the policies (see
    workspace-policies), and the values those policies read and the Xolotl
    client key (see provisioning-identity), so a template change cannot
    alter them. The members that templates rendered for earlier releases,
    `wyrwood.policies`, `wyrwood.values` and `xolotl`, are read only by
    first-start-import; every job ignores them, and its console names each
    one it ignored. Absent, no step of provisioning runs and the workspace
    works as any other, apart from retiring what Menagerie's data holds for
    it. Only the definition file counts, never metadata from its image or features.
    The container name is the `--name` value of `runArgs`, read as
    devcontainer-builder reads it, so the name has one source. A declaration
    in a Compose definition is refused, because `runArgs` does not apply
    there. Provisioning settings of the host, such as the Wyrwood agent's
    name, the Xolotl URL and the Xolotl key policy, are configuration, never
    part of the definition.
  provisioning-identity: >-
    A provisioned workspace's Xolotl client key is
    `<provisioning.xolotl.key-policy>/<workspace name>`, and every value
    that its selected policies read is the workspace's name. Both are
    written to the workspace's data once and never change: the key when the
    first provisioning job of the workspace runs with `provisioning.xolotl`
    configured, a value when the selection first holds a policy that reads
    it. A workspace that first-start-import took over keeps the key and the
    values it had. A policy's value names are those Wyrwood's policy list
    gives it. The binding carries the values of the policies it holds;
    values that no selected policy reads stay in the data, so a policy added
    again reads what it read before. With `provisioning.xolotl` and no
    `key-policy`, a job that has to name a new key fails as
    `provisioning-unavailable` and names the missing setting. Without
    `provisioning.xolotl`, a workspace gets no key. Menagerie reads no
    policy to decide it: whether a workspace can read its key is the
    selection's, such as a required policy, as the operator decided
    (issue-a-key-to-every-provisioned-workspace). Menagerie sets
    `MENAGERIE_XOLOTL_KEY` to the key's `<policy>/<name>` in a provisioned
    workspace's container under the rule workspace-socket gives
    `MENAGERIE_WORKSPACE_SOCKET`: at each rebuild, and at each start that
    creates the container or reuses one that has the variable, unless the
    definition sets that name itself. So a definition learns its key's
    address from Menagerie. See the decision
    name-workspace-provisioning-after-the-workspace.
  workspace-policies: >-
    Menagerie decides each workspace's Wyrwood policies; a template does
    not. The operator key's grant, which Wyrwood's `whoami` answers, and the
    policies inside it, which its `policy-list` answers with the values each
    reads, are read again by each request and each job step that shows,
    checks or applies policies, and are never kept between them. A policy is
    inside the grant when `policy-list` answers it. The policy settings sort
    policies: a required policy is in every workspace's selection and cannot
    be removed from one; a policy group holds policies and is single-select,
    exactly one, or multi-select, at least one; any other policy inside the
    grant is an ordinary policy. A policy is required, in one group, or
    neither. Group names are unique, and a settings change carries the
    revision it was read at, so a change made from an older read is
    refused. A workspace's selection is the set of policies its binding is
    to hold. A create takes a choice in
    each group, exactly one in a single-select group, and any ordinary
    policies, and Menagerie adds the required ones. A selection change
    carries the selection's revision, keeps every required policy, and
    leaves no group that had a valid choice without one, so a workspace
    that lacks a choice, for example in a group added after it was created,
    still changes its other policies and shows which groups need a choice.
    A selection change of a workspace whose selection is still to be
    imported (first-start-import 5) imports it first, in the request, and
    only then checks the revision, so a change made from a selection read
    before the import is refused as stale and the manager decides again
    from the imported one; while Wyrwood cannot answer, the change is
    refused and nothing is stored. A selection can lose its last policy;
    Menagerie applies it as any other and records what Wyrwood answers (see
    binding-convergence). A
    policy that a settings change, a create or a selection change adds is
    refused by name before any job runs when it is outside the grant or
    Wyrwood does not have it. For settings, adding means adding to required
    policies or to a group's members: retaining a member does not add it,
    and moving it between those classifications does. A policy that left
    the grant after it was added is shown as outside the grant, and an apply of a selection that
    holds it fails, naming it. Marking a policy required adds it to every
    workspace's selection, and each of those workspaces applies it as
    policy-application
    says. A policy that stops being required stays, as an ordinary policy,
    in each selection that has it. A workspace whose definition has no
    declaration keeps a selection. Its binding, while a current name
    remains, stays until the `retire` phase of its next job that starts its
    devcontainer removes it, and an apply changes that binding until then. See the decision
    apply-workspace-policies-from-a-stored-selection.
  policy-application: >-
    Each selection change increments the workspace's selection revision, and
    the binding has its selection once a job records that revision as
    applied. The `apply-policies` operation is a job on the workspace with
    one phase, `bind`. It reads the selection, the values and the revision,
    and reads the grant: a selected policy outside it fails the job as
    `policy-outside-grant`, naming each, with no request to Wyrwood, so
    Menagerie never asks Wyrwood for a policy outside the grant. With no
    current container name it records the revision, because the
    workspace's next provisioning job binds the selection. Otherwise the job
    brings the binding of that name to the selection as binding-convergence
    says, an empty selection included, keeping the binding's access group. So a workspace whose definition no
    longer parses or no longer declares the name, until `retire` removes
    that current name, still has its binding changed; only a missing
    binding needs a declaration the reader accepts. A selection change starts the job at once when
    the workspace has no job, and otherwise when that job ends; marking a
    policy required does the same on each workspace. Start-up starts it on
    each workspace whose binding lacks its selection, and a manager starts
    it on request. A failed apply is not repeated by itself: the workspace
    shows the reason until a manager, a start-up, a selection change or a
    provisioning job applies the selection again. Menagerie decides the
    binding: a change made to it in Wyrwood's web interface is replaced by
    the workspace's next apply or provisioning job, whose console names the
    fields it changed, as the operator decided
    (let-menagerie-decide-each-binding).
  binding-convergence: >-
    The `bind` step and `apply-policies` bring a workspace's binding to its
    selection the same way. The binding is the `name` binding of the
    workspace's current container name on this host's agent. Menagerie reads
    it by the ID its data records for that name, with `binding-get`, which
    answers `not-found` for a binding that does not exist and `outside-grant`
    for one the grant does not cover. A recorded ID that `binding-get`
    answers `not-found` is dropped, since an operator may have removed the
    binding and made another under the name, and a name with no recorded ID
    is resolved through the agent's `binding-list` by its agent and key: the
    ID found is recorded and Menagerie goes on with that binding, and a
    name the list does not show is handled as missing, subject to bind's
    answer below. The access group comes
    from the job. A provisioning job's `bind` step uses the group its
    declaration names, which `read-definition` accepted. `apply-policies`
    keeps the group of a binding it reads. When the binding is missing, it
    reads the workspace's definition: a declaration that Menagerie's reader
    accepts and that names the current container name gives the group, and
    any other definition fails the job as `provisioning-invalid`, naming
    the reason, with no binding request. A binding
    that is not there is made with `bind`: the selection, its values, the
    job's access group, `report` enforcement and default token lifetimes;
    Menagerie records the ID `bind` answers, or, when `bind` answers
    `pending` with no binding, the ID a read of `binding-list` finds. A
    `bind` answered `binding-differs` means a binding of that name appeared
    meanwhile: Menagerie resolves the name through `binding-list` again,
    records the ID it finds, and converges on that binding, once; a second
    `binding-differs` fails the job as `binding-changed`. A binding the grant does not cover, read or bound, fails
    the job as `binding-outside-grant`, naming the container name, and
    Menagerie changes nothing. A binding that holds the selection, its
    values and the job's access group, and that Wyrwood reports `applied`, is not
    written. One that holds them and is not `applied` carries an assignment
    Wyrwood saved and OpenBao did not apply: Menagerie sends a binding change
    of that selection at the binding's revision, which finishes it. Any
    other binding gets a binding change (`binding-change`, wyrwood#159) by
    its ID and the revision Menagerie read, with the whole selection and its
    values, the job's access group, and the binding's other settings as
    read. Wyrwood applies it as an edit in its web interface: the container's
    old token is revoked, the container reads with the new selection with no
    restart, and its consumer directory and sockets stay. A change answered
    `revision-differs` came after another one: Menagerie reads the binding
    and decides again, once, and a second `revision-differs` fails the job
    as `binding-changed`. A `bind` or a change answered `pending` was saved
    and not applied: Menagerie reads the binding and sends the same `bind`
    again, or the same change at the binding's new revision, up to three
    times one second apart within `provisioning.readiness-wait`. A
    request still `pending` fails the job as `binding-pending`; the saved
    selection stays in Wyrwood, and the next apply or provisioning job
    finishes it as above. An empty selection is sent as any other, and
    Wyrwood's answer stands. Wyrwood refuses a binding with no policy, so
    such a `bind` or change fails the job as `binding-refused`, as any
    refusal not named above does; the console and the workspace's apply
    failure carry Wyrwood's answer on one line, the binding keeps what it
    held, and the selection stays stored and not applied. A binding that
    Wyrwood no longer shows after a change has a stale recorded ID: Menagerie
    drops the ID and resolves the name again within the once-only retry.
    Wyrwood 0.7.1 never removes a binding in answer to a bind or change, and
    its reads cannot tell a removed binding from one the grant hides, so
    Menagerie records no removal. A missing binding needs an accepted
    declaration naming the current name, whatever the selection; without
    one the job fails as `provisioning-invalid` with no binding request.
    Otherwise it is made with `bind`, whatever the selection, and Wyrwood's
    answer stands. A hidden binding fails as `binding-outside-grant`, and an
    empty selection as `binding-refused`; neither advances the applied
    revision. Leaving a name out of `binding-list` never advances it.
    With no current container name it records the revision without a binding
    request. Otherwise it records the selection
    revision as applied only after a read shows the binding with that
    selection, its values, the job's access group and `applied`, and the console
    names each policy and value it added or removed.
  operator-identity: >-
    Menagerie's operator key is an OpenBao Transit key that the agent offers
    on Menagerie's own `ssh-agent.sock`. The Wyrwood client selects it by
    name or public key and offers no other key to the controller, so the
    controller records no other key as pending. The first connection records
    the key as pending; an operator approves it once in the Wyrwood web
    interface, as host preparation. Until then a provisioning job fails and
    names the key's fingerprint. Xolotl's scoped key lives in OpenBao, in a
    secret configuration names, and is read through `vault.sock` for each
    operation that needs it. It stays in memory for that operation and never
    reaches a log, an event or an error. No key or token is stored in the
    container. Menagerie's Wyrwood policy grants these reads and signatures.
  operator-authority: >-
    Approval sets a grant on the operator key: the agents it may act for, the
    policy names it may bind and its actions. Menagerie's grant is `read` and
    `bind`, which makes, changes and removes bindings, for the agent of its
    own host, for an allowlist of policies, with no policy write. The
    allowlist is what managers choose from (see workspace-policies). A
    binding that holds a policy outside the
    allowlist is outside the grant, so Menagerie cannot change or remove its
    own binding or any binding an operator made for something else. Each
    workspace reads only its own Xolotl key through one shared policy with a
    per-binding value, so no workspace needs a policy of its own and
    Menagerie writes no policy. Authority over keys stays on this host through
    a Xolotl key policy that only this host's workspaces use: the shared
    Wyrwood policy fixes that key policy in its path, so the value names only
    the key, and the scoped Xolotl key lists only that key policy, which
    configuration names as `provisioning.xolotl.key-policy`. That key
    policy grants only `proxy` and `mcp`, because Xolotl refuses a `keys` key
    any other. Preparing a host creates both. Bindings Menagerie creates use `report`
    enforcement, so Wyrwood never recreates a container during a job. The
    grant has no default expiry, so that provisioning does not stop in
    silence. An operator revokes it in the Wyrwood web interface. The audit
    subject of each action is the key's label. A call outside the grant fails
    the job and names the action. Xolotl's scoped key has the `keys` scope
    for that key policy and can do nothing else.
  provisioning-clients: >-
    Wyrwood is reached through its public Go package, Xolotl through plain
    HTTP. Menagerie spawns no CLI. `POST /admin/keys` writes the client key
    to OpenBao and returns no key, so Menagerie never holds a workspace's
    client key. The key has no expiry, so that a workspace does not lose its
    gateway in silence. An answer that a key exists also says whether that key
    is disabled or expires, and the console shows it, since a repeat changes
    neither. A request is sent again while Xolotl answers that it should be,
    a few times, and a job that still fails is retried as any other. Xolotl
    counts as out of reach when a request gets no connection or no answer in
    time, or a gateway answers that it is not available; any other refusal
    fails the job. The Xolotl key is the workspace's, as
    provisioning-identity says.
  provisioning-steps: >-
    With a declaration, the jobs that can create a container run these steps,
    in this order, each its own phase in the job console. Create runs all of
    them. A rebuild, the rebuild at the end of an upgrade or an apply-branch,
    and a start with no container run them without the commit and backup,
    which a start still runs for a folder with no commit. A rebuild removes
    the old container after `build`.
    1. `read-definition` reads the declaration and the container name and
    refuses, as `provisioning-invalid`, a declaration Menagerie's reader
    refuses (see provisioning-declaration), a
    definition with no `--name`, and a container name that Menagerie's data
    holds for another workspace or that a container of another workspace
    holds. The last check keeps the delete of one workspace from
    unbinding another's container. A provisioning section that
    configuration lacks fails as `provisioning-unavailable`, and so does a
    workspace whose selection is still to be imported while Wyrwood cannot
    answer (see first-start-import). The console names each legacy member of the declaration it ignores. Host
    prerequisites are
    checked here, so nothing is issued for a workspace that cannot start. 2. `issue-key` issues the workspace's Xolotl key (see
    provisioning-identity), after its data records the key as the
    workspace's, and treats the answer that the key exists as done, so a
    repeat never rotates it. 3. `bind` checks the selection against the
    grant as policy-application does, records the container name as the
    workspace's current one in its data, and brings the binding to the workspace's selection, its
    values and the declared access group as binding-convergence says, whether its container runs or not. A binding
    it makes, it waits on until the binding reports its consumer directory,
    which the agent creates before the container exists. A binding that
    already holds the selection and is applied is not written, so a repeat
    revokes no token. 4. `commit` and
    `backup` run as in a create. 5. `initialize-command` and `build` run as
    in any start. 6. `create-container` uses devcontainer-builder's create-only mode
    and records the container's id. That mode refuses a bind with an SELinux
    `z` or `Z` option or `bind-create-src`, and the job fails naming the mount,
    so a declaration's definition uses neither. 7. `wait-for-sockets` reads the binding's
    status until its reported container is that id, in any state,
    with the declared access group applied and both sockets ready, with no
    conformance failure. It waits on this readiness, never on the token,
    which reports valid while a wrong directory owner leaves no sockets.
    Comparing the id keeps the sockets of a rebuild's old container from
    counting. The wait is bounded by `provisioning.readiness-wait`, which
    times the host and never a person, and its failure,
    `provisioning-not-ready`, carries the status and the agent's last error.
    8. `up` starts the container and runs its lifecycle commands, so the
    first start has sockets. 9. `verify` reads the status again, within the
    same bound, because the agent reports a start a moment later: the same id,
    running, with its sockets. What a container needs from its sockets is
    the template's to check, in a lifecycle command, whose failure fails the
    job. 10. The job ends, and the workspace row offers pairing.
    A start of an existing container runs `issue-key` and `bind` as well, so
    it finishes a job that stopped before them, whatever container that job
    left. Only when Xolotl cannot be reached does it continue, with a console
    note, so a Xolotl outage leaves an existing container able to start; a
    key that was never issued then fails the template's lifecycle check. It
    uses create-only mode, which keeps the container or replaces it under the
    rule `up` applies, so a changed definition never starts without sockets.
    It then runs `wait-for-sockets` unless the container runs, `up` and
    `verify`. Without a declaration, every job uses `up` as it would without
    provisioning.
  provisioning-retries: >-
    Every step is safe to repeat. A job that fails leaves what it finished,
    and start is the retry: it finds the key, the binding and the container
    and continues from what is missing. A start replaces a container that
    has a name the definition no longer declares or does not declare, because
    a rebuild that failed left it, and a binding of the new name would never
    report it. A `name` binding survives a rebuild,
    because the container keeps its name: the agent keeps the directory and
    its sockets through the gap and gets a new token. Menagerie's data holds
    each container name Menagerie bound and each Xolotl key it issued for a
    workspace, written before the request that makes it and removed only
    once Wyrwood or Xolotl confirms it gone, so what a job made is known
    whatever the definition says later and whether or not it still parses.
    Any job that ends with the devcontainer started, with or without a
    declaration, ends with a `retire` phase: it unbinds each name the
    definition no longer declares and, when the definition has no
    declaration, unbinds every name and revokes the key, and removes each
    from the data as it is confirmed gone. An unbind names the binding by
    the recorded agent and container name, never by what a read shows, so a
    binding hidden by the grant is not taken for a removed one. Wyrwood
    confirms a binding gone when it answers that it removed it, a warning
    that its token may stay valid until it expires included, which the
    console shows, or that no binding of that key exists; an answer that the binding is outside the
    grant keeps the name in the data and fails the job as
    `binding-outside-grant`, naming it, until an operator widens the grant
    or removes the binding in Wyrwood's web interface. Xolotl confirms a key
    gone when it answers that it revoked it or that it has no such key. The
    workspace keeps the identity of its key, so a declaration that returns
    gets the same key name. So a start or a rebuild whose definition no
    longer names the current binding works this way. A declaration of
    another name binds that name, makes it current, and retires the old one
    at the job's end. No declaration runs no provisioning step and retires
    every name and the key at the end. A declaration the reader refuses
    fails the job in `read-definition`, leaving the binding, the current
    name and the container as they are. A job that fails, or a
    Menagerie that restarts, leaves them for the next one. A failure while
    retiring fails the job, with the devcontainer running. A name or key
    belongs to one workspace at a time, so one workspace's retirement never
    takes what another uses. A definition a devcontainer can edit
    already gets privileged mode at its next rebuild, so the declaration is
    no boundary against that devcontainer; it decides only the container
    name and the access group, and the grant still bounds what the operator
    key can bind.
  delete-flow: >-
    Delete removes a workspace from the host. It refuses while another
    running container mounts the folder, a path inside it, or a folder that
    contains it. `read-definition` reads what the workspace holds from
    Menagerie's data, never from its definition, and fails as
    `provisioning-unavailable`, with nothing changed, when it holds a name
    or a key and the configuration lacks the section that reaches it. `stop` stops the
    devcontainer, and for Compose every service of its project. `commit` and
    `backup` save tracked and new files as the commit operation does, and a
    failure there removes nothing; a folder with no applied record has no
    backup. `unbind` removes each binding the data names while the
    container exists, and the agent retires its token and sockets; it
    confirms each as `retire` does, and a binding Wyrwood answers is
    outside the grant keeps its name in the data and fails the delete as
    `binding-outside-grant` before any container, key or folder is removed.
    `remove-container`
    removes the workspace's containers; for Compose, named volumes and
    networks stay. `revoke-key` revokes each key the data names.
    `remove-folder` removes the socket
    folder and then the workspace folder; a throwaway container that runs as
    root, with only that folder mounted, first renames the repository's `.git`,
    so that from then on no job commits what is left, and then removes the rest.
    Before that container runs, the workspace's data names the folder by
    its device and inode, in Menagerie's data volume, which no
    devcontainer can reach and no removal can take part of. Only that record, for
    that folder, with `.git` gone means the removal began: a retried delete then
    skips the backup, and a start or rebuild fails as `delete-unfinished`. Every
    job that writes to a folder needs its repository, so nothing was written
    after the backup. Any other folder, which a stopped removal did not reach or
    that took the name later, is backed up as usual, and a start or rebuild ends
    the state. The state ends once the folder is empty, before the folder goes.
    A workspace that holds no name and no key calls neither Wyrwood nor
    Xolotl. Each step treats what is already gone as done, and the folder
    goes last, followed by the workspace's data, so a retried delete finds
    what is left. A workspace listed as `no-folder` is deleted by the same
    steps without the stop, the backup and the folder's removal. The backup
    branch stays in
    the workspace repository, images stay, bind sources outside the folder
    stay, and the agent's empty consumer directory stays until the next host
    restart. Ignored files, such as cloned repositories, are not in the
    backup and are lost.
  operations-and-jobs: >-
    Each create, upgrade, apply-branch, start, stop, rebuild, commit,
    apply-policies or delete is a job. A workspace has at
    most one job at a time. Jobs and their logs are held in memory and
    streamed to the UI. A restart of Menagerie drops job history. Optional
    time limits, a default, per operation and per phase, count running time
    only, never time waiting for answers; a job past one is cancelled
    through its context and fails as timed-out once its work returns. An
    optional webhook hears of every failed job and, past a threshold, of a
    long-running one.
  commit-operation: >-
    The commit operation is a job of two phases. Its `commit` phase stages
    every change of the workspace, as `git add --all` would: untracked,
    modified and deleted files, and what is already staged. A file that
    replaces a tracked folder, or a folder that replaces a tracked file,
    takes the old entries out of the index. Untracked paths the workspace's
    ignore rules exclude, anything inside a nested Git repository, and
    paths go-git could not read back from the index, such as a tab or a
    newline in a name, stay unstaged, so later backups keep working. The ignore rules are the workspace's own: its `.gitignore`
    files, `.git/info/exclude` and the file its repository's
    `core.excludesFile` names. Menagerie reads only the repository's own
    `.git/config`, never its own Git configuration, and the repository's
    configuration is written from inside the devcontainer, so an exclude
    file is used only when it resolves, through symbolic links, to a
    regular file of at most 1 MiB inside the workspace folder; otherwise
    the job console gets a fixed note, without the path, and the file is
    skipped, so the files it excludes can be committed. When the
    staged index differs from the branch's commit, it commits on the
    workspace branch as Menagerie. Its `backup` phase force-pushes the
    branch as every backup does, also when nothing changed, so a backup
    that failed before is pushed again. A failed phase fails the job as
    `commit-failed` or `backup-failed`. The API starts it on any workspace;
    the schedule and the workspace sockets start it too, and a time limit
    on the `commit` operation applies to all of them.
  scheduled-commits: >-
    With `auto-commit`, a sweep runs every interval, the first one interval
    after start-up. It lists the workspaces under the root and starts a
    commit job, with the message `chore(menagerie): automatic commit`, on
    each workspace that has no unfinished job and has a change the job
    would commit. A busy workspace is skipped until the next sweep, never
    queued. The check stages the workspace's changes in memory and compares
    the result with the branch's commit, so it finds a change exactly when
    the job would commit one, and it writes nothing. A workspace whose changes
    cannot be read is logged by its name with a fixed text.
  workspace-socket: >-
    With `workspace-socket`, each workspace has a Unix socket that its
    devcontainer reaches at `/run/menagerie/workspace.sock`, the only
    Menagerie endpoint inside a devcontainer. The socket folder is mounted
    at the same path on the host and in Menagerie's container, belongs to
    the services' user and has mode 0700. It is not itself a symbolic
    link, and every folder above it, with links resolved as the host's
    daemon resolves them, belongs to root or the services' user and is
    writable by no other user unless it is sticky, so no one else can
    point its path elsewhere. Start-up refuses a socket folder inside the
    workspace root or around it, both compared with their symbolic links
    resolved, so no workspace's container reaches another's socket. It holds a folder
    per workspace, mode 0755, with `workspace.sock`, mode 0666, and
    `bin/workspace-commit`, the static client copied from Menagerie's
    image. Each rebuild, and each start that creates the container or
    reuses one that already has the mount, of a single container or a
    Compose primary, bind-mounts the workspace's folder read-only at
    `/run/menagerie`, and sets `MENAGERIE_WORKSPACE_SOCKET` to the socket
    unless the definition sets that name itself; the definition on disk
    does not change. A start that reuses a container created without the
    mount leaves out the mount and the variable, because adding them
    changes the configuration devcontainer-builder compares and Compose
    would recreate the primary; the job console notes that the socket
    attaches at the next rebuild. devcontainer-builder offers no way to
    learn before Up whether it will recreate the container, so a start
    whose definition changed in another way still recreates it, without
    the socket, and the console says the socket attaches at the next
    rebuild. The folder is mounted,
    not the socket, so a socket that a restarted Menagerie re-creates is
    reached through the same mount. The workspace service creates a
    listener for every workspace at start-up, and before each start or
    rebuild when it has none or its socket file is no longer its own, so a
    created workspace has its socket before its devcontainer starts. A
    stale socket file is replaced and the client copied in again through a
    new file; no symbolic link is followed, and a workspace folder that is
    not a folder of the services' user is refused, which fails the start.
    The workspace is bound to its listener: the socket API has no way to
    name a workspace, and no token is needed. It has one route, `POST
    /v1/commits` with a commit message, which starts a commit job on the
    bound workspace, waits for it to end and returns the job's id, end
    state, commit, whether it changed and was pushed, and the error kind.
    A client that goes away does not cancel the job. When Menagerie shuts
    down, a request waiting for its job is answered 503 `shutting-down`
    with the job's id, and the client exits as for a retry. A request is
    admitted under the same lock that shutdown takes to begin, so no job
    starts once shutdown has begun; such a request is answered
    `shutting-down` without an id. A commit job whose context has already
    ended stops before its commit phase and writes nothing. Each
    workspace's socket takes at most 32 connections at once and the
    process 256; a connection over either bound is closed as soon as it is
    accepted. A request's header and its body each have 10 seconds and an
    idle connection 60; the wait for the job has no deadline, since the
    commit operation's time limit governs the job. A second commit of a
    workspace within the minimum interval of its last accepted one is
    refused with the time left, so a loop in a container cannot fill its
    backup branch. Every reply carries kinds, ids, hashes, numbers and
    booleans only, never a message, so no error, path or remote address
    reaches the container; the job console has the detail. Start-up checks
    of the socket folder and the client name the entry and the rule, never
    a path or an operating system error's text. A commit
    records what the container could already write: no path is refused.
    Throwaway containers never get the socket folder.
  docker-access: >-
    The workspace service talks to the host Docker daemon through the mounted
    socket, with devcontainer-builder for devcontainers and the Docker
    library for throwaway containers. Only the workspace service uses
    Docker: the template service reaches a container only by asking the
    workspace service to run a hook.
  t3-code-pairing-tokens: >-
    A manager gets a T3 Code pairing token for a running workspace from its
    row in the list. The workspace service reads the t3code-server Feature's
    service user and home from the container, and runs `t3 auth pairing
    create` there through Docker exec in the Docker library, as that user and
    with the server's data directory. T3 Code owns the token's scopes and
    lifetime. The route answers the token directly and is not a job: job logs
    and events are kept for later readers, and a token must have one reader.
    A long job must not block it, so it takes no job slot. Docker cannot stop
    an exec, so a command that hangs stays in the container. The Feature's
    `config.env` is a file this design reads across a repository boundary.
  registry-credentials: >-
    Container registry credentials for pulls, builds, feature downloads and
    Compose services come from OpenBao. Configuration names, per registry, a
    secret in a KV version 2 mount whose `username` and `password` fields
    hold the credentials. The workspace service reads it through the OpenBao
    API on the Wyrwood vault socket, which supplies Menagerie's own token, and
    hands the credentials to devcontainer-builder directly. No Docker client
    configuration is read and no credential helper runs. A registry that
    configuration does not name is anonymous; a named registry whose secret
    cannot be read fails the operation.
  throwaway-containers: >-
    Each template hook and each `initializeCommand` runs in its own
    throwaway container that the workspace service creates through the
    Docker library. The workspace folder is bind-mounted read-write at its
    own path, which is the host path, except for an upgrade's hook, which
    gets no mount at all: its candidate is copied in instead. Nothing else
    is mounted, so no Docker socket, no Wyrwood socket and no workspace
    socket is reachable. The environment holds only
    what the specification defines and the runner image's own variables,
    its `PATH` included. The container runs as the services' user, the owner
    of the workspace root, with `no-new-privileges`, on the default bridge
    network, without an SSH agent. Its program runs as given, never through
    the image's entrypoint. Menagerie's own notes on a run, such as an image
    pull, go to the job console, never into a stream a hook captures. Every
    container carries Menagerie's labels, with the workspace root, the job
    and a random id of its own, and is force-removed when its command ends.
    A container's creation runs to the Engine's reply, which a cancellation
    does not interrupt. Creation has a two-minute bound, allowing a busy
    daemon more time than the observed 30-second stalls while keeping the
    wait bounded; removal has its own 30-second bound. A creation that
    exceeds its bound reports that the daemon did not answer in time and
    retrying is safe. A creation that fails is followed by a search for
    its id label, so a lost reply leaves no container. The workspace
    service removes its leftovers when it starts. A cancelled job kills and
    removes its running containers before it ends. The containers of a bind
    source check, as host-prerequisites describes, carry the same labels and
    run no command.
  runner-images: >-
    A throwaway container runs the registered template's runner image, else
    the global `runner-image`, else Menagerie's own image, which the workspace
    service finds by inspecting its own container: the container its mounts
    name, else, only when they name none, the container its hostname names
    when that container carries the hostname. One search runs at a time and
    each job stops waiting for it when the job ends. `initializeCommand` has
    no template and uses the global choice. A missing image is pulled
    with the registry credentials; when no image can be found or pulled, the
    job fails as `runner-image-unavailable`.
  template-hooks: >-
    Toha runs a generate's or apply's hooks through the template service's
    hook runner, which sends each hook with Toha's target to the workspace
    service over the hook runner socket, a private Unix socket in the same
    folder as the template service's socket. Each generate or apply request
    carries a random token that the workspace service grants for that
    request alone and maps to the job's context, workspace folder, runner
    image, console and kind of target; an unknown or revoked token is
    refused. A generate's target is the workspace folder, or a folder inside
    it, and its hooks run in the mounted folder. An upgrade's target is
    Toha's candidate: Toha checks out the workspace's `HEAD` into a
    temporary folder, applies the new version and runs its hooks there,
    then merges the result into the workspace. The template service's
    temporary folder is the candidate folder, which both services read from
    configuration and which is private to the services' user; the service's
    temporary entries are in its subfolder `.menagerie-work`. A template
    service killed in an upgrade leaves its candidate there, so the next
    start removes the entries with the exact names Toha's temporary folders
    and the copy back below use. Each service holds a shared `flock` on the
    subfolder for its lifetime, or does not start, and a start removes entries only after its
    socket is bound and while it alone holds the subfolder, before its first
    request. A hook the workspace service still runs for the ended request
    is cancelled with that request, and a copy back at that moment fails
    its own lost job. An upgrade's
    token admits only a folder inside it, named by its own path without a
    symbolic link and never the workspace folder, and a generate's token
    admits no candidate. The candidate is not a host path, so the workspace
    service copies it into the container at its own path, without mounting
    the workspace folder. When the hook exits, with any exit code, the
    service copies the candidate back out and makes the candidate on disk
    match it exactly, symbolic and hard links as links and entries owned
    by the services' user; a cancelled hook's candidate is not copied
    back. The copy back extracts into a fresh folder beside the candidate,
    opens every path without following a symbolic link, refuses an
    absolute name, a `..`, a name outside the candidate, a hard link to
    anything but a file it already wrote, and any entry other than a
    folder, a file or a link, and then swaps the folder in, so a refused
    copy leaves the candidate as it was. The old candidate is then
    removed, read-only folders included; one that cannot be removed
    completely adds a note to the job console and does not fail the hook.
    The hook runs in a throwaway container with an
    empty environment, in its target-relative working directory, resolved
    with symbolic links followed; one that is missing or resolves outside
    its target is refused before any container exists. A script hook's
    template folder is copied into the container at its own path before it
    starts. Streams the hook captures
    return to Toha and never reach a log or an error; the others go to the
    job console. A captured value can reach any value Toha renders after
    the hook ran, so no error carries a rendered value: the template
    service builds every generate and apply refusal from a fixed message
    per error variant, and the workspace service reports a failed throwaway
    container by its stage and the Engine error's class, never by the
    Engine's message. For a hook, that report goes to the job console,
    with the runner image when no image was found; the template service
    hears only the refusal's kind. When the job is cancelled or its request ends, the token is
    revoked and the hook's container killed and removed before the job ends,
    so no hook writes to the folder afterwards. Toha's `requires` check
    resolves programs on the template service's `PATH`, which agrees with a
    hook's only when the hook runs in Menagerie's own image.
  initialize-command: >-
    devcontainer-builder runs no commands on the host, so the workspace
    service runs `initializeCommand` itself. Before each start or rebuild it
    reads `initializeCommand` from the resolved devcontainer configuration
    and, when present, runs it in throwaway containers with the workspace
    folder as the working directory: a string through `/bin/sh -c`, an
    array as given, and each member of an object in a container of its own,
    in parallel. A failing command fails the job before the devcontainer
    starts.
  local-environment: >-
    A definition reads Menagerie's own environment only through the
    configured `local-env` allowlist, empty by default, so a definition
    cannot copy Menagerie's environment into a devcontainer, a build or a
    Compose project. `${localEnv:...}` substitution and Compose
    interpolation see only the allowed variables, and `initializeCommand`
    gets only them, `PATH` excepted, so its `PATH` is always the runner
    image's own. A refused reference resolves as an unset variable does and
    is named in the job log.
  repository-credentials: >-
    A backup repository's credential is recorded with its registration; the
    decision choose-a-credential-per-backup-repository explains why. It is a
    GitHub App, by the name `github-app` or `github-apps` gives it, or an
    SSH key, by its public key in authorized-keys form with no comment. An
    SSH URL takes a key; an `https` URL that a configured App's server holds
    takes an App that serves it; any other `https` URL takes none and
    pushes without credentials. The operator key that provisioning's
    `operator-key` selects is never a credential, and is not listed. The
    keys to choose from are the ones Wyrwood's `ssh-agent.sock` offers,
    listed from the agent with their comment, which Wyrwood sets to the
    Transit key's name, their fingerprint and their public key, so the
    Wyrwood policy stays the one place that grants a key. A transfer with
    a key dials the agent, finds that key among its signers, and offers the
    Git host that key alone; one listing gives both the signer and the key
    the operator-key check reads, so the agent cannot sign with a key the
    check did not see, and the check reads every name the listing gives
    the key: Wyrwood lists one Transit key once for each identity that
    names it. The key list leaves out the operator key under every name,
    and lists any other key once, with all its names. An agent that no longer offers it fails the
    transfer naming its fingerprint, before any connection. A transfer with
    an App sends that App's contents write token, and fails, naming the
    App, a URL the App does not serve or an App no longer configured. A
    registration from an earlier release has no credential and keeps the
    rule chosen by URL: the first App whose server holds an `https` URL,
    and every key the agent offers for an SSH URL. A manager can change a
    repository's credential; the `credential` and `write` checks run with
    the new one, and it is recorded only after they pass, while the
    repository is still registered at the URL checked. The form starts
    from the saved credential and never swaps it for another unasked: a
    saved key the agent no longer offers, or a saved App that is gone or
    no longer serves the URL, leaves the choice to the manager. App names
    match in any case, as the configuration compares them. A failed write
    check names the credential the Git host refused, by the App's name or
    the key's fingerprint, so a manager can tell which one to fix. The
    agent client makes one request at a time on a connection it cannot
    close, so nothing reads between requests, and each request's deadline
    bounds its own reply: an idle connection never times out. Listing the
    keys, for the key list and the operator-key check, waits 15 seconds; a
    manager waits on it, and Wyrwood fetches each Transit key's public key
    in turn. A transfer's requests have no wait of their own: Menagerie
    cannot tell a stalled agent from a slow one, and Wyrwood looks up every
    identity it offers in OpenBao, each within its own timeout, before it
    signs, so a healthy signature can take minutes. The connection closes
    when its operation ends, so a stalled agent holds an operation only
    until its job's time limit or a cancel, as
    job-without-timeout-blocks-workspace describes for every transfer; a
    registration's write check ends within its own minute.
    The key list fails alone and the Apps still load. An operator-key check
    the agent cannot answer refuses the key, which may be the operator key,
    and each transfer with a key refuses it when the configuration has
    since excluded it, by the agent's listing. A template names its
    credential the same way (see template-credentials). The URL forms and the credential each takes are a
    shared table, docs/specifications/assets/workspace-api/credential-url-cases.json,
    which the service's tests and the picker's both read. The picker is
    never stricter than the service: a URL the service refuses outright,
    marked refused in the table, it may read more loosely, and the
    service's refusal on save explains the URL.
  template-credentials: >-
    A template names its credential as a backup repository does: one
    GitHub App by its configured name, or one SSH key by its public key,
    recorded with the template, or none for a template an earlier release
    registered or the templates key imported, whose URL keeps choosing.
    Registration reads the address through the template service, which
    reaches no network and answers the Git URL a fetch connects to, a `gh:`
    address expanded and an `https` URL without its user name. The
    credential check, the one backup repositories use, runs on that URL
    before any fetch, and with an App it also mints a read token for the
    repository from that App, since a public repository's fetch never asks
    for one and so would never try it; the form offers the credentials that fit it,
    reading the URL through `POST /api/templates/addresses`. Every template
    service request about a registered template names its credential: the
    version listing, the checks, create, upgrade and Apply branch's descent
    check. With an App, each credential request names it, and the route
    mints from that App only, failing the fetch when the App is not
    configured or does not serve the URL. With a key, the template service
    runs the operation inside Toha's `with_ssh_key` scope, so each SSH
    connection of its Toha fetches offers that key alone from the agent,
    once the agent lists it, and Toha refuses an SSH configuration that
    would add another identity, which it reads with `ssh -G`. The version
    listing is not Toha's, because Toha lists no tags, so it pins the key
    itself: the agent must list the key, and `ssh` runs with
    `IdentitiesOnly`, `IdentityFile` and `IdentityAgent`. It skips Toha's
    `ssh -G` check, which Menagerie's image, setting no SSH configuration,
    does not need; [Toha #94](https://github.com/wyrd-company/toha/issues/94)
    would list tags through Toha. A refused fetch names the credential by
    the App's name or the key's fingerprint, as do a refused descent check
    of an upgrade or Apply branch and the Templates screen's line for a
    failed version check. A fetch that the Git host does not ask a
    credential for, a public repository's, offers none: Toha answers
    challenges only, so a public template keeps working after its App is
    removed, and its next credential change refuses that App. A change of a template's
    credential is saved only after its current version, at the commit the
    listing finds for its tag, passes the fetch, read and definition checks
    with it. Its listing is then recorded as the template's version check,
    so a failed check with the earlier credential no longer shows as the
    new one's, and a version check that started with the earlier credential
    records nothing when it ends.
  git-and-credentials: >-
    The workspace repository, a workspace's backup repository (see
    backup-repositories), is a backup, not a synchronized copy. The local
    workspace is the source of truth; the workspace service uses go-git to
    init, commit and force-push the workspace branch, and never pulls it.
    It fetches only on Apply branch, and then only the named branch, into
    a private ref, through a remote it never writes to the workspace's Git
    configuration. Template fetching belongs to Toha. Every credential comes
    through Wyrwood, chosen by the repository's or template's credential, or
    by URL for one an earlier release registered; no key or token is stored
    in the container. An SSH URL uses the SSH agent at Wyrwood's `ssh-agent.sock`,
    mounted from the host consumer directory. The agent offers the Git keys
    the Wyrwood policy grants, OpenBao Transit keys, and with provisioning
    also the operator key, which no Git host accepts. A backup repository
    or template with a key as its credential is offered that key alone (see
    repository-credentials and template-credentials), so each repository
    can have a deploy key of its own. A template and a backup repository
    registered by an earlier release are offered every key, and a Git host
    signs in with the first it knows; for them the agent must offer one Git
    key, which reaches every such repository: a deploy key with write
    access on the backup repository when there is one repository, else the
    SSH key of a machine user with write access on every such backup
    repository and read access on every such private template repository. Toha fetches SSH templates through the same
    agent; its git transport runs the image's ssh client with
    `SSH_AUTH_SOCK` set to Wyrwood's socket. Repositories on GitHub can
    use the GitHub App instead (see github-app), which needs no SSH key and
    no machine user; SSH stays for other hosts.
  github-app: >-
    With `github-app` or `github-apps` configured, an `https` URL on an
    App's server whose path is `/{owner}/{repo}` or `/{owner}/{repo}.git`,
    with no query or fragment, uses a GitHub App installation token instead:
    a backup URL only without user information, a template address with or
    without a user name. A backup repository or template whose credential
    names an App uses that App alone; one registered by an earlier release
    uses the first App whose server holds the URL. Each App mints its own tokens as below. The workspace service is the only minter. It signs the App's
    RS256 JWT, issued 60 seconds in the past and expiring 9 minutes after
    now, with the App's private key, an RSA key in OpenBao's Transit engine,
    through Wyrwood's `vault.sock` with no token of its own. It takes the
    installation from configuration by owner, compared in lower case, or
    asks GitHub for the repository's installation and remembers it until a
    token request finds it gone. It exchanges the JWT for a token scoped to
    that one repository and one contents permission: write for the
    workspace repository, read for a template. Tokens stay in memory until
    five minutes before they expire, and concurrent requests for one
    repository and permission share one exchange. Requests are bounded by
    the job's context only; the API client follows no redirect. Backups,
    commits and Apply branch fetches send the token as HTTP basic
    authentication with the user `x-access-token` and follow no redirect,
    on the same origin or another: go-git picks its HTTP transport from a
    process-wide registry and its client's redirect check is the only hook
    before a hop is sent, so the workspace service installs a transport
    whose check refuses every redirect of a transfer with credentials and
    leaves others to go-git's own policy. The remote's text reaches the job
    console line by line with the URL and the token, raw and in every
    base64 form of its basic-authentication pair, redacted. The
    template service runs each request's Toha work on one worker thread
    inside one Toha credential resolver scope. When an `https` remote of a
    fetch asks for credentials, the resolver asks for the template's token
    on the hook runner socket (see credential-route) and answers that one
    challenge with it. It asks by the URL without user information, so a
    template address with a user name still uses the App; a backup URL with
    one gets no token. The resolver keeps what it handed out. A request
    that fails after it handed out a token replies with a fixed sentence
    for its error kind and no text from Toha, gix or the remote, which can
    echo the token in forms no redaction can list. As a second defence,
    every reply passes one boundary that removes each written form of the
    token, raw, base64 or base64url, escaped or as a byte list, overlapping
    matches included. The
    resolver's credential request races the template service request's
    caller: when the job is cancelled or reaches its limit, the request
    loses its connection and the fetch fails with a fixed reason. A
    generate or apply checks the same signal just before its first write,
    so a fetch that returns later writes nothing to the folder. Every
    failure is a fixed reason, with at most a
    status code: no error carries a token, a JWT, a signature, a URL, a
    response body or a transport error's text. A push or fetch to a remote
    that is not SSH or a local path, a URL go-git cannot read included,
    reports a fixed reason for its credentials and its transfer instead of
    go-git's text, which quotes the URL and the server's answer.
  credential-route: >-
    The hook runner socket also serves the template service's credential
    route, `POST /v1/credentials/github` with the strict body `{"url"}`, an
    `https` URL without user information, and `"githubApp"`, the App a
    template's credential names. For a repository URL on a configured App's
    server it answers, from the named App or else the first such App, 200
    `{"username":"x-access-token", "password"}` with a contents read token
    for that one repository. Without `githubApp`, it answers 404
    `{"reason"}` when no App is configured or the URL is on no App's server,
    and the template service then keeps Toha's default behaviour. It
    answers 502 `{"reason"}` naming the App when the named App is not
    configured or does not serve the URL, so the fetch fails instead of
    going without; and with the fixed reason when no token could be
    minted; 400 `{"reason"}` for a body that is not one URL, and 405 for a
    method other than POST. Any process that can open the socket, which
    only the services' user can, gets read tokens for the repositories the
    App's installations can read.
  authentication: >-
    Every UI request requires an OIDC session. Access requires membership in
    the `menagerie_managers` group claim. Every authenticated user is a
    manager.
  configuration: >-
    Configuration names the workspace root, the
    OIDC issuer and client, the Wyrwood consumer directory, the registry
    credential secrets, the default runner image, the commit schedule, the
    template version schedule, the socket folder, the GitHub App and
    provisioning. Templates, their versions, the backup repositories, the
    policy settings and the selections are Menagerie's data, never
    configuration. Optional
    `template-versions` has `every`, a duration, absent `1h`. Optional
    `provisioning` has `readiness-wait`,
    a duration, absent `2m`; `wyrwood`, with `controller`, the controller's
    SSH address, `host-key`, its pinned host key, `agent`, the name of this
    host's Wyrwood agent, and `operator-key`, the name or public key that
    selects the operator key on `ssh-agent.sock`; and `xolotl`, with `url`,
    `key-secret`, the `kv-mount` and `path` of the secret whose `api_key`
    field holds the scoped key, and `key-policy`, the key policy of this
    host's workspaces' client keys. Its `wyrwood` part is required for any
    declaration, and its `xolotl` part for issuing workspaces' keys.
  templates-key: >-
    `templates`, the list of approved templates of earlier releases, keeps
    its shape and its rules in the schema and in the workspace service's
    parser, which refuses unknown keys, so a file that still has it parses.
    The workspace service reads it only for first-start-import, which takes
    it over once and records that it did, so a later edit of the key imports
    nothing. Every start that finds the key logs one warning that names it
    and says that templates are registered in the interface. The template
    service ignores the members it does not read, and reads nothing of
    `templates`. Its removal from the schema and the workspace service's
    parser is a breaking change of its own (wyrd-company/menagerie#98),
    made only in a release after one that imported the key; a file that
    still has it then fails to parse, and the error names the key.
  workspace-repository-key: >-
    `workspace-repository`, the one backup repository of earlier releases,
    is optional. The workspace service reads it only for import 6 of
    first-start-import, which takes it over once, so a later edit of the key
    imports nothing, and every start that finds the key logs one warning
    that says backup repositories are registered in the interface.
  first-start-import: >-
    Menagerie's data takes over what a host of an earlier release keeps
    elsewhere, with no step by hand. Imports 1 to 4 and 6 each have a mark in the
    data and run, before the workspace service serves, at the first start
    whose schema has them, each in one transaction with its mark; the
    template import waits up to one minute for the template service, which
    reads each address, and a start that does not get it fails, so the
    process supervisor starts the workspace service again. Import 5 runs for each workspace as it says. A start that
    finds no database runs every import, so a lost data volume
    recovers what the workspaces, their definitions, their containers and
    Wyrwood still hold (see menagerie-data-loss). Import 6 runs after
    imports 1 and 2, before the template import.
    1. Workspaces: each workspace folder gets its workspace, as
    workspace-discovery gives one to a folder listed for the first time.
    2. Provisioned names and keys: each workspace holds the names and keys
    its retirement record file names, the name and the key its declaration
    names, a block that is not valid included, and, when its definition
    cannot be read and `provisioning.wyrwood` is configured, the names of
    its containers. A declared name that a container outside the workspace
    holds is not taken. A name or key that two workspaces would hold goes to
    the one whose declaration names it; when both declarations name it, it
    goes to the workspace whose container holds the name, else to the first
    in name order, and the start log names both. The other workspace's next
    provisioning job then fails in `read-definition`, as a name another
    workspace holds. Each imported name is recorded on
    `provisioning.wyrwood.agent`. Without that section, a name is recorded
    with no agent, and the first start that has the section records its
    agent for each; until then a job that would bind or unbind it fails as
    `provisioning-unavailable`, and the name stays in the data. The name
    the declaration names, once it has passed these checks, is the
    workspace's current name, so an apply changes a running workspace's
    binding with no start or rebuild; a name only a retirement record or a
    container names is not current, and `retire` takes it. The folder a
    retirement record names as being removed carries over. The
    retirement record files are removed once the transaction commits.
    3. Templates: an entry whose address the template service refuses, a
    password in it included, is skipped, and the start log names its `id`
    and the refusal kind, never its address; the import goes on. The
    remaining entries that have one source are one template. The newest
    entry whose ref is a version gives the template's current version,
    `id`, name and runner image, and its address is that entry's without the
    ref. Its current version's tag and commit are the ones the first
    version check lists for that version: when the repository has both a
    `v`-prefixed and a plain tag of the version, the listed one, which may
    not be the tag of the entry's ref. A source with no entry whose ref
    is a version, such as one pinned to a branch, a commit or a tag like
    `v1`, is not imported; the start log names its entries' `id`s and says
    that a manager registers the template once its repository has a
    version tag, which joins its workspaces (template-registry), and their
    applied commits then move forward by descent (template-versions). Each workspace
    whose applied record's source is a registered template's joins it.
    4. Applied versions: each workspace with a registered template takes
    its applied version from its applied record by the rule of
    template-versions; a record that gives none leaves it unknown, with the
    record's commit when the record names the template's source and a full
    object id, and the template's next version check completes it. A
    workspace with no registered template takes its applied version when it
    joins one.
    5. Selections and keys: each workspace's Xolotl key identity is the key
    its declaration's `xolotl` member names, taken in one transaction with
    the import's mark, and each workspace whose declaration names a
    container name has its selection to import. Before its first apply or
    provisioning job or selection change, and at each start while any is
    left, Menagerie reads the binding of
    that name and takes its policies and values, with the required policies
    added, as the selection; the binding then holds it or the next apply
    makes it hold it. A binding that Wyrwood does not show, because none
    exists or because the grant hides it, gives the policies and values of
    the declaration's legacy members, and no declaration gives none. A
    hidden binding that the grant later covers then has its policies
    replaced by that selection at the next apply, as
    let-menagerie-decide-each-binding decides; until then binding-convergence
    fails the workspace's jobs as `binding-outside-grant`. The start log names each imported value that is
    not the workspace's name, so an operator sees a workspace whose values
    reach past its own key. While Wyrwood cannot answer, the import waits,
    and a job that would bind or change that workspace's binding fails as
    `provisioning-unavailable`, so no binding is ever changed from a
    selection that was not imported.
    6. Backup repository: the configuration's `workspace-repository`, when
    it is set, is registered with no check, named by its URL's path without
    a leading slash and a `.git` suffix, such as
    `example-org/workspace-backups`, without its query and fragment, or
    `Workspace backups` when that is not a valid name, unless a
    registration has that URL already; every workspace with no backup
    repository then backs up to it. The import runs after the template
    imports, and that start, and no later one, first gives each workspace
    folder with no data its workspace as the workspace list does, joined to
    its template, so it takes the repository too; unlike the list it removes
    nothing, so a workspace whose folder is away keeps its data. The start
    log names it and how many workspaces took it. Without the key the import
    records its mark and registers nothing.
    The policy settings start empty. A workspace that first-start-import
    takes over keeps its access: its binding holds what it held, and its
    key is the one it had.
  deployment: >-
    The Menagerie container mounts the workspace root at the same path as on
    the host, the host Docker socket and the Wyrwood consumer directory,
    and, with workspace sockets, the socket folder at the same path as on
    the host. Menagerie's data volume at `/var/lib/menagerie` holds its
    database, so a backup of the host keeps that volume; the image's
    start-up prepares the private `state` folder in it as it prepares the
    others.
    Throwaway containers need nothing more: the root's host path is their
    bind source, and Menagerie's own image is their default image. Menagerie
    is itself a bound container, with a Docker restart policy, and returns
    after a host restart as container-operations says. Its deployment names
    the consumer directory so that Docker never creates a missing source:
    Docker would create it as root, the start would succeed, and the agent
    rejects a directory owned by another user. So its first install makes the
    directory by hand for the first create, and the agent keeps it from the
    binding on. Its UI is
    not exposed to the public internet. Menagerie is bound to a Wyrwood policy
    that grants only what it uses: the SSH Transit key, signing with the
    GitHub App's Transit key, or both, read access to the registry
    credential secrets, and with provisioning the operator key and read access
    to Xolotl's scoped key. Preparing a host for provisioning means approving
    the operator key once and giving it its grant. Both services trust the certificates
    `SSL_CERT_FILE` names when it is set, so a GitHub Enterprise Server
    signed by a private authority is reachable.
  dependencies: >-
    Toha exposes template resolution, fetching and caching, the address
    grammar and the upgrade driver from its library, takes the hook runner
    from its caller, and records answers in `.toha.json`, whose template
    names the ref it was applied from. Toha lists no tags, so the template
    service lists them with gix, the Git library Toha fetches with.
    Wyrwood's operator protocol has `binding-get`, `binding-list`, `bind`,
    `binding-change` and `unbind`, as Wyrwood's operator-interface design
    states them (its sections binding-change and repeating-a-command):
    `binding-change` names a binding by its ID and the revision read,
    replaces its policies and settings whole, refuses a stale revision with
    `revision-differs`, refuses a selection with no policy, needs a grant
    that covers the binding as it is and every policy it selects, and
    answers `pending` for a change saved at a new revision that OpenBao did
    not apply; a change, or a `bind`, of the selection a binding holds at
    its current revision finishes such an assignment. `binding-get` answers
    `not-found` and `outside-grant` apart, `unbind` by agent and key answers
    a binding that does not exist with success and one outside the grant
    with `outside-grant`, and Wyrwood records every refused change with the
    key. Menagerie needs the Wyrwood release that has `binding-change`.
  verification: >-
    The acceptance scenario uses a test template with a hook and an
    `initializeCommand`. A manager signs in, creates a workspace, sees it
    running in the list, stops and starts it, rebuilds it, and upgrades it to
    a newer template version that adds one question. Only that question is
    asked, and the pushed branch contains the upgraded files. A container not
    created by Menagerie never appears in the list. A hook and an
    `initializeCommand` that look for the Docker socket, the SSH agent or
    Menagerie's environment find none of them, and still write into the
    workspace folder. A test devcontainer writes a file and calls
    `workspace-commit` through its mounted socket, and the file is on the
    workspace's backup branch; a scheduled sweep does the same for a
    workspace left dirty. `initializeCommand` finds no workspace socket.
    A commit pushed on top of a workspace's branch is applied with Apply
    branch: the folder has it, the devcontainer is rebuilt, and the next
    backup keeps it. With a GitHub App as its only Git identity, its key
    imported into OpenBao Transit and no SSH key, Menagerie creates a
    workspace from a private `https` template and backs it up; the Git host
    sees only installation tokens, read for the template and write for the
    backup, and no job event, log line or reply holds a token or a JWT.
    On a prepared host, a manager creates a workspace from a template with a
    declaration, with no CLI, Wyrwood or Xolotl web interface step, and its
    services reach OpenBao, SSH signing and Xolotl on the first start. A
    create stopped at each step and retried with start issues no second key
    and no second binding. A wrong access group fails with a clear job error.
    After a host restart the workspace and Menagerie return with no
    host-specific unit. A rebuild keeps the binding and its sockets, and an
    upgrade that changes a declaration's container name replaces the
    binding. Delete leaves no binding and no live client key, and a
    delete stopped at each step can be retried. A workspace that holds no
    name and no key calls neither Wyrwood's operator
    interface nor Xolotl. An upgrade that fails after changing a declaration,
    then a second such upgrade, then a stop and a start retires both old names,
    and an upgrade that removes the declaration retires the names and the
    key at its end. A workspace whose definition was edited so that it does
    not parse, with its binding and key present, is deleted with both
    removed.
    A manager registers template X, whose newest tag is `1.0.0`, and creates
    workspace W from it; W shows `1.0.0` applied. The repository gets the tag
    `1.1.0`, and with no restart the templates screen shows it. The manager
    upgrades X to `1.1.0`; W shows `1.0.0` applied and that it needs an
    upgrade, and applying it shows `1.1.0` with no upgrade needed. A
    template without `.devcontainer/devcontainer.json` is refused naming
    that file, a template W uses cannot be removed, and a folder, `file://`
    or registry-name address is refused before any fetch.
    With `workspace` and `xolotl-client-key` required and a multi-select
    group holding `bob-ssh` and `ira-ssh`, a create of W with no choice in
    the group is refused, and one with `bob-ssh` binds the three. Adding
    `ira-ssh` to W changes its binding to all four with no rebuild, while
    its container keeps its sockets; a new version of W's template leaves
    them as they are, and a template that still declares policies has them
    ignored and named in the console. A policy outside the grant is refused,
    naming it, before any job runs.
    A host of the previous release, with templates in its configuration and
    provisioned workspaces, starts with the templates registered, each
    workspace's selection taken from its binding and each key as it was, and
    a delete of each workspace removes its binding and key.
    A binding that a policy outside the grant hides is not taken for a
    removed one: the delete fails, naming it, and keeps its record. A change
    that Wyrwood saves and OpenBao does not apply is not recorded as
    applied, and the next apply finishes it. Removing a bound workspace's
    last policy sends the empty selection, and Wyrwood's refusal is shown
    as the apply's `binding-refused` failure while the binding keeps its
    policies. A workspace whose create waits for answers stays
    in Menagerie's data while the list is refreshed. An unbound workspace
    gives up its last ordinary policy, and its apply succeeds without a
    binding request to Wyrwood. A binding an operator removed and made again under
    the workspace's name is found by its name and converged on. On a host
    taken over from the previous release, adding a policy to a workspace
    that runs changes its binding at once, with no start or rebuild.
    Removing a policy from a running workspace whose definition was edited
    so that it does not parse changes its binding and keeps its access
    group; with that binding removed in Wyrwood, the apply fails as
    `provisioning-invalid` and binds nothing.
    A start whose definition no longer declares provisioning retires the
    binding at its end, and one whose declaration does not parse fails in
    `read-definition` with the binding in place. A selection
    change made before a workspace's selection was imported is refused as
    stale once the import runs, and refused while Wyrwood cannot answer. Apply branch refuses a
    branch whose applied record names an older version. An address with a
    password is refused without being stored, shown or logged. A version
    check while the template service is down answers the template with the
    failure recorded.
  user-documentation: >-
    The public pages describe what a manager and an operator do, each part
    written by the task that builds it. `docs/user/usage.md` gains a
    "Templates" section: registering a template, the checks registration
    runs and the message that names each, upgrading a template to a newer
    version, and removing one, which a workspace's use refuses (task 20);
    the version checks, their schedule, a failed check and a moved tag
    (task 21). It gains a "Policies" section: the policies inside the
    operator key's grant, required policies and policy groups (task 22); a
    workspace's policies, applying a change, a pending or failed apply,
    what Wyrwood answers to a selection with no policy, and a Wyrwood-side
    edit being
    replaced (task 24). Its existing sections change too: "The workspace
    list" shows the template, the applied version, an unknown version and
    whether an upgrade is needed (task 21), the groups that need a choice
    (task 22), whether the binding has its selection (task 24), and
    `no-folder` (task 19); "Create a workspace" picks a registered template
    (task 20) and the policy choices (task 24); "Upgrade a workspace"
    applies the template's current version and when it is refused (task
    21), and leaves policies as they are (task 24); "Apply a reviewed
    branch" refuses an older applied record, and any change to the applied
    record of a workspace with no registered template (task 21); "Delete a workspace"
    removes what Menagerie's data holds, also for a definition that does not
    parse, and fails on a binding outside the grant (task 19).
    `docs/user/configuration.md` "Runner images" says that a template's
    runner image is set when it is registered and edited in the interface
    (task 20); "Templates" keeps the address forms and
    credentials a registration takes, refuses a password in an address,
    and describes the `templates` key's one import, its warning, skipped
    entries and how their templates are registered (task 20), and
    `template-versions` (task 21); "Xolotl" gains `key-policy` (task 24);
    "Wyrwood operator key" says that the grant's policies are what managers
    choose from (task 22). `docs/user/install.md` "Provisioning" gains the
    key policy setting, `MENAGERIE_XOLOTL_KEY` and the Wyrwood release with
    `binding-change` (task 24); "Upgrades" says that the first start after
    an upgrade imports templates (task 20) and provisioning records (task
    19), and that the data volume belongs in the host's backup (task 19).
