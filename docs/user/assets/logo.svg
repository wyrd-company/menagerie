    <rect x="758" y="616" width="98" height="46" rx="14" fill="#01204a"/>
    <rect x="790" y="640" width="22" height="12" rx="3" fill="#f97314"/>
    <rect x="818" y="690" width="58" height="48" rx="10" fill="#01204a"/>
    <rect x="834" y="703" width="26" height="22" rx="3" fill="#f97314"/>
