    <path id="arm-lower" d="M805 300L955 398" stroke="#01204a" stroke-width="72"/>
    <path d="M805 300L955 398" stroke="#93a0b6" stroke-width="44"/>
    <path id="arm-upper" d="M805 300L880 190L958 218" stroke="#01204a" stroke-width="44"/>
    <path d="M818 280L880 192L950 216" stroke="#4a6283" stroke-width="16"/>
    <path id="claw" d="M972 182L1040 228L1040 290M960 250L1000 280L1030 318" stroke="#01204a" stroke-width="28"/>
