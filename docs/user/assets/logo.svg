      <polygon points="347,773 401,791 401,1047 347,1024"/>
      <polygon points="437,802 492,820 492,1085 437,1062"/>
      <polygon points="530,832 588,850 588,1125 530,1101"/>
      <polygon points="662,848 716,832 716,1103 662,1125"/>
      <polygon points="752,820 806,803 806,1066 752,1088"/>
      <polygon points="842,792 896,775 896,1029 842,1051"/>
      <polygon points="932,764 990,746 990,990 932,1014"/>
    </g>
