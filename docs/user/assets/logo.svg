    <rect id="tower-shape" x="600" y="215" width="155" height="360" rx="18"/>
    <rect id="block-shape" x="522" y="358" width="100" height="120" rx="14"/>
    <rect id="back-box-shape" x="378" y="420" width="212" height="150" rx="18"/>
    <g id="cartridge-shape" transform="rotate(-15 300 530)">
      <rect x="232" y="392" width="136" height="80" rx="20"/>
      <rect x="248" y="460" width="104" height="205" rx="14"/>
    </g>
    <g id="camera-shape">
