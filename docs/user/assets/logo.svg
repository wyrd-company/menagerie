    <rect id="front-box-body" x="385" y="580" width="330" height="225" rx="24" fill="#d4dae3" stroke="#01204a" stroke-width="14"/>
    <rect x="612" y="590" width="94" height="206" rx="14" fill="#93a0b6"/>
    <rect id="front-box-lid" x="395" y="545" width="312" height="70" rx="22" fill="#93a0b6" stroke="#01204a" stroke-width="14"/>
    <rect x="420" y="560" width="160" height="16" rx="8" fill="#d4dae3"/>
    <rect id="front-box-panel" x="425" y="655" width="172" height="125" rx="12" fill="#01204a"/>
    <rect id="front-box-strap" x="478" y="612" width="24" height="58" fill="#f97314"/>
