# ---
# relationships:
#   publishes-to: wyrd-foo
#   references: [ README, menagerie ]
# ---
schemaVersion: 1
assets:
  - assets/demo.gif
  - assets/list.png
  - assets/create-interview.png
  - assets/upgrade-interview.png
  - assets/provisioning-console.png
  - assets/t3-code-token.png
  - assets/delete-workspace.png
  - assets/logo.svg
  - assets/social-image.png
products:
  menagerie:
    name: menagerie
    version: 0.4.2
    docs-version: 0.2.4
    tagline: Manage workspaces and fleets of development containers through a web UI.
    blurb: >-
      One container that creates workspaces from Toha templates through their
      interviews, provisions the Wyrwood binding and Xolotl key a template
      declares, shows every workspace with its devcontainer, starts, stops,
      rebuilds, upgrades and deletes them, and backs each one up to its own Git
      branch. Managers sign in through OpenID Connect; Wyrwood supplies its SSH
      key and registry credentials.
    status: preview
    category: Dev Containers
    order: 10
    logo: assets/logo.svg
    social-image: assets/social-image.png
    nav:
      - section: Guide
        groups:
          - group: Start
            pages: [overview, install]
          - group: Operate
            pages: [configuration, usage, troubleshooting]
    highlights:
      - >-
        Creates a workspace from a Toha template through its interview in the
        browser. When the template declares what it needs and the host is
        prepared, the job issues its Xolotl key and makes its Wyrwood binding, so
        the container has its credentials on its first start, with no step in a
        CLI or another web interface.
      - >-
        Lists every workspace with the state of its devcontainer, starts, stops
        and rebuilds it as a job with a live console, and mints a T3 Code pairing
        token for a running workspace that has the t3code-server Feature.
      - >-
        Upgrades a workspace to a newer template version, asks only the new
        questions and keeps local edits.
      - >-
        Deletes a workspace after you type its name: backs it up, then removes
        its binding, Xolotl key, containers and folder. Its backup branch stays.
      - >-
        Backs up each workspace to its own branch in one Git repository after
        each job that changes it, and can commit and back it up on a schedule.
      - >-
        Runs as one container with no database. Managers sign in through your
        OpenID Connect provider; Git private keys stay in OpenBao and signing
        uses Wyrwood.
    media:
      - src: assets/demo.gif
        caption: >-
          Creating a provisioned workspace, minting a T3 Code pairing token,
          upgrading and deleting. An earlier job built the image, so this create
          reads the build cache.
        alt: >-
          Recording of the Menagerie web UI: a template interview creates a
          workspace, the job console passes issue-key, bind, wait-for-sockets
          and verify, the row mints a T3 Code token with its text hidden, an
          upgrade asks one question, and a typed name deletes the workspace.
      - src: assets/provisioning-console.png
        caption: A create job that provisioned the workspace's credentials.
        alt: >-
          The job console of a completed create, with the phases issue-key, bind,
          create-container, wait-for-sockets, up and verify, and a log line from
          the template's check that the sockets work.
      - src: assets/list.png
        caption: The workspace list with the state of each devcontainer.
        alt: >-
          The Menagerie workspace list with one stopped and two running
          workspaces, each with its actions, above the list of jobs.
      - src: assets/create-interview.png
        caption: A template interview that creates a workspace.
        alt: The create-workspace form showing a template's interview questions.
      - src: assets/upgrade-interview.png
        caption: An upgrade that asks one new question.
        alt: The upgrade form asking only the question the newer template added.
      - src: assets/t3-code-token.png
        caption: A T3 Code pairing token on its row. This image hides the token's text.
        alt: >-
          A workspace row with the time the pairing token ends, a blank block in
          place of the token, and Copy and Dismiss buttons.
      - src: assets/delete-workspace.png
        caption: Delete asks for the workspace's name.
        alt: >-
          A workspace row with the delete form open, the workspace's name typed
          and the Delete workspace button enabled.
    kinds:
      - kind: app
        install:
          - method: docker
            default: true
            command: docker pull ghcr.io/wyrd-company/menagerie:0.4.0
