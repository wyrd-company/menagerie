$schema: https://refinery.systems/ontology/assumption
relationships:
  related-to:
    - menagerie
    - apply-workspace-policies-from-a-stored-selection
description: >-
  The operator protocol's binding change (wyrd-company/wyrwood#159) takes a
  binding's whole selection and settings with the binding revision the
  caller read. Wyrwood refuses it, changing nothing, when the binding
  changed after that read, and the public operator package gives the
  refusal a sentinel error of its own. It needs `bind` inside the grant for
  every selected policy, and Wyrwood applies an accepted change as an edit
  in its web interface: the container's token is replaced, and its consumer
  directory and sockets stay. A binding then reports `applied` once OpenBao
  has the change.
end-descendant-type: specification
evidence:
  - wyrd-company/wyrwood#159 asks for the operation to behave as an edit in the web interface, "with the same behavior for a change that races another".
  - "Wyrwood's composable-policy-bindings design: ChangeBinding replaces the complete membership and settings atomically, takes the expected binding revision, and answers a stale edit with a conflict rather than overwriting a concurrent change."
  - "Wyrwood's operator package already gives each binding a `revision` and an `applied` flag (operator/types.go, Binding)."
  - Not yet proven. Wyrwood's operator protocol specification states the operation once wyrwood#159 merges, and this assumption is then checked against it.
