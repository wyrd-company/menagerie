<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Workspaces · Menagerie</title>
    <link rel="stylesheet" href="incumbent.css" />
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-weight: 100 900;
        font-display: swap;
        src: url(inter.woff2) format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono Variable";
        font-weight: 100 800;
        font-display: swap;
        src: url(jetbrains-mono.woff2) format("woff2");
      }
      :root {
        --text-faint: var(--text-muted);
      }
      .mockup-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px dashed var(--border-strong);
        font-size: 14px;
        color: var(--text-muted);
      }
      select {
        font: inherit;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        padding: 8px;
        max-width: 100%;
        min-height: 36px;
      }
      .mockup-tools select {
        max-width: min(100%, 380px);
        flex: 1;
      }
      .mockup-tools button {
        margin-left: auto;
      }
      .masthead {
        gap: 24px;
      }
      .masthead nav {
        flex-wrap: wrap;
      }
      .masthead nav a {
        padding-inline: 12px;
      }
      .signout {
        color: var(--text-muted);
        font-size: 14px;
      }
      h2 {
        font-size: 18px;
      }
      h3 {
        font-size: 16px;
      }
      .stack {
        display: grid;
        gap: 24px;
      }
      .compact {
        gap: 12px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        display: grid;
        gap: 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .row-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      label.choice-line {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        cursor: pointer;
      }
      .choice-line small {
        color: var(--text-muted);
        margin-left: 4px;
      }
      .choices-list {
        display: grid;
        gap: 4px;
      }
      fieldset {
        min-width: 0;
        border: 0;
        padding: 0;
        margin: 0;
      }
      legend {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .rule {
        border-top: 1px solid var(--border);
        padding-top: 20px;
      }
      .help {
        color: var(--text-muted);
        font-size: 14px;
      }
      .error {
        color: var(--danger);
        font-size: 14px;
      }
      .success {
        color: var(--ok);
        font-size: 14px;
      }
      .warning {
        color: var(--warn);
        font-size: 14px;
      }
      .error:empty,
      .success:empty {
        display: none;
      }
      .entry .entry-name h2 {
        font-size: 15px;
      }
      .entry {
        grid-template-columns: minmax(10rem, 1.2fr) minmax(10rem, 1fr) minmax(
            17rem,
            1.5fr
          );
        grid-template-areas: "name state actions" "policies policies policies" "error error error";
      }
      .entry-name .help {
        margin-top: 4px;
      }
      .entry-state {
        font-size: 14px;
      }
      .entry-actions {
        max-width: 480px;
      }
      .policy-panel {
        grid-area: policies;
        margin-top: 16px;
        border-top: 1px solid var(--border);
        padding: 20px 0 8px;
        display: grid;
        gap: 24px;
      }
      .policy-columns {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }
      .policy-columns legend .help {
        display: block;
        margin-top: 4px;
        font-weight: 400;
      }
      .policy-columns legend {
        font-size: 15px;
      }
      .status-warn {
        --status: var(--warn);
        --status-wash: var(--warn-wash);
      }
      .inline-status {
        font-size: 14px;
      }
      .template-entry {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto;
        gap: 20px;
        padding: 20px;
        border-bottom: 1px solid var(--border);
        align-items: start;
      }
      .template-entry:last-child {
        border: 0;
      }
      .template-entry h2 {
        font-size: 16px;
      }
      .template-entry .help {
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .template-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 280px;
      }
      .template-versions {
        font-size: 14px;
        display: grid;
        gap: 6px;
      }
      .template-edit {
        grid-column: 1/-1;
        display: grid;
        gap: 16px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      .policy-settings-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 24px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .policy-settings-row:last-child {
        border: 0;
      }
      .group-editor {
        display: grid;
        gap: 16px;
        border-top: 1px solid var(--border);
        padding-top: 20px;
      }
      .group-head {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(140px, 1fr) auto;
        gap: 12px;
        align-items: end;
      }
      .group-head label {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }
      .group-options {
        display: flex;
        gap: 12px 24px;
        flex-wrap: wrap;
      }
      .field input {
        max-width: 640px;
      }
      .phase-rail {
        font-size: 13px;
      }
      .tape-lines {
        max-height: none;
        min-height: 0;
      }
      .tape-lines li {
        grid-template-columns: 2.5rem 1fr;
        font-size: 13px;
      }
      .interview-actions {
        margin-top: 4px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        max-width: calc(100% - 40px);
        padding: 12px 20px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        z-index: 10;
      }
      .toast:empty {
        display: none;
      }
      @media (max-width: 1050px) {
        .entry {
          grid-template-columns: 1fr 1fr;
          grid-template-areas: "name state" "actions actions" "policies policies" "error error";
        }
        .entry-actions {
          justify-content: start;
          max-width: none;
        }
        .template-entry {
          grid-template-columns: 1fr 1fr;
        }
        .template-actions {
          grid-column: 1/-1;
          max-width: none;
        }
      }
      @media (max-width: 720px) {
        .masthead {
          gap: 8px;
        }
        .masthead nav {
          gap: 0;
        }
        .masthead nav a {
          padding: 12px 8px;
          font-size: 14px;
        }
        .policy-columns {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 16px;
        }
        .template-entry {
          grid-template-columns: 1fr;
        }
        .template-actions {
          grid-column: auto;
        }
        .group-head {
          grid-template-columns: 1fr;
        }
        .group-head button {
          justify-self: start;
        }
        .policy-settings-row {
          gap: 12px;
          grid-template-columns: 1fr auto;
        }
        .policy-settings-row .scope {
          grid-column: 1/-1;
        }
        .entry {
          grid-template-columns: minmax(0, 1fr) auto;
        }
        .mockup-tools {
          align-items: start;
        }
        .mockup-tools label {
          padding-top: 6px;
        }
        .mockup-tools button {
          min-height: 36px;
        }
        .signout {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <a class="skip" href="#main">Skip to content</a>
      <div class="mockup-tools" aria-label="Mockup controls">
        <label for="scene">Mockup</label
        ><select id="scene" aria-label="Mockup state"></select
        ><button id="reset" class="ghost">Reset</button>
      </div>
      <header class="masthead">
        <a href="#workspaces" class="wordmark"
          ><img
            class="wordmark-mark"
            src="mark.svg"
            alt=""
            width="28"
            height="28"
          /><span class="wordmark-name">Menagerie</span></a
        >
        <nav aria-label="Main">
          <a href="#workspaces">Workspaces</a><a href="#new">New workspace</a
          ><a href="#templates">Templates</a><a href="#policies">Policies</a>
        </nav>
        <span class="signout">boblangley</span>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script>
      "use strict";
      // Deterministic review fixtures only. No network, credentials or product APIs.
      const scenes = [
        ["workspaces", "Workspaces · versions and states"],
        ["workspaces/needs-upgrade", "Workspaces · needs upgrade"],
        ["workspaces/needs-choice", "Workspaces · groups need a choice"],
        ["workspaces/outside-grant", "Workspaces · policy outside grant"],
        ["workspaces/pending", "Workspaces · apply pending"],
        ["workspaces/failed", "Workspaces · apply failed"],
        [
          "workspaces/empty-refused",
          "Workspaces · empty selection refused by Wyrwood",
        ],
        [
          "workspaces/empty-unbound",
          "Workspaces · empty selection, no binding",
        ],
        ["new", "Create · policy choices"],
        ["new/refused", "Create · group choice refused"],
        ["new/outside-grant", "Create · policy outside grant refused"],
        ["new/interview", "Create · template interview"],
        ["new/done", "Create · completed"],
        ["templates", "Templates · registered"],
        ["templates/register", "Templates · register"],
        ["templates/refused", "Templates · missing definition"],
        ["templates/address-refused", "Templates · address refused"],
        ["templates/newer", "Templates · newer version available"],
        ["templates/checking", "Templates · checking versions"],
        ["templates/check-failed", "Templates · failed check"],
        ["templates/moved", "Templates · moved tag"],
        ["templates/remove-refused", "Templates · removal refused"],
        ["templates/empty", "Templates · empty registry"],
        ["upgrade/sample-space", "Upgrade · current template version"],
        ["upgrade/sample-space/interview", "Upgrade · new question"],
        ["upgrade/sample-space/done", "Upgrade · completed"],
        ["upgrade/sample-space/refused", "Upgrade · moved tag refused"],
        ["policies", "Policies · required and groups"],
        ["policies/outside-grant", "Policies · outside grant"],
        ["policies/new-group", "Policies · add a group"],
        ["policies/empty", "Policies · no required policies or groups"],
      ];
      const $ = (s, root = document) => root.querySelector(s);
      const $$ = (s, root = document) => [...root.querySelectorAll(s)];
      const esc = (x) =>
        String(x ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const btn = (label, action, cls = "", extra = "") =>
        `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
      const status = (text, kind = "") =>
        `<span class="status status-${kind}">${esc(text)}</span>`;
      const allPolicies = [
        "workspace",
        "xolotl-client-key",
        "bob-ssh",
        "ira-ssh",
        "development",
        "production",
        "registry-read",
        "legacy-admin",
      ];
      let settingsDraft = null;
      let reanswer = false;
      let data,
        route = "",
        openPanel = null,
        registerOpen = false,
        registerValidated = false,
        registerError = "",
        templateEdit = null,
        groupDraft = null,
        newDraft,
        policyDrafts = {},
        applyOutcome = "applied",
        toastTimer;
      function seed() {
        data = {
          templates: [
            {
              id: "workspace",
              name: "Workspace",
              address: "https://github.com/example/workspace-template",
              current: "1.0.0",
              newest: "1.0.0",
              check: "Checked just now",
              moved: false,
            },
            {
              id: "notes",
              name: "Notes",
              address: "https://github.com/example/notes-template",
              current: "1.0.0",
              newest: "1.0.0",
              check: "Checked 12 minutes ago",
              moved: false,
            },
          ],
          required: ["workspace", "xolotl-client-key"],
          groups: [
            {
              name: "Operator SSH",
              mode: "multi",
              members: ["bob-ssh", "ira-ssh"],
            },
            {
              name: "Environment",
              mode: "single",
              members: ["development", "production"],
            },
          ],
          outside: [],
          workspaces: [
            {
              name: "sample-space",
              state: "Running",
              version: "1.0.0",
              template: "workspace",
              selection: [
                "workspace",
                "xolotl-client-key",
                "bob-ssh",
                "development",
              ],
              applied: [
                "workspace",
                "xolotl-client-key",
                "bob-ssh",
                "development",
              ],
              apply: "applied",
            },
            {
              name: "sample-notes",
              state: "Stopped",
              version: "Unknown version",
              template: "workspace",
              selection: [
                "workspace",
                "xolotl-client-key",
                "bob-ssh",
                "development",
              ],
              apply: "applied",
            },
            {
              name: "sample-tools",
              state: "No container",
              version: "1.0.0",
              template: "workspace",
              selection: [
                "workspace",
                "xolotl-client-key",
                "ira-ssh",
                "development",
              ],
              apply: "applied",
            },
            {
              name: "sample-archive",
              state: "No folder",
              version: "1.0.0",
              template: "workspace",
              selection: [
                "workspace",
                "xolotl-client-key",
                "bob-ssh",
                "development",
              ],
              apply: "applied",
            },
          ],
          jobs: [],
        };
        openPanel = null;
        reanswer = false;
        registerOpen = false;
        registerValidated = false;
        registerError = "";
        templateEdit = null;
        groupDraft = null;
        policyDrafts = {};
        settingsDraft = null;
        applyOutcome = "applied";
        newDraft = {
          name: "sample-new",
          template: "workspace",
          selection: [...data.required],
          error: "",
        };
      }
      function fixture(path) {
        seed();
        const t = data.templates[0],
          w = data.workspaces[0];
        if (path === "templates/register") registerOpen = true;
        if (path === "templates/refused") {
          registerOpen = true;
          registerError =
            "Definition check failed: .devcontainer/devcontainer.json is missing.";
        }
        if (path === "templates/address-refused") {
          registerOpen = true;
          registerError =
            "Address check failed: use a Git repository address. Local folders and file:// addresses are not supported.";
        }
        if (path === "templates/newer") {
          t.newest = "1.1.0";
          templateEdit = "workspace";
        }
        if (path === "templates/checking") t.check = "Checking versions…";
        if (path === "templates/check-failed") {
          t.newest = "1.1.0";
          t.check =
            "Check failed just now: template service is unavailable. Previously found versions are kept.";
        }
        if (path === "templates/moved") {
          t.moved = true;
          t.check = "Checked just now";
          templateEdit = "workspace";
        }
        if (path === "templates/remove-refused")
          t.removeError =
            "Cannot remove Workspace: used by sample-space, sample-notes, sample-tools and sample-archive.";
        if (path === "templates/empty") data.templates = [];
        if (path.startsWith("upgrade/")) t.current = t.newest = "1.1.0";
        if (path.endsWith("/refused") && path.startsWith("upgrade/"))
          t.moved = true;
        if (path.endsWith("/done") && path.startsWith("upgrade/")) {
          w.version = "1.1.0";
          w.selection.push("ira-ssh");
          w.applied = [...w.selection];
        }
        if (path === "new/refused")
          newDraft.error =
            "Choose at least one policy in Operator SSH. Choose exactly one policy in Environment.";
        if (path === "new/outside-grant") {
          data.outside = ["registry-read"];
          newDraft.selection.push("registry-read", "bob-ssh", "development");
          newDraft.error =
            "registry-read is outside the operator key’s grant. No job was started.";
        }
        if (path === "new/interview" || path === "new/done")
          newDraft.selection.push("bob-ssh", "development");
        if (path === "new/done") {
          data.workspaces.push({
            name: newDraft.name,
            state: "Running",
            version: "1.0.0",
            template: "workspace",
            selection: [...newDraft.selection],
            apply: "applied",
          });
        }
        if (path === "workspaces/needs-upgrade") t.current = t.newest = "1.1.0";
        if (path === "workspaces/needs-choice") {
          w.selection = w.selection.filter((p) => p !== "development");
          openPanel = w.name;
        }
        if (path === "workspaces/outside-grant") {
          data.outside = ["legacy-admin"];
          w.selection.push("legacy-admin");
          w.apply = "failed";
          w.failure =
            "legacy-admin is outside the operator key’s grant. Remove it or update the grant in Wyrwood.";
          openPanel = w.name;
        }
        if (path === "workspaces/pending") {
          w.selection.push("ira-ssh");
          w.apply = "pending";
          w.failure =
            "Wyrwood saved the change, but OpenBao has not applied it. Apply again to finish.";
          openPanel = w.name;
        }
        if (path === "workspaces/failed") {
          w.selection.push("ira-ssh");
          w.apply = "failed";
          w.failure =
            "Wyrwood could not be reached. Your selection is saved. Apply again.";
          openPanel = w.name;
        }
        if (path === "workspaces/empty-refused") {
          data.required = [];
          data.groups = [];
          w.selection = [];
          w.apply = "failed";
          w.failure =
            "Wyrwood refused the change: a binding needs at least one policy. Your empty selection is saved; the binding still has workspace, xolotl-client-key, bob-ssh and development.";
          openPanel = w.name;
        }
        if (path === "workspaces/empty-unbound") {
          data.required = [];
          data.groups = [];
          w.selection = [];
          w.applied = [];
          w.apply = "applied";
          w.unbound = true;
          openPanel = w.name;
        }
        if (path === "policies/outside-grant") {
          data.outside = ["legacy-admin"];
          data.required.push("legacy-admin");
        }
        if (path === "policies/new-group")
          groupDraft = { name: "", mode: "multi", members: [] };
        if (path === "policies/empty") {
          data.required = [];
          data.groups = [];
        }
        route = path;
        render();
      }
      function toast(message) {
        $("#toast").textContent = message;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($("#toast").textContent = ""), 4000);
      }
      function go(path) {
        if (location.hash.slice(1) === path) {
          route = path;
          render(true);
        } else location.hash = path;
      }
      function template(id) {
        return data.templates.find((t) => t.id === id);
      }
      function workspace(name) {
        return data.workspaces.find((w) => w.name === name);
      }
      function missingGroups(selection) {
        return data.groups.filter(
          (g) => !g.members.some((p) => selection.includes(p)),
        );
      }
      function choiceErrors(selection, creating = false, previous = []) {
        const errors = [];
        for (const p of selection)
          if (data.outside.includes(p) && !previous.includes(p))
            errors.push(
              `${p} is outside the operator key’s grant. No job was started.`,
            );
        for (const g of data.groups) {
          const count = g.members.filter((p) => selection.includes(p)).length,
            had = g.members.some((p) => previous.includes(p));
          if ((creating || had) && count === 0)
            errors.push(
              `Choose ${g.mode === "single" ? "exactly" : "at least"} one policy in ${g.name}.`,
            );
          if (g.mode === "single" && count > 1)
            errors.push(`Choose exactly one policy in ${g.name}.`);
        }
        return errors.join(" ");
      }
      function policyControls(selection, context, disabled = false) {
        const line = (p, kind = "", group = "") =>
          `<label class="choice-line"><input type="${kind === "single" ? "radio" : "checkbox"}" name="${esc(context + "-" + group)}" value="${esc(p)}" data-policy="${esc(p)}" data-context="${esc(context)}" ${selection.includes(p) ? "checked" : ""} ${disabled || kind === "required" || (data.outside.includes(p) && !selection.includes(p)) ? "disabled" : ""}><span class="mono">${esc(p)}</span>${kind === "required" ? "<small>Required</small>" : ""}${data.outside.includes(p) ? '<small class="error">Outside grant</small>' : ""}</label>`;
        const used = [
          ...data.required,
          ...data.groups.flatMap((g) => g.members),
        ];
        const ordinary = allPolicies.filter(
          (p) =>
            !used.includes(p) &&
            (!data.outside.includes(p) || selection.includes(p)),
        );
        return `<div class="policy-columns">${data.required.length ? `<fieldset><legend>Required</legend>${data.required.map((p) => line(p, "required")).join("")}</fieldset>` : ""}${data.groups.map((g) => `<fieldset><legend>${esc(g.name)} <span class="help">${g.mode === "single" ? "Choose one" : "Choose at least one"}</span></legend><div class="choices-list">${g.members.map((p) => line(p, g.mode, g.name)).join("")}</div>${!g.members.some((p) => selection.includes(p)) && context !== "new" ? '<p class="warning">Needs a choice</p>' : ""}</fieldset>`).join("")}${ordinary.length ? `<fieldset><legend>Other policies</legend><div class="choices-list">${ordinary.map((p) => line(p)).join("")}</div></fieldset>` : ""}</div>`;
      }
      function pageHead(title, actions = "", crumb = "") {
        return `<header class="screen-head"><div>${crumb ? `<p class="eyebrow">${crumb}</p>` : ""}<h1>${title}</h1></div><div class="screen-actions">${actions}</div></header>`;
      }
      function render(focus = false) {
        const root = route.split("/")[0] || "workspaces";
        $$("nav a").forEach((a) =>
          a.setAttribute(
            "aria-current",
            a.hash.slice(1) === root ? "page" : "false",
          ),
        );
        $("#scene").value = scenes.some((s) => s[0] === route) ? route : "";
        document.title = `${{ workspaces: "Workspaces", new: "New workspace", upgrade: "Upgrade", templates: "Templates", policies: "Policies" }[root] || "Workspaces"} · Menagerie`;
        $("#main").innerHTML =
          root === "templates"
            ? renderTemplates()
            : root === "policies"

          readSettingsDraft();
          if (b.dataset.index === "new") groupDraft = null;
          else settingsDraft.groups.splice(Number(b.dataset.index), 1);
          render();
          $("#settings-draft").textContent = "Unsaved changes";
        }
      });
      function readSettingsDraft() {
        const groups = $$("[data-group]")
          .filter((el) => el.dataset.group !== "new")
          .map((el) => ({
            name: $("[data-group-name]", el).value,
            mode: $("[data-group-mode]", el).value,
            members: $$("[data-group-member]:checked", el).map(
              (x) => x.dataset.groupMember,
            ),
          }));
        settingsDraft = {
          required: $$("[data-required]:checked").map(
            (x) => x.dataset.required,
          ),
          groups,
        };
        const fresh = $('[data-group="new"]');
        if (fresh)
          groupDraft = {
            name: $("[data-group-name]", fresh).value,
            mode: $("[data-group-mode]", fresh).value,
            members: $$("[data-group-member]:checked", fresh).map(
              (x) => x.dataset.groupMember,
            ),
          };
      }
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target;
        if (f.id === "register-form") {
          return;
        }
        if (f.id === "create-form") {
          newDraft.name = $("#workspace-name").value.trim();
          const t = template(newDraft.template);
          newDraft.error = choiceErrors(newDraft.selection, true);
          if (!t) newDraft.error = "Choose a registered template.";
          else if (t.moved)
            newDraft.error =
              "The current tag moved. Validate and save it on Templates first.";
          if (data.workspaces.some((w) => w.name === newDraft.name))
            newDraft.error =
              "A workspace named " + newDraft.name + " already exists.";
          if (newDraft.error) {
            $("#create-error").textContent = newDraft.error;
            return;
          }
          go("new/interview");
        }
        if (f.id === "upgrade-form") {
          reanswer = $("#reanswer").checked;
          go("upgrade/" + f.dataset.name + "/interview");
        }
        if (f.id === "interview-form") {
          if (f.dataset.upgrade === "true") {
            const w = workspace(f.dataset.name);
            w.version = template(w.template).current;
            data.jobs.unshift(w.name + " upgrade");
            go("upgrade/" + w.name + "/done");
          } else {
            const w = {
              name: newDraft.name,
              state: "Running",
              version: template(newDraft.template).current,
              template: newDraft.template,
              selection: [...newDraft.selection],
              applied: [...newDraft.selection],
              apply: "applied",
            };
            data.workspaces.push(w);
            data.jobs.unshift(w.name + " create");
            go("new/done");
          }
        }
        if (f.id === "settings-form") {
          const required = $$("[data-required]:checked").map(
              (x) => x.dataset.required,
            ),
            groups = $$("[data-group]").map((el) => ({
              name: $("[data-group-name]", el).value.trim(),
              mode: $("[data-group-mode]", el).value,
              members: $$("[data-group-member]:checked", el).map(
                (x) => x.dataset.groupMember,
              ),
            })),
            error = $("#settings-error");
          const used = new Set(required);
          for (const g of groups) {
            if (!g.name || !g.members.length) {
              error.textContent =
                "Give every group a name and at least one policy.";
              return;
            }
            for (const p of g.members) {
              if (used.has(p)) {
                error.textContent =
                  p + " can be required or in one group only.";
                return;
              }
              if (data.outside.includes(p)) {
                error.textContent =
                  p +
                  " is outside the operator key’s grant. No job was started.";
                return;
              }
              used.add(p);
            }
          }
          if (new Set(groups.map((g) => g.name)).size !== groups.length) {
            error.textContent = "Group names must be unique.";
            return;
          }
          data.required = required;
          data.groups = groups;
          groupDraft = null;
          settingsDraft = null;
          for (const w of data.workspaces) {
            const added = required.filter((p) => !w.selection.includes(p));
            w.selection = [...new Set([...w.selection, ...required])];
            if (added.length && w.state !== "No folder") apply(w);
          }
          policyDrafts = {};
          render();
          toast("Policy settings saved");
        }
        if (f.classList.contains("apply-branch")) {
          data.jobs.unshift(f.dataset.workspace + " apply branch");
          render();
          toast("Branch applied");
        }
        if (f.classList.contains("delete-form")) {
          if (f.elements.confirmation.value !== f.dataset.name) {
            $(".error", f).textContent =
              "Type " + f.dataset.name + " to delete it.";
            return;
          }
          data.workspaces = data.workspaces.filter(
            (w) => w.name !== f.dataset.name,
          );
          render();
          toast("Workspace deleted");
        }
      });
      seed();
      fixture(location.hash.slice(1) || "workspaces");
    </script>
  </body>
</html>
