# relationships:
#   references: [menagerie]
#
# One release unit: the Menagerie image. Its version lives only in tags, and
# tags carry no v: Menagerie ships as a container image and nothing imports
# its Go module, so Go's v-prefixed module tags are not needed. The template
# service's Cargo.toml and the web UI's package.json are private build
# manifests and are not versioned.
$schema: https://intentional.foo/schemas/config.yml
contract: contract-1
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: component
discovery:
  managed-paths:
  - detector: go-module
    path: go.mod
    release-unit: menagerie
  excluded-paths:
  - detector: cargo-package
    path: template-service/Cargo.toml
    evidence-digest: sha256:725c6f2bcba446f5b54d90e13859096f73f3aa3040e02f316a025c94e015e7fe
  - detector: npm-package
    path: web/package.json
    evidence-digest: sha256:01d1920d054af1d6e3cabd2352fcf72ca13ac889571526cb049b40b7093501b3
release-units:
  menagerie:
    path: .
    projections:
    - adapter: go
      file: go.mod
      mode: none
    # The wyrd.foo product page shows the installed version.
    - adapter: yaml
      file: docs/user/docs.yml
      pointer: /products/menagerie/version
      mode: committed
    tags:
      primary:
        role: primary
        template: '{version}'
  # The public docs release on their own, so the docs footer can say which docs
  # describe which Menagerie version. Docs units are tag-only.
  menagerie-docs:
    path: docs/user
    depends-on:
    - menagerie
    projections:
    - adapter: yaml
      file: docs.yml
      pointer: /products/menagerie/docs-version
      mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
