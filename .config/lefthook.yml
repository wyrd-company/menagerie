# Hooks invoke tasks, never raw commands. One definition of how anything runs.
#
# pre-push stays cheap deliberately. A pre-push hook that runs the full suite
# teaches you to pass --no-verify, which silently disables pre-commit too.
# CI is the gate; hooks are fast feedback.

# pre-commit sees only the staged files. lefthook hides unstaged hunks of
# partially staged files while the jobs run and restores them afterwards,
# so formatting changes only what is being committed.
pre-commit:
  jobs:
    - name: format
      run: task format:staged -- {staged_files}
      stage_fixed: true
    - name: lint
      run: task lint:staged -- {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: task lint:commit-msg -- {1}
