# Menagerie configuration for the deployment example in compose.yml. The
# container reads it at /etc/menagerie/config.yml. The full reference is
# docs/specifications/configuration.yml.

# The same path as on the host: compose.yml mounts it at its own path.
workspace-root: /srv/menagerie/workspaces

# Backup repositories are registered in the interface. A host upgrading
# from a release before backup repositories keeps its old
# workspace-repository key for one start, which registers it once:
# workspace-repository: https://github.com/example-org/workspace-backups.git

# Where compose.yml mounts the Wyrwood consumer directory.
wyrwood-directory: /run/wyrwood

oidc:
  issuer: https://id.example.test
  client-id: menagerie
  redirect-url: https://menagerie.example.test/auth/callback

# Templates are registered in the interface, under Templates. A templates
# list from an earlier release is imported once at the first start and then
# no longer read; remove it once that start has run.

# The image of the throwaway containers that run initializeCommand and the
# hooks of templates registered without their own runner image. Without it,
# Menagerie's own image.
# runner-image: ghcr.io/example-org/workspace-runner:1.0.0

# The GitHub Apps Menagerie authenticates to GitHub with: installation tokens
# for the backup repositories that name an App, and for private https
# templates, from the first App on their server. Each App's private key is
# its Transit key transit-key, used through the Wyrwood vault socket. Add an
# entry for each organization's App. Without this section, only the SSH
# identity authenticates.
github-apps:
  - name: example-org
    app-id: 123456
    transit-key: menagerie-github-app

# Registry credentials read from OpenBao through the Wyrwood vault socket.
# Without this section every registry is anonymous.
# registry-credentials:
#   kv-mount: kv
#   registries:
#     - {registry: ghcr.io, path: menagerie/ghcr}

# Time limits on a job's running time; waiting for answers does not count.
# Without this section a job has no limit.
# job-limits:
#   default: 2h
#   phases:
#     build: 45m

# A webhook told about failed jobs and, past long-running, slow ones. The
# URL can carry a token; Menagerie never logs it.
# alerts:
#   webhook: https://ntfy.example.test/menagerie
#   long-running: 45m

# A socket in each workspace's devcontainer, at /run/menagerie/workspace.sock,
# with the workspace-commit client beside it: the devcontainer commits and
# backs up its own workspace. compose.yml mounts the folder at its own path.
# A second commit of a workspace within min-interval is refused.
workspace-socket:
  folder: /srv/menagerie/sockets
  # min-interval: 1m

# Commit and back up every idle workspace with changes, once an interval.
# Without this section nothing is committed on a schedule.
# auto-commit:
#   every: 1h

# What provisioning a workspace uses on this host. wyrwood locates the controller
# that holds workspaces' bindings and selects the operator key on ssh-agent.sock.
# xolotl issues and revokes workspaces' client keys: api_key in the secret holds
# Menagerie's scoped key, read through the Wyrwood vault socket. readiness-wait
# bounds each wait on a binding's status.
# provisioning:
#   readiness-wait: 2m
#   wyrwood:
#     controller: ssh://wyrwood-controller:2222
#     host-key: SHA256:<wyrwood controller host-key>
#     agent: sample-host
#     operator-key: menagerie-operator
#   xolotl:
#     url: http://xolotl:8317
#     key-secret:
#       kv-mount: kv
#       path: menagerie/xolotl
